<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
.header{background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(124,58,237,.3)}
.header-left h1{font-size:1.35rem;font-weight:700;color:#fff}
.header-left .subtitle{font-size:.78rem;color:rgba(255,255,255,.85);margin-top:3px}
.timer-box{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 18px;text-align:center;min-width:110px}
.timer-label{font-size:.65rem;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:1px}
.timer-value{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;color:#fff}
.timer-value.warning{color:#fbbf24}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.set-bar-label{font-size:.78rem;color:#64748b;font-weight:600;margin-right:4px}

.set-btn.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.progress-bar-wrap{background:#fff;padding:10px 28px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e2e8f0}

.flag-btn:hover{color:#f59e0b}

.code-block{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px 16px;margin:10px 0;font-family:'Courier New',monospace;font-size:.82rem;line-height:1.6;color:#a5f3fc;overflow-x:auto;white-space:pre}

.option:hover{border-color:#a78bfa;background:#faf5ff}
.option.selected{border-color:#7c3aed;background:#f5f3ff}
.option.correct-opt{border-color:#059669;background:#f0fdf4;color:#065f46}
.option.wrong-opt{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.option.show-correct{border-color:#059669;background:#f0fdf4;color:#065f46}
.opt-label{font-size:.78rem;font-weight:700;color:#7c3aed;background:#f5f3ff;border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.option.correct-opt .opt-label,.option.show-correct .opt-label{background:#d1fae5;color:#059669}
.option.wrong-opt .opt-label{background:#fee2e2;color:#dc2626}
.opt-text{font-size:.88rem;line-height:1.6;flex:1;white-space:normal;word-break:break-word;overflow-wrap:anywhere}
.explanation{margin-top:14px;padding:12px 16px;background:#f8fafc;border-radius:10px;border-left:3px solid #7c3aed;font-size:.84rem;line-height:1.65;color:#334155}
.explanation strong{color:#1e293b}
.explanation code{background:#e2e8f0;padding:1px 5px;border-radius:4px;font-family:'Courier New',monospace;font-size:.82em}
.result-badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:6px;margin-bottom:8px}
.result-badge.correct{background:#d1fae5;color:#059669}
.result-badge.wrong{background:#fee2e2;color:#dc2626}
.result-badge.missed{background:#f0fdf4;color:#059669;border:1px solid #059669}
.sticky-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 28px;display:flex;justify-content:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:100}
.btn{padding:10px 24px;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s;border:none}
.btn-primary{background:#7c3aed;color:#fff}
.btn-primary:hover{background:#6d28d9}
.btn-secondary{background:#f1f5f9;color:#475569;border:1.5px solid #e2e8f0}
.btn-secondary:hover{background:#e2e8f0}
.btn-success{background:#059669;color:#fff}
.btn-success:hover{background:#047857}
.results-header{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.results-header h2{font-size:1.5rem;font-weight:700;margin-bottom:8px}
.score-circle{display:inline-flex;align-items:center;justify-content:center;width:100px;height:100px;border-radius:50%;font-size:1.6rem;font-weight:800;margin:12px auto;border:5px solid}
.score-circle.pass{border-color:#059669;color:#059669;background:#f0fdf4}
.score-circle.fail{border-color:#dc2626;color:#dc2626;background:#fef2f2}
.results-stats{display:flex;justify-content:center;gap:24px;margin-top:12px;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-size:1.3rem;font-weight:700}
.stat-lbl{font-size:.72rem;color:#64748b;margin-top:2px}
.pass-msg{font-size:1rem;font-weight:600;margin-top:10px}
.pass-msg.pass{color:#059669}
.pass-msg.fail{color:#dc2626}
</style>

<script>
// ── QUESTION DATA ──────────────────────────────────────────────────────────
// SET 1 - 67 questions
const set1 = [
// IaC Concepts (3)
{domain:"IaC Concepts",text:"Which of the following best describes Infrastructure as Code (IaC)?",options:[{l:"A",t:"Manually provisioning infrastructure through a cloud provider's web console"},{l:"B",t:"Defining and managing infrastructure through machine-readable configuration files"},{l:"C",t:"Writing scripts that only document existing infrastructure"},{l:"D",t:"Using a GUI tool to drag-and-drop infrastructure components"}],correct:"B",exp:"IaC means defining infrastructure in <strong>machine-readable configuration files</strong> that can be versioned, reviewed, and automated. Manual console actions (A), documentation-only scripts (C), and GUI tools (D) do not qualify as IaC."},
{domain:"IaC Concepts",text:"What is a key advantage of declarative IaC over imperative scripting?",options:[{l:"A",t:"Declarative code runs faster than imperative scripts"},{l:"B",t:"You describe the desired end state and the tool determines how to reach it"},{l:"C",t:"Declarative tools require no authentication to cloud providers"},{l:"D",t:"Imperative scripts cannot create cloud resources"}],correct:"B",exp:"Declarative IaC lets you specify <strong>what</strong> you want; the tool (Terraform) figures out <strong>how</strong> to achieve it. Imperative scripts specify step-by-step how to do things. Performance (A), authentication (C), and capability claims (D) are not accurate distinctions."},
{domain:"IaC Concepts",text:"Which statement about idempotency in Terraform is correct?",options:[{l:"A",t:"Running terraform apply twice always creates duplicate resources"},{l:"B",t:"Terraform apply is idempotent: running it multiple times yields the same result if configuration is unchanged"},{l:"C",t:"Idempotency only applies to terraform destroy"},{l:"D",t:"Terraform requires a special flag to enable idempotent behavior"}],correct:"B",exp:"Terraform is <strong>idempotent</strong>: if configuration hasn't changed, repeated applies make no changes. It does not create duplicates (A), idempotency applies to all operations (C), and no special flag is needed (D)."},

// Terraform Purpose (2)
{domain:"Terraform Purpose",text:"What problem does Terraform solve that cloud-provider-specific tools like AWS CloudFormation do not?",options:[{l:"A",t:"Terraform is faster at provisioning AWS resources"},{l:"B",t:"Terraform supports managing infrastructure across multiple cloud providers with a single workflow"},{l:"C",t:"Terraform does not require API credentials"},{l:"D",t:"Terraform automatically backs up all resources it creates"}],correct:"B",exp:"Terraform's primary advantage over provider-specific tools is <strong>multi-cloud support</strong>: AWS, Azure, GCP, and hundreds of others via providers, all with one workflow. Speed (A), credentials (C), and automatic backups (D) are not accurate distinctions."},
{domain:"Terraform Purpose",text:"Terraform uses a plugin-based architecture. What are these plugins called?",options:[{l:"A",t:"Modules"},{l:"B",t:"Backends"},{l:"C",t:"Providers"},{l:"D",t:"Provisioners"}],correct:"C",exp:"<strong>Providers</strong> are the plugins that allow Terraform to interact with APIs (AWS, Azure, GCP, etc.). Modules are reusable configuration packages, backends store state, and provisioners run scripts on resources."},

// Terraform Basics (6)
{domain:"Terraform Basics",text:"What is the correct command sequence to initialize a new Terraform configuration and apply it?",options:[{l:"A",t:"terraform plan → terraform apply → terraform init"},{l:"B",t:"terraform init → terraform plan → terraform apply"},{l:"C",t:"terraform apply → terraform init → terraform plan"},{l:"D",t:"terraform validate → terraform apply → terraform init"}],correct:"B",exp:"The correct workflow is <code>terraform init</code> (downloads providers/modules) → <code>terraform plan</code> (shows changes) → <code>terraform apply</code> (makes changes). Init must always come first."},
{domain:"Terraform Basics",text:"Which file extension do Terraform configuration files use?",options:[{l:"A",t:".yaml"},{l:"B",t:".json only"},{l:"C",t:".tf"},{l:"D",t:".hcl only"}],correct:"C",exp:"Terraform configuration files use the <strong>.tf</strong> extension (HCL format). JSON configs use <code>.tf.json</code>. Neither .yaml nor .hcl alone are correct standard extensions."},
{domain:"Terraform Basics",text:"What does the terraform validate command do?",options:[{l:"A",t:"Validates that all resources exist in the cloud provider"},{l:"B",t:"Checks configuration syntax and internal consistency without accessing remote services"},{l:"C",t:"Validates the state file against live infrastructure"},{l:"D",t:"Validates provider credentials"}],correct:"B",exp:"<code>terraform validate</code> checks <strong>syntax and internal consistency</strong> of your HCL locally — it does not contact any APIs. It is not a live infrastructure check (A, C) and does not test credentials (D)."},
{domain:"Terraform Basics",text:"Which Terraform block type is used to declare a required provider and its version constraint?",options:[{l:"A",t:"provider block"},{l:"B",t:"resource block"},{l:"C",t:"terraform block with required_providers"},{l:"D",t:"variable block"}],correct:"C",exp:"The <code>terraform</code> block with <code>required_providers</code> is where you declare provider sources and version constraints. The <code>provider</code> block configures a provider after it's declared, not declares its requirement."},
{domain:"Terraform Basics",text:"What is the purpose of the .terraform.lock.hcl file?",options:[{l:"A",t:"It stores sensitive variable values encrypted"},{l:"B",t:"It locks the Terraform binary version for the project"},{l:"C",t:"It records exact provider versions and checksums to ensure consistent installs"},{l:"D",t:"It prevents other users from running terraform apply simultaneously"}],correct:"C",exp:"The <strong>dependency lock file</strong> records exact provider versions and checksums. This ensures all team members and CI pipelines use identical provider versions. It does not store secrets (A), lock CLI versions (B), or provide locking mechanisms (D)."},
{domain:"Terraform Basics",text:"In Terraform, what is a resource?",options:[{l:"A",t:"A reusable block of configuration stored in a separate directory"},{l:"B",t:"An infrastructure object managed by Terraform, such as an EC2 instance or S3 bucket"},{l:"C",t:"A read-only data object fetched from a provider"},{l:"D",t:"A variable that holds provider credentials"}],correct:"B",exp:"A <strong>resource</strong> is an infrastructure object that Terraform manages (creates, updates, destroys), like an EC2 instance. Reusable config blocks are modules (A), read-only fetches are data sources (C), and credentials are typically variables or environment variables (D)."},

// Providers (5)
{domain:"Providers",text:"Where does Terraform download providers from by default?",options:[{l:"A",t:"GitHub releases page"},{l:"B",t:"The Terraform Registry at registry.terraform.io"},{l:"C",t:"The HashiCorp S3 bucket"},{l:"D",t:"Directly from the cloud provider's website"}],correct:"B",exp:"By default, Terraform downloads providers from the <strong>Terraform Registry</strong> at registry.terraform.io. Custom sources can be configured, but the registry is the default."},
{domain:"Providers",text:"What happens if you define a provider block without any configuration arguments?",options:[{l:"A",t:"Terraform throws an error and refuses to initialize"},{l:"B",t:"Terraform uses default values and environment variables for provider configuration"},{l:"C",t:"The provider is ignored entirely"},{l:"D",t:"Terraform prompts interactively for all required fields"}],correct:"B",exp:"An empty provider block is valid. Terraform uses <strong>default values and environment variables</strong> (e.g., AWS_ACCESS_KEY_ID) to configure the provider. It doesn't error (A), ignore (C), or always prompt interactively (D)."},
{domain:"Providers",text:"How do you configure a second instance of the same provider with different settings in Terraform?",options:[{l:"A",t:"Create two separate provider files"},{l:"B",t:"Use the alias meta-argument in the provider block"},{l:"C",t:"Use a count meta-argument on the provider"},{l:"D",t:"Duplicate the required_providers entry with a different name"}],correct:"B",exp:"The <code>alias</code> meta-argument on a provider block creates a named alternate configuration. You then reference it in resources with <code>provider = aws.alias_name</code>. You cannot use count on providers (C) or duplicate required_providers entries (D)."},
{domain:"Providers",text:"Which version constraint syntax allows any version >= 1.2.0 but < 2.0.0?",options:[{l:"A",t:">= 1.2.0, < 2.0.0"},{l:"B",t:"~> 1.2"},{l:"C",t:"~> 1.2.0"},{l:"D",t:"Both A and B are equivalent"}],correct:"B",exp:"<code>~> 1.2</code> allows <strong>>= 1.2.0 and < 2.0.0</strong> (patch and minor updates). <code>~> 1.2.0</code> allows only >= 1.2.0 and < 1.3.0. Option A is explicit and equivalent to B but D is wrong because C is different from A."},
{domain:"Providers",text:"What is a provider alias used for?",options:[{l:"A",t:"Renaming a provider to avoid namespace conflicts"},{l:"B",t:"Using multiple configurations of the same provider, such as resources in different AWS regions"},{l:"C",t:"Pinning a provider to a specific version"},{l:"D",t:"Creating a private fork of a provider"}],correct:"B",exp:"Provider <strong>aliases</strong> allow multiple configurations of the same provider — most commonly to deploy resources in multiple AWS regions or accounts within one configuration. Version pinning uses version constraints (C)."},

// State (8)
{domain:"State",text:"What is the primary purpose of Terraform state?",options:[{l:"A",t:"To store HCL configuration files"},{l:"B",t:"To map Terraform resources to real-world infrastructure objects and track metadata"},{l:"C",t:"To cache provider binaries between runs"},{l:"D",t:"To store provider credentials securely"}],correct:"B",exp:"Terraform state <strong>maps configuration to real infrastructure</strong>. It tracks resource IDs, metadata, and dependencies so Terraform knows what exists and what needs to change. It does not store configs (A), provider binaries (C), or credentials (D)."},
{domain:"State",text:"Where is Terraform state stored by default?",options:[{l:"A",t:"In a HashiCorp Vault instance"},{l:"B",t:"In the cloud provider's managed storage"},{l:"C",t:"In a local file named terraform.tfstate"},{l:"D",t:"In the .terraform directory"}],correct:"C",exp:"By default, Terraform stores state locally in <strong>terraform.tfstate</strong>. Remote backends can change this, but the default is always the local file."},
{domain:"State",text:"Why is storing Terraform state in version control (e.g., Git) generally discouraged?",options:[{l:"A",t:"Git cannot store binary files"},{l:"B",t:"State files may contain sensitive data and lack locking, risking conflicts and secret exposure"},{l:"C",t:"Terraform cannot read state from a Git repository"},{l:"D",t:"State files are too large for Git's file size limits"}],correct:"B",exp:"State files can contain <strong>sensitive data</strong> (passwords, keys) in plaintext, and Git lacks a <strong>locking mechanism</strong> to prevent concurrent modifications. These are the primary reasons remote backends are preferred."},
{domain:"State",text:"What does terraform state list do?",options:[{l:"A",t:"Lists all Terraform configuration files in the directory"},{l:"B",t:"Lists all resources currently tracked in the Terraform state"},{l:"C",t:"Lists available remote backends"},{l:"D",t:"Lists all providers installed locally"}],correct:"B",exp:"<code>terraform state list</code> outputs all <strong>resource addresses</strong> currently tracked in state, such as <code>aws_instance.web</code>. It does not list config files (A), backends (C), or providers (D)."},
{domain:"State",text:"What command removes a resource from Terraform state without destroying the actual infrastructure?",options:[{l:"A",t:"terraform destroy -target"},{l:"B",t:"terraform state delete"},{l:"C",t:"terraform state rm"},{l:"D",t:"terraform untag"}],correct:"C",exp:"<code>terraform state rm</code> <strong>removes a resource from state</strong> without affecting real infrastructure. This is used when you want Terraform to stop managing a resource. <code>terraform destroy -target</code> actually destroys the resource."},
{domain:"State",text:"What is state locking in Terraform?",options:[{l:"A",t:"Encrypting the state file at rest"},{l:"B",t:"Preventing concurrent state modifications by acquiring an exclusive lock during operations"},{l:"C",t:"Making the state file read-only after first apply"},{l:"D",t:"Locking provider versions in state"}],correct:"B",exp:"State locking <strong>prevents concurrent modifications</strong> by acquiring an exclusive lock during operations like apply and destroy. Not all backends support it (S3 requires DynamoDB for locking). It is not encryption (A) or version locking (D)."},
{domain:"State",text:"Which command is used to manually reconcile state when Terraform's state doesn't match actual infrastructure?",options:[{l:"A",t:"terraform sync"},{l:"B",t:"terraform state refresh"},{l:"C",t:"terraform refresh"},{l:"D",t:"terraform reconcile"}],correct:"C",exp:"<code>terraform refresh</code> updates the state file to match the <strong>actual infrastructure</strong> without making changes. Note: <code>terraform refresh</code> is now incorporated into plan/apply by default. There is no <code>terraform sync</code> or <code>terraform reconcile</code> command."},
{domain:"State",text:"What does the terraform state mv command do?",options:[{l:"A",t:"Moves the state file to a different directory"},{l:"B",t:"Moves a resource to a different remote backend"},{l:"C",t:"Renames or moves a resource within the state without recreating it"},{l:"D",t:"Migrates state from local to remote backend"}],correct:"C",exp:"<code>terraform state mv</code> <strong>renames or moves a resource address within state</strong>, preventing unnecessary destroy/recreate cycles. For example, renaming a module or resource. It does not move files (A) or migrate backends (D)."},

// Backends (4)
{domain:"Backends",text:"What is a Terraform backend?",options:[{l:"A",t:"The cloud provider API that Terraform communicates with"},{l:"B",t:"The configuration that determines where and how state is stored and operations are executed"},{l:"C",t:"A type of Terraform provider for storage services"},{l:"D",t:"The local directory where provider binaries are cached"}],correct:"B",exp:"A <strong>backend</strong> defines where Terraform stores state and optionally where operations run. Examples: local, S3, Azure Blob, HCP Terraform. It is not the provider API (A) or provider type (C)."},
{domain:"Backends",text:"Which AWS services are typically combined to provide a remote backend with state locking for Terraform?",options:[{l:"A",t:"S3 + CloudFront"},{l:"B",t:"S3 + DynamoDB"},{l:"C",t:"EFS + ElastiCache"},{l:"D",t:"RDS + S3"}],correct:"B",exp:"The standard AWS remote backend uses <strong>S3 for state storage</strong> and <strong>DynamoDB for state locking and consistency checking</strong>. CloudFront (A) is a CDN, EFS/ElastiCache (C) and RDS (D) are not used for Terraform state locking."},
{domain:"Backends",text:"What command migrates Terraform state to a new backend?",options:[{l:"A",t:"terraform state migrate"},{l:"B",t:"terraform backend migrate"},{l:"C",t:"terraform init (with the new backend configured)"},{l:"D",t:"terraform push"}],correct:"C",exp:"Re-running <code>terraform init</code> after changing the backend configuration triggers the <strong>backend migration wizard</strong>, offering to copy state to the new backend. There is no separate migrate command."},
{domain:"Backends",text:"What is a partial backend configuration?",options:[{l:"A",t:"A backend configured with only some providers"},{l:"B",t:"Providing some backend settings in config and the rest via -backend-config flags or files at init time"},{l:"C",t:"A backend that only stores part of the state file"},{l:"D",t:"A read-only backend that cannot store state changes"}],correct:"B",exp:"<strong>Partial configuration</strong> lets you omit sensitive backend settings from version-controlled files and pass them via <code>-backend-config</code> flags or separate files during <code>terraform init</code>. This is a security best practice."},

// Configuration (8)
{domain:"Configuration",text:"What is the correct syntax to define an input variable with a default value in Terraform?",options:[{l:"A",t:'variable "name" { value = "default" }'},{l:"B",t:'variable "name" { default = "myvalue" }'},{l:"C",t:'input "name" { default = "myvalue" }'},{l:"D",t:'var "name" = "myvalue"'}],correct:"B",exp:"Input variables use <code>variable \"name\" { default = \"value\" }</code>. The key is <code>default</code>, not <code>value</code> (A). There is no <code>input</code> block (C) or <code>var</code> assignment syntax (D) in Terraform."},
{domain:"Configuration",text:"How do you reference an input variable named 'region' inside a Terraform configuration?",options:[{l:"A",t:"${region}"},{l:"B",t:"input.region"},{l:"C",t:"var.region"},{l:"D",t:"variable.region"}],correct:"C",exp:"Input variables are referenced with the <code>var.</code> prefix: <code>var.region</code>. The <code>${region}</code> syntax is incomplete (A), and <code>input.region</code> (B) and <code>variable.region</code> (D) are not valid Terraform references."},
{domain:"Configuration",text:"What is an output value in Terraform used for?",options:[{l:"A",t:"To define default values for variables"},{l:"B",t:"To expose resource attribute values to the user or to other modules"},{l:"C",t:"To output debugging information during terraform plan"},{l:"D",t:"To define environment variables for provisioners"}],correct:"B",exp:"<strong>Outputs</strong> expose resource attributes to the CLI after apply, to parent modules, and to HCP Terraform. They are not for defaults (A), debugging (C), or environment variables (D)."},
{domain:"Configuration",text:"Which type constraint would you use for a variable that accepts a map of strings?",options:[{l:"A",t:"type = list(string)"},{l:"B",t:"type = set(string)"},{l:"C",t:"type = map(string)"},{l:"D",t:"type = object({})"}],correct:"C",exp:"<code>map(string)</code> accepts a key-value map where all values are strings. <code>list(string)</code> is an ordered list, <code>set(string)</code> is an unordered unique list, and <code>object</code> defines specific named attributes."},
{domain:"Configuration",text:"What is a local value in Terraform?",options:[{l:"A",t:"A variable that can only be set via the command line"},{l:"B",t:"A named expression that can be reused within a module to avoid repetition"},{l:"C",t:"A value stored only in the local state file"},{l:"D",t:"A variable scoped to a single resource block"}],correct:"B",exp:"<strong>Local values</strong> (defined in <code>locals</code> blocks) are named expressions reused within a module. They simplify configuration and reduce repetition. They are not CLI-only (A), state-specific (C), or resource-scoped (D)."},
{domain:"Configuration",text:"How do you mark a Terraform output as sensitive?",options:[{l:"A",t:"Add sensitive = true to the output block"},{l:"B",t:"Prefix the output name with secret_"},{l:"C",t:"Use the sensitive() function when referencing the value"},{l:"D",t:"Store it in a .tfvars file"}],correct:"A",exp:"Setting <code>sensitive = true</code> in an output block <strong>redacts the value in CLI output</strong>. Name prefixes (B) have no effect, <code>sensitive()</code> function marks values within expressions (C, related but not the output block setting), and .tfvars doesn't affect output sensitivity (D)."},
{domain:"Configuration",text:"What is the purpose of terraform.tfvars file?",options:[{l:"A",t:"It defines provider configurations"},{l:"B",t:"It automatically provides variable values without needing -var flags"},{l:"C",t:"It stores Terraform state locally"},{l:"D",t:"It defines output values for the root module"}],correct:"B",exp:"<code>terraform.tfvars</code> (and <code>*.auto.tfvars</code>) are <strong>automatically loaded</strong> by Terraform to set variable values, avoiding repetitive <code>-var</code> flags. It does not define providers (A), store state (C), or define outputs (D)."},
{domain:"Configuration",text:"Which of the following is a valid way to pass variable values to Terraform? (Choose all that apply)",options:[{l:"A",t:"-var flag on the command line"},{l:"B",t:"Environment variables prefixed with TF_VAR_"},{l:"C",t:"A .tfvars file"},{l:"D",t:"All of the above"}],correct:"D",multi:true,exp:"Terraform accepts variable values via <strong>all three methods</strong>: <code>-var</code> CLI flags, <code>TF_VAR_</code> environment variables, and <code>.tfvars</code> files. All are valid and have a defined precedence order."},

// Meta-Arguments (5)
{domain:"Meta-Arguments",text:"What does the count meta-argument do in a resource block?",options:[{l:"A",t:"Counts the number of existing resources in state"},{l:"B",t:"Creates multiple instances of a resource based on a numeric value"},{l:"C",t:"Limits the number of concurrent API calls"},{l:"D",t:"Sets the priority of a resource during apply"}],correct:"B",exp:"<code>count</code> creates <strong>multiple instances</strong> of a resource. Set <code>count = 3</code> to create 3 identical resources. Instances are indexed as <code>resource.name[0]</code>, <code>[1]</code>, etc."},
{domain:"Meta-Arguments",text:"What is the advantage of for_each over count when creating multiple resources?",options:[{l:"A",t:"for_each is faster than count"},{l:"B",t:"for_each creates resources keyed by map keys or set values, making them individually addressable and stable"},{l:"C",t:"for_each works with any collection while count only works with numbers"},{l:"D",t:"for_each supports more resource types than count"}],correct:"B",exp:"<code>for_each</code> uses <strong>stable string keys</strong> (map keys or set values) to identify resources. Removing one resource doesn't shift indexes like count does. Both work with all resource types (D is false)."},
{domain:"Meta-Arguments",text:"What does the depends_on meta-argument do?",options:[{l:"A",t:"Specifies the order in which providers are initialized"},{l:"B",t:"Creates an explicit dependency when implicit dependencies are insufficient"},{l:"C",t:"Marks a resource as dependent on a specific Terraform version"},{l:"D",t:"Defines which modules a resource depends on"}],correct:"B",exp:"<code>depends_on</code> creates an <strong>explicit dependency</strong> for cases where Terraform cannot infer the relationship automatically (e.g., a resource depends on a side effect of another). It handles resource and module-level ordering."},
{domain:"Meta-Arguments",text:"Which lifecycle meta-argument prevents Terraform from destroying a resource before creating its replacement?",options:[{l:"A",t:"prevent_destroy = true"},{l:"B",t:"create_before_destroy = true"},{l:"C",t:"ignore_changes = all"},{l:"D",t:"replace_triggered_by"}],correct:"B",exp:"<code>create_before_destroy = true</code> tells Terraform to <strong>create the new resource first</strong>, then destroy the old one. This is important for resources that cannot have downtime. <code>prevent_destroy</code> stops all destroy operations."},
{domain:"Meta-Arguments",text:"What does ignore_changes in a lifecycle block do?",options:[{l:"A",t:"Ignores all errors during terraform apply"},{l:"B",t:"Prevents Terraform from updating a resource when specified attributes change outside of Terraform"},{l:"C",t:"Skips validation checks for specified attributes"},{l:"D",t:"Ignores changes to provider configuration"}],correct:"B",exp:"<code>ignore_changes</code> tells Terraform to <strong>ignore drift on specified attributes</strong>. If those attributes are modified outside Terraform, Terraform will not try to revert them on the next apply."},

// Modules (5)
{domain:"Modules",text:"What is the minimum required argument when calling a module in Terraform?",options:[{l:"A",t:"version"},{l:"B",t:"source"},{l:"C",t:"providers"},{l:"D",t:"inputs"}],correct:"B",exp:"The <code>source</code> argument is the <strong>only required argument</strong> in a module block. It tells Terraform where to find the module (local path, registry, Git, etc.). Version is recommended but optional; providers and inputs are optional."},
{domain:"Modules",text:"Which of the following is a valid module source?",options:[{l:"A",t:"./modules/vpc (local path)"},{l:"B",t:"hashicorp/consul/aws (Terraform Registry)"},{l:"C",t:"git::https://github.com/org/repo.git (Git URL)"},{l:"D",t:"All of the above"}],correct:"D",exp:"Terraform supports <strong>all of these module sources</strong>: local paths, Terraform Registry, Git URLs, GitHub, Bitbucket, HTTP URLs, S3 buckets, and GCS buckets."},
{domain:"Modules",text:"How do you pass a value from a parent module to a child module?",options:[{l:"A",t:"Using module output blocks in the parent"},{l:"B",t:"Declaring the value as an input variable in the child and passing it as an argument in the module call"},{l:"C",t:"Using the inherit keyword in the child module"},{l:"D",t:"Setting a global variable accessible to all modules"}],correct:"B",exp:"Parent-to-child data flows via <strong>input variables</strong>: declare <code>variable</code> in the child, then set it as an argument (<code>var_name = value</code>) in the <code>module</code> block in the parent. There is no <code>inherit</code> keyword (C)."},
{domain:"Modules",text:"How do you access an output from a child module in the parent module?",options:[{l:"A",t:"child.output_name"},{l:"B",t:"module.module_name.output_name"},{l:"C",t:"output.module_name.value"},{l:"D",t:"var.module_name.output_name"}],correct:"B",exp:"Child module outputs are accessed as <code>module.&lt;module_name&gt;.&lt;output_name&gt;</code>. For example, <code>module.vpc.subnet_id</code>. The other syntaxes are not valid Terraform references."},
{domain:"Modules",text:"What does the terraform get command do?",options:[{l:"A",t:"Retrieves the current state from a remote backend"},{l:"B",t:"Downloads and installs modules referenced in the configuration"},{l:"C",t:"Fetches provider updates from the registry"},{l:"D",t:"Gets the list of available workspaces"}],correct:"B",exp:"<code>terraform get</code> <strong>downloads modules</strong> into the .terraform directory. Note: <code>terraform init</code> also does this and additionally initializes backends and providers, making <code>get</code> rarely needed on its own."},

// CLI (5)
{domain:"CLI",text:"What does the -auto-approve flag do when passed to terraform apply?",options:[{l:"A",t:"Automatically approves all cost estimates"},{l:"B",t:"Skips the interactive approval prompt and applies changes immediately"},{l:"C",t:"Automatically resolves merge conflicts in state"},{l:"D",t:"Pre-approves the plan for review by a team member"}],correct:"B",exp:"<code>-auto-approve</code> <strong>bypasses the confirmation prompt</strong> so Terraform applies without waiting for user input. This is commonly used in CI/CD pipelines. It does not relate to cost estimates (A) or team approvals (D)."},
{domain:"CLI",text:"What does terraform fmt do?",options:[{l:"A",t:"Validates configuration syntax"},{l:"B",t:"Formats Terraform configuration files to the canonical style"},{l:"C",t:"Formats the state file as JSON"},{l:"D",t:"Formats provider output as human-readable text"}],correct:"B",exp:"<code>terraform fmt</code> rewrites <strong>Terraform configuration files</strong> to the canonical format with proper indentation and alignment. It does not validate logic (A), format state (C), or format provider output (D)."},
{domain:"CLI",text:"Which command shows the current state of resources in a human-readable format?",options:[{l:"A",t:"terraform state list"},{l:"B",t:"terraform output"},{l:"C",t:"terraform show"},{l:"D",t:"terraform describe"}],correct:"C",exp:"<code>terraform show</code> displays the <strong>current state or a saved plan</strong> in human-readable format. <code>state list</code> shows only resource addresses, <code>output</code> shows only output values, and <code>terraform describe</code> does not exist."},
{domain:"CLI",text:"What does the terraform taint command do in older Terraform versions?",options:[{l:"A",t:"Marks a resource as corrupted in the cloud provider"},{l:"B",t:"Marks a resource in state for forced replacement on the next apply"},{l:"C",t:"Tags a resource with a taint label in the cloud console"},{l:"D",t:"Removes a resource from state permanently"}],correct:"B",exp:"<code>terraform taint</code> <strong>marks a resource for replacement</strong> in state, so the next apply destroys and recreates it. In Terraform 0.15.2+, <code>terraform apply -replace</code> is preferred. It does not affect cloud tagging (C) or permanently remove state (D)."},
{domain:"CLI",text:"What does the -target flag do in terraform plan or apply?",options:[{l:"A",t:"Sets the target deployment environment"},{l:"B",t:"Limits the operation to specific resources or modules"},{l:"C",t:"Targets a specific provider version"},{l:"D",t:"Specifies the target backend for state storage"}],correct:"B",exp:"The <code>-target</code> flag <strong>limits plan/apply to specific resources</strong>. It's useful for debugging but HashiCorp recommends against regular use as it can leave configuration and state inconsistent."},

// Data Sources (2)
{domain:"Data Sources",text:"What is a data source in Terraform?",options:[{l:"A",t:"A resource that stores data in a database"},{l:"B",t:"A configuration block that reads existing infrastructure information without managing it"},{l:"C",t:"A type of backend that sources state from another workspace"},{l:"D",t:"An external script that provides data to Terraform"}],correct:"B",exp:"A <strong>data source</strong> reads existing information from a provider (e.g., an AMI ID, VPC ID) without creating or managing resources. It's read-only. Not a database resource (A), backend type (C), or external script (D)."},
{domain:"Data Sources",text:"How do you reference a data source in Terraform configuration?",options:[{l:"A",t:"source.type.name.attribute"},{l:"B",t:"data.type.name.attribute"},{l:"C",t:"read.type.name.attribute"},{l:"D",t:"fetch.type.name.attribute"}],correct:"B",exp:"Data sources are referenced with the <code>data.</code> prefix: <code>data.aws_ami.ubuntu.id</code>. The <code>data</code> prefix distinguishes them from managed resources which use just the resource type and name."},

// Functions (4)
{domain:"Functions",text:"What does the length() function return in Terraform?",options:[{l:"A",t:"The byte size of a string"},{l:"B",t:"The number of elements in a list, map, or set, or the number of characters in a string"},{l:"C",t:"The maximum value in a list of numbers"},{l:"D",t:"The word count of a string"}],correct:"B",exp:"<code>length()</code> returns the <strong>number of elements</strong> in a collection or the number of Unicode characters in a string. For byte size use <code>lengthbytes()</code> equivalent functions aren't standard; for max use <code>max()</code>."},
{domain:"Functions",text:"Which function converts a string to all lowercase in Terraform?",options:[{l:"A",t:"to_lower()"},{l:"B",t:"str_lower()"},{l:"C",t:"lower()"},{l:"D",t:"downcase()"}],correct:"C",exp:"The <code>lower()</code> function converts a string to <strong>all lowercase</strong>. Terraform's built-in string functions use simple names: <code>upper()</code>, <code>lower()</code>, <code>title()</code>, <code>trim()</code>, etc."},
{domain:"Functions",text:"What does the join() function do in Terraform?",options:[{l:"A",t:"Joins two modules together"},{l:"B",t:"Concatenates a list of strings with a delimiter"},{l:"C",t:"Combines two maps into one"},{l:"D",t:"Merges two state files"}],correct:"B",exp:"<code>join(delimiter, list)</code> <strong>concatenates list strings</strong> with the delimiter. Example: <code>join(\",\", [\"a\",\"b\",\"c\"])</code> returns <code>\"a,b,c\"</code>. Use <code>merge()</code> to combine maps (C)."},
{domain:"Functions",text:"What does the lookup() function do?",options:[{l:"A",t:"Searches for a resource in state by name"},{l:"B",t:"Retrieves a value from a map by key, returning a default if the key doesn't exist"},{l:"C",t:"Looks up the provider registry for available versions"},{l:"D",t:"Finds the index of an element in a list"}],correct:"B",exp:"<code>lookup(map, key, default)</code> retrieves a value from a map, returning the <strong>default value</strong> if the key doesn't exist. This prevents errors on missing keys. Use <code>index()</code> for list position (D)."},

// Workspaces (2)
{domain:"Workspaces",text:"What is the primary use case for Terraform workspaces?",options:[{l:"A",t:"To separate provider configurations for different teams"},{l:"B",t:"To manage multiple distinct state files for the same configuration, such as dev/staging/prod environments"},{l:"C",t:"To isolate modules in separate directories"},{l:"D",t:"To create separate Terraform registry namespaces"}],correct:"B",exp:"Workspaces allow <strong>multiple state files</strong> from the same configuration, useful for separate environment instances. Each workspace has its own state. Note: many teams prefer separate directories or repositories for true environment isolation."},
{domain:"Workspaces",text:"How do you reference the current workspace name inside Terraform configuration?",options:[{l:"A",t:"var.workspace"},{l:"B",t:"terraform.environment"},{l:"C",t:"terraform.workspace"},{l:"D",t:"workspace.current"}],correct:"C",exp:"The current workspace name is exposed as <code>terraform.workspace</code>, a built-in value. Example: <code>\"${terraform.workspace}-vpc\"</code>. It is not a variable (A) or accessed via <code>terraform.environment</code> (B)."},

// Provisioners (2)
{domain:"Provisioners",text:"When should provisioners be used in Terraform?",options:[{l:"A",t:"As the primary method for configuring software on resources"},{l:"B",t:"As a last resort when no provider-native resource or data source covers the requirement"},{l:"C",t:"Whenever you need to run a script during infrastructure creation"},{l:"D",t:"Only with the null_resource type"}],correct:"B",exp:"HashiCorp recommends provisioners as a <strong>last resort</strong> because they add complexity, cannot be tracked in state, and can make configurations fragile. Native resources and tools like cloud-init are preferred. They can be used with any resource (D is wrong)."},
{domain:"Provisioners",text:"What is the difference between local-exec and remote-exec provisioners?",options:[{l:"A",t:"local-exec runs on the created resource; remote-exec runs on the Terraform host"},{l:"B",t:"local-exec runs on the machine running Terraform; remote-exec runs on the created resource via SSH or WinRM"},{l:"C",t:"local-exec is for Linux resources; remote-exec is for Windows resources"},{l:"D",t:"local-exec only works with null_resource; remote-exec works with compute resources"}],correct:"B",exp:"<code>local-exec</code> runs commands on the <strong>Terraform host</strong> (your laptop or CI server). <code>remote-exec</code> connects to the <strong>created resource</strong> via SSH or WinRM to run commands. A and B are reversed in option A."},

// HCP Terraform (3)
{domain:"HCP Terraform",text:"What is HCP Terraform (formerly Terraform Cloud)?",options:[{l:"A",t:"A free, self-hosted version of Terraform Enterprise"},{l:"B",t:"A SaaS platform by HashiCorp providing remote state, remote runs, policy enforcement, and team collaboration"},{l:"C",t:"A cloud provider plugin for Terraform"},{l:"D",t:"The open-source version of Terraform"}],correct:"B",exp:"HCP Terraform is <strong>HashiCorp's SaaS platform</strong> (cloud.hashicorp.com) offering remote state storage, remote plan/apply execution, Sentinel policy enforcement, team access controls, and VCS integration. It is not self-hosted (A) or a provider plugin (C)."},
{domain:"HCP Terraform",text:"What is Sentinel in the context of HCP Terraform?",options:[{l:"A",t:"A monitoring agent that watches for infrastructure drift"},{l:"B",t:"A policy-as-code framework that enforces compliance rules before infrastructure changes are applied"},{l:"C",t:"A secret management tool integrated with Terraform"},{l:"D",t:"An AI assistant that reviews Terraform plans"}],correct:"B",exp:"<strong>Sentinel</strong> is HashiCorp's policy-as-code framework embedded in HCP Terraform. It evaluates policies against Terraform plans before apply, enforcing compliance (e.g., no public S3 buckets). Not monitoring (A) or secret management (C)."},
{domain:"HCP Terraform",text:"In HCP Terraform, what is a workspace?",options:[{l:"A",t:"Equivalent to a Terraform CLI workspace — just a separate state file"},{l:"B",t:"A unit of infrastructure that contains configuration, state, variables, and run history"},{l:"C",t:"A Git repository connected to HCP Terraform"},{l:"D",t:"A team permission group in HCP Terraform"}],correct:"B",exp:"HCP Terraform workspaces are richer than CLI workspaces: they contain <strong>configuration, state, variables, run history, and access controls</strong>. They are more like separate projects than just state file variants (A)."},

// Import (1)
{domain:"Import",text:"What does terraform import do?",options:[{l:"A",t:"Imports a module from the Terraform Registry into your configuration"},{l:"B",t:"Brings existing infrastructure under Terraform management by adding it to state"},{l:"C",t:"Imports variable values from a .tfvars file"},{l:"D",t:"Copies state from one workspace to another"}],correct:"B",exp:"<code>terraform import</code> <strong>adds existing infrastructure to Terraform state</strong> so Terraform can manage it. You must still write the matching configuration manually (or use the newer config generation feature). It does not import modules (A) or variables (C)."},

// Concepts (2)
{domain:"Concepts",text:"What is the Terraform execution plan?",options:[{l:"A",t:"A schedule for when Terraform runs will execute"},{l:"B",t:"A preview of changes Terraform will make, showing resources to add, change, or destroy"},{l:"C",t:"A document outlining the cost of provisioned infrastructure"},{l:"D",t:"A log of all previous terraform apply operations"}],correct:"B",exp:"The <strong>execution plan</strong> (from <code>terraform plan</code>) previews what Terraform will do: resources to create (+), modify (~), or destroy (-). This allows review before committing changes. Not a schedule (A), cost estimate (C), or log (D)."},
{domain:"Concepts",text:"What does 'infrastructure drift' mean in the context of Terraform?",options:[{l:"A",t:"Terraform configuration that gradually becomes outdated"},{l:"B",t:"A difference between the actual infrastructure state and the state recorded in Terraform's state file"},{l:"C",t:"The gradual degradation of infrastructure performance over time"},{l:"D",t:"Uncommitted changes in Terraform configuration files"}],correct:"B",exp:"<strong>Infrastructure drift</strong> occurs when actual infrastructure differs from what Terraform's state records — typically from manual changes outside Terraform. Terraform detects this during refresh/plan and proposes corrections."}
];
// SET 2 - 67 questions
const set2 = [
// IaC Concepts (3)
{domain:"IaC Concepts",text:"Which of the following is a benefit of storing infrastructure configuration in version control?",options:[{l:"A",t:"It speeds up resource provisioning"},{l:"B",t:"It provides change history, peer review capability, and rollback options"},{l:"C",t:"It automatically encrypts sensitive values"},{l:"D",t:"It eliminates the need for a Terraform backend"}],correct:"B",exp:"Version control provides <strong>audit history, code review workflows, and rollback</strong> — core benefits of IaC. It doesn't speed up provisioning (A), encrypt secrets (C), or replace backends (D)."},
{domain:"IaC Concepts",text:"What distinguishes mutable infrastructure from immutable infrastructure?",options:[{l:"A",t:"Mutable infrastructure uses Terraform; immutable uses Ansible"},{l:"B",t:"Mutable infrastructure is updated in-place; immutable infrastructure is replaced entirely on change"},{l:"C",t:"Mutable infrastructure is more reliable than immutable"},{l:"D",t:"Immutable infrastructure requires more cloud resources"}],correct:"B",exp:"<strong>Mutable</strong> infra is modified in-place (e.g., apt upgrade on a running server). <strong>Immutable</strong> infra replaces the whole unit (new AMI bake, new instance). Terraform encourages immutable patterns via create_before_destroy."},
{domain:"IaC Concepts",text:"Which Terraform concept enables teams to collaborate on infrastructure by storing state remotely?",options:[{l:"A",t:"Workspaces"},{l:"B",t:"Remote backends"},{l:"C",t:"Modules"},{l:"D",t:"Providers"}],correct:"B",exp:"<strong>Remote backends</strong> store state in a shared location (S3, HCP Terraform, etc.) enabling team collaboration. Without a remote backend, state is local and not shareable. Workspaces are for environment isolation, not necessarily collaboration."},

// Terraform Purpose (2)
{domain:"Terraform Purpose",text:"Terraform's provider ecosystem is maintained by which parties?",options:[{l:"A",t:"Only HashiCorp employees"},{l:"B",t:"Only cloud providers like AWS and Azure"},{l:"C",t:"HashiCorp, cloud providers, and the community (three tiers)"},{l:"D",t:"Only open-source contributors with no corporate involvement"}],correct:"C",exp:"The Terraform provider ecosystem has <strong>three tiers</strong>: Official (HashiCorp), Partner (verified cloud providers), and Community (third-party/open-source). This broad ecosystem is a major strength of Terraform."},
{domain:"Terraform Purpose",text:"What does Terraform's 'plan, apply, destroy' lifecycle enable?",options:[{l:"A",t:"Continuous monitoring of infrastructure"},{l:"B",t:"A controlled, reviewable, reversible workflow for managing infrastructure"},{l:"C",t:"Automatic scaling of cloud resources"},{l:"D",t:"Real-time cost optimization"}],correct:"B",exp:"The <strong>plan → apply → destroy</strong> lifecycle gives practitioners a controlled workflow: preview changes (plan), execute them (apply), and fully remove resources (destroy). This makes infrastructure changes deliberate and reviewable."},

// Terraform Basics (6)
{domain:"Terraform Basics",text:"What is the difference between terraform plan -out=file and running terraform plan without -out?",options:[{l:"A",t:"They are identical in all respects"},{l:"B",t:"The -out flag saves the plan to a file so the exact same changes can be applied with terraform apply file"},{l:"C",t:"The -out flag sends the plan to HCP Terraform"},{l:"D",t:"The -out flag creates a human-readable HTML report"}],correct:"B",exp:"<code>-out=planfile</code> <strong>saves the plan binary</strong>. Running <code>terraform apply planfile</code> applies exactly those changes without re-planning. This guarantees what was reviewed is what gets applied — critical for controlled deployments."},
{domain:"Terraform Basics",text:"What happens to resources in state when you run terraform destroy?",options:[{l:"A",t:"Resources are removed from state but remain in the cloud"},{l:"B",t:"All resources managed in state are destroyed in the cloud and removed from state"},{l:"C",t:"State is deleted but cloud resources remain"},{l:"D",t:"Only resources with prevent_destroy = false are destroyed"}],correct:"B",exp:"<code>terraform destroy</code> <strong>destroys all managed resources</strong> and removes them from state. Resources with <code>prevent_destroy = true</code> in lifecycle will cause the operation to error rather than skip silently."},
{domain:"Terraform Basics",text:"Which directory does terraform init create to store downloaded providers and modules?",options:[{l:"A",t:".tf-cache"},{l:"B",t:".terraform"},{l:"C",t:"terraform-plugins"},{l:"D",t:".hashicorp"}],correct:"B",exp:"<code>terraform init</code> creates the <strong>.terraform</strong> directory in your project root, storing provider binaries, module downloads, and backend configuration. This directory should typically be added to .gitignore."},
{domain:"Terraform Basics",text:"What is a Terraform workspace's relationship to its state file?",options:[{l:"A",t:"All workspaces share one state file"},{l:"B",t:"Each workspace has its own separate state file"},{l:"C",t:"Workspaces merge state files from multiple directories"},{l:"D",t:"The default workspace has no state file"}],correct:"B",exp:"Each Terraform workspace maintains its <strong>own independent state file</strong>. This allows the same configuration to manage multiple environment instances (dev, staging, prod) independently."},
{domain:"Terraform Basics",text:"What is the required_version setting in the terraform block used for?",options:[{l:"A",t:"Specifying the version of the configuration syntax"},{l:"B",t:"Constraining which versions of the Terraform CLI can use this configuration"},{l:"C",t:"Setting the minimum provider version"},{l:"D",t:"Defining the version of the state file format"}],correct:"B",exp:"<code>required_version</code> constrains which <strong>Terraform CLI versions</strong> can run the configuration. If the CLI version doesn't match, Terraform errors out. This prevents using too-old CLI versions that might not support features used."},
{domain:"Terraform Basics",text:"What does the -refresh=false flag do during terraform plan?",options:[{l:"A",t:"Prevents Terraform from downloading provider updates"},{l:"B",t:"Skips reconciling state with real infrastructure, using only the cached state"},{l:"C",t:"Disables refreshing of variable values from environment"},{l:"D",t:"Prevents automatic refresh of the lock file"}],correct:"B",exp:"<code>-refresh=false</code> tells Terraform to <strong>skip querying the provider APIs</strong> for the current state of resources, relying entirely on cached state. This speeds up plan but may miss out-of-band changes."},

// Providers (5)
{domain:"Providers",text:"What does the lock file (.terraform.lock.hcl) prevent?",options:[{l:"A",t:"Other users from accessing the state file"},{l:"B",t:"Unintended provider upgrades that could break your configuration"},{l:"C",t:"Running terraform apply without running plan first"},{l:"D",t:"Accidental deletion of the .terraform directory"}],correct:"B",exp:"The lock file records exact provider versions and checksums, preventing <strong>unintended upgrades</strong> to newer provider versions that might introduce breaking changes. Run <code>terraform init -upgrade</code> to intentionally update."},
{domain:"Providers",text:"Which command updates the provider lock file to allow newer versions?",options:[{l:"A",t:"terraform update"},{l:"B",t:"terraform providers update"},{l:"C",t:"terraform init -upgrade"},{l:"D",t:"terraform lock -upgrade"}],correct:"C",exp:"<code>terraform init -upgrade</code> <strong>upgrades providers</strong> to the newest version allowed by version constraints and updates the lock file. There is no <code>terraform update</code> or <code>terraform lock -upgrade</code> command."},
{domain:"Providers",text:"How do you specify that a resource should use a non-default provider configuration?",options:[{l:"A",t:"Add the provider name as a prefix to the resource type"},{l:"B",t:'Use the provider meta-argument: provider = aws.alias_name'},{l:"C",t:"Set the region in the resource block directly"},{l:"D",t:"Use a separate provider block inside the resource block"}],correct:"B",exp:"The <code>provider</code> meta-argument in a resource block selects a <strong>non-default provider alias</strong>: <code>provider = aws.us_west</code>. This is how you target specific provider configurations like different regions or accounts."},
{domain:"Providers",text:"What is a provider's role in Terraform's architecture?",options:[{l:"A",t:"Storing and locking state files"},{l:"B",t:"Translating Terraform resource configurations into API calls to manage infrastructure"},{l:"C",t:"Compiling HCL configuration into a binary"},{l:"D",t:"Distributing configuration across multiple regions"}],correct:"B",exp:"Providers are <strong>plugins that interface with APIs</strong>. They define resource types and data sources, and handle creating, reading, updating, and deleting resources via API calls. Terraform Core orchestrates; providers execute."},
{domain:"Providers",text:"Which of these is an example of a provider source address in required_providers?",options:[{l:"A",t:"hashicorp/aws"},{l:"B",t:"registry.terraform.io/hashicorp/aws"},{l:"C",t:"terraform/aws"},{l:"D",t:"Both A and B are valid (A is the shorthand)"}],correct:"D",exp:"Both <code>hashicorp/aws</code> (shorthand) and <code>registry.terraform.io/hashicorp/aws</code> (fully qualified) are valid. Terraform expands the shorthand automatically. For private registries, the full hostname is required."},

// State (8)
{domain:"State",text:"What command can be used to view the contents of a Terraform state file in a readable format?",options:[{l:"A",t:"terraform state read"},{l:"B",t:"terraform show terraform.tfstate"},{l:"C",t:"terraform state show <resource>"},{l:"D",t:"terraform output -state"}],correct:"C",exp:"<code>terraform state show &lt;resource_address&gt;</code> displays the <strong>attributes of a specific resource</strong> in state in a readable format. <code>terraform show</code> shows the whole state, while <code>terraform state show</code> shows one resource."},
{domain:"State",text:"What does terraform state pull do?",options:[{l:"A",t:"Downloads the provider from the registry"},{l:"B",t:"Retrieves the current state and outputs it as JSON to stdout"},{l:"C",t:"Pulls the latest configuration from a VCS repository"},{l:"D",t:"Downloads modules from a remote source"}],correct:"B",exp:"<code>terraform state pull</code> retrieves the <strong>current state as JSON</strong> to stdout. This is useful for inspecting remote state or piping into tools like jq for analysis."},
{domain:"State",text:"What is the risk of manually editing the terraform.tfstate file?",options:[{l:"A",t:"Terraform will refuse to read manually edited state files"},{l:"B",t:"Corruption can cause Terraform to lose track of resources, leading to unwanted creates or destroys"},{l:"C",t:"Manual edits trigger automatic rollback on next apply"},{l:"D",t:"The state file will be automatically overwritten on next plan"}],correct:"B",exp:"Manually editing state can <strong>corrupt it</strong>, causing Terraform to create duplicate resources or fail to destroy existing ones. Always use <code>terraform state</code> subcommands or <code>terraform console</code> for state manipulation."},
{domain:"State",text:"In Terraform, what is the purpose of the terraform_remote_state data source?",options:[{l:"A",t:"To configure a remote backend for state storage"},{l:"B",t:"To read outputs from another Terraform configuration's state"},{l:"C",t:"To synchronize state across multiple workspaces"},{l:"D",t:"To download state from HCP Terraform"}],correct:"B",exp:"<code>terraform_remote_state</code> allows one configuration to <strong>read outputs from another configuration's state</strong>. This is how you share infrastructure data (like VPC IDs) between Terraform projects without hard-coding values."},
{domain:"State",text:"Which command would you use to move a resource between modules in Terraform state?",options:[{l:"A",t:"terraform state copy"},{l:"B",t:"terraform state mv"},{l:"C",t:"terraform import"},{l:"D",t:"terraform state transfer"}],correct:"B",exp:"<code>terraform state mv</code> <strong>moves resources within state</strong>, including between modules (e.g., from <code>aws_instance.web</code> to <code>module.app.aws_instance.web</code>). This prevents unnecessary destroy/recreate cycles during refactoring."},
{domain:"State",text:"What is a state file version?",options:[{l:"A",t:"The Terraform CLI version that created the state"},{l:"B",t:"An internal format version number used by Terraform to parse state correctly"},{l:"C",t:"A user-defined version tag for tracking infrastructure changes"},{l:"D",t:"The provider plugin version recorded in state"}],correct:"B",exp:"The state file contains an internal <strong>format version number</strong> (currently 4) that Terraform uses to parse the JSON correctly. This is not the CLI version (A) or provider version (D) — those are recorded separately."},
{domain:"State",text:"Which backend supports state locking natively without additional configuration?",options:[{l:"A",t:"Local backend"},{l:"B",t:"S3 backend (requires DynamoDB separately)"},{l:"C",t:"HCP Terraform backend"},{l:"D",t:"HTTP backend"}],correct:"C",exp:"The <strong>HCP Terraform backend</strong> provides state locking natively. The S3 backend requires a separate DynamoDB table for locking (B). The local backend does file-based locking. HTTP backend depends on implementation."},
{domain:"State",text:"What does the sensitive attribute in state mean for a resource attribute?",options:[{l:"A",t:"The attribute is encrypted in the state file"},{l:"B",t:"The attribute value is stored in state but redacted from CLI output"},{l:"C",t:"The attribute cannot be read by any user"},{l:"D",t:"The attribute is stored in HashiCorp Vault, not in state"}],correct:"B",exp:"<strong>Sensitive values</strong> in state are stored in plaintext but <strong>redacted from CLI output</strong> (plan, apply). They are NOT encrypted in state. This is why securing the state file itself is critical — all values are readable in raw JSON."},

// Backends (4)
{domain:"Backends",text:"What is the difference between a standard backend and an enhanced backend?",options:[{l:"A",t:"Enhanced backends support more cloud providers"},{l:"B",t:"Enhanced backends support remote operations (plan/apply run remotely), while standard backends only store state"},{l:"C",t:"Standard backends are free; enhanced backends require a paid license"},{l:"D",t:"Enhanced backends encrypt state automatically"}],correct:"B",exp:"<strong>Standard backends</strong> (S3, Azure Blob, etc.) only store state. <strong>Enhanced backends</strong> (HCP Terraform) additionally run operations remotely, enabling features like remote plan/apply, policy checks, and run queuing."},
{domain:"Backends",text:"How do you configure the S3 backend in Terraform?",options:[{l:"A",t:'backend "s3" block inside the terraform block with bucket, key, and region'},{l:"B",t:'provider "s3" block with state = true'},{l:"C",t:'backend { s3 { } } at the top level'},{l:"D",t:'storage "s3" block inside the provider block'}],correct:"A",exp:"The S3 backend is configured with a <code>backend \"s3\"</code> block inside the <code>terraform</code> block, specifying at minimum <code>bucket</code>, <code>key</code> (state path), and <code>region</code>."},
{domain:"Backends",text:"What happens to the local state file when you configure a remote backend and run terraform init?",options:[{l:"A",t:"It is automatically deleted"},{l:"B",t:"Terraform offers to migrate the local state to the remote backend"},{l:"C",t:"It remains as a backup and Terraform uses both"},{l:"D",t:"It is renamed to terraform.tfstate.backup"}],correct:"B",exp:"When configuring a remote backend, <code>terraform init</code> <strong>offers to migrate existing local state</strong> to the new backend. If you agree, it copies state to the remote location. The local file is then no longer the active state."},
{domain:"Backends",text:"What is the purpose of the backend configuration's encryption options (e.g., in S3)?",options:[{l:"A",t:"Encrypts HCL configuration files stored alongside state"},{l:"B",t:"Enables server-side encryption of the state file at rest in the storage backend"},{l:"C",t:"Encrypts Terraform variables before storing them"},{l:"D",t:"Encrypts communication between Terraform and the provider API"}],correct:"B",exp:"Backend encryption options (like S3's <code>encrypt = true</code>) enable <strong>server-side encryption of state at rest</strong>. This protects sensitive values in state from unauthorized access to the storage bucket."},

// Configuration (8)
{domain:"Configuration",text:"What is the purpose of the for expression in Terraform?",options:[{l:"A",t:"To create a for loop that modifies resources sequentially"},{l:"B",t:"To transform collections (lists, maps, sets) into new collections"},{l:"C",t:"To iterate over resources and apply a command to each"},{l:"D",t:"To define iteration logic inside provider blocks"}],correct:"B",exp:"The <code>for</code> expression <strong>transforms collections</strong>: <code>[for s in list : upper(s)]</code> creates a new list. It can produce lists or maps and supports filtering with <code>if</code>. It does not imperatively modify resources (A, C)."},
{domain:"Configuration",text:"What is the splat expression (*) used for in Terraform?",options:[{l:"A",t:"Multiplying numeric values in expressions"},{l:"B",t:"Extracting a list of attribute values from all instances of a resource created with count or for_each"},{l:"C",t:"Wildcard matching in variable names"},{l:"D",t:"Denoting sensitive values in outputs"}],correct:"B",exp:"The <strong>splat expression</strong> <code>aws_instance.web[*].id</code> extracts the <code>id</code> attribute from all instances, returning a list. It's shorthand for a for expression collecting one attribute from all instances."},
{domain:"Configuration",text:"Which symbol is used to define string interpolation in Terraform HCL?",options:[{l:"A",t:"#{}"},{l:"B",t:"$()"},{l:"C",t:"${}"},{l:"D",t:"%{}"}],correct:"C",exp:"Terraform uses <code>${}</code> for <strong>string interpolation</strong>: <code>\"Hello, ${var.name}!\"</code>. This embeds expressions within strings. Unlike some languages, <code>#{}</code> (Ruby) and <code>$()</code> (shell) are not used."},
{domain:"Configuration",text:"What is a dynamic block in Terraform?",options:[{l:"A",t:"A block that updates automatically when provider APIs change"},{l:"B",t:"A way to generate repeated nested configuration blocks programmatically within a resource"},{l:"C",t:"A block that executes during terraform plan only"},{l:"D",t:"A special block for defining dynamic infrastructure scaling rules"}],correct:"B",exp:"<strong>Dynamic blocks</strong> allow you to programmatically generate repeated nested blocks (e.g., multiple <code>ingress</code> blocks in a security group) from a collection, avoiding repetitive static configuration."},
{domain:"Configuration",text:"How do you define a map variable and set a default value in Terraform?",options:[{l:"A",t:'variable "tags" { type = map(string); default = {} }'},{l:"B",t:'map "tags" { default = {} }'},{l:"C",t:'variable "tags" { map = {} }'},{l:"D",t:'input_map "tags" {}'}],correct:"A",exp:"A map variable is declared with <code>variable \"name\" { type = map(string) }</code>. The <code>default</code> argument provides a default value. There is no <code>map</code> block type (B) or <code>input_map</code> (D)."},
{domain:"Configuration",text:"What is the purpose of the validation block inside a variable definition?",options:[{l:"A",t:"Validates that the variable value is encrypted"},{l:"B",t:"Defines custom validation rules with error messages for input variable values"},{l:"C",t:"Checks that the variable is set before terraform plan runs"},{l:"D",t:"Validates the variable against provider API schemas"}],correct:"B",exp:"The <code>validation</code> block lets you define <strong>custom conditions</strong> that variable values must satisfy, with friendly error messages. Example: requiring an instance type from an approved list."},
{domain:"Configuration",text:"What does the templatefile() function do in Terraform?",options:[{l:"A",t:"Creates a file resource from a template"},{l:"B",t:"Reads a template file and renders it with provided variable values"},{l:"C",t:"Downloads a configuration template from the Terraform Registry"},{l:"D",t:"Converts a .yaml file to HCL format"}],correct:"B",exp:"<code>templatefile(path, vars)</code> <strong>reads a template file</strong> and renders it, substituting variables. Useful for generating user_data scripts, config files, etc. The rendered string is returned for use in resource arguments."},
{domain:"Configuration",text:"How are conditional expressions written in Terraform HCL?",options:[{l:"A",t:"if condition { value1 } else { value2 }"},{l:"B",t:"condition ? true_value : false_value"},{l:"C",t:"CASE condition WHEN true THEN value1 ELSE value2"},{l:"D",t:"select(condition, value1, value2)"}],correct:"B",exp:"Terraform uses the <strong>ternary operator</strong>: <code>condition ? true_val : false_val</code>. For example: <code>var.env == \"prod\" ? \"t3.large\" : \"t3.small\"</code>. There are no if/else blocks or CASE statements in HCL expressions."},

// Meta-Arguments (5)
{domain:"Meta-Arguments",text:"What is the index reference for the second instance of a resource created with count = 3?",options:[{l:"A",t:"resource.name.2"},{l:"B",t:"resource.name[1]"},{l:"C",t:"resource.name[2]"},{l:"D",t:"resource.name.count[2]"}],correct:"B",exp:"Count-created resources are <strong>zero-indexed</strong>: instances are [0], [1], [2] for count=3. The second instance is <code>resource.name[1]</code>. There is no <code>.count</code> in references."},
{domain:"Meta-Arguments",text:"What happens when you remove one item from a list used with count?",options:[{l:"A",t:"Only the removed item's resource is destroyed"},{l:"B",t:"Terraform may destroy and recreate multiple resources due to index shifts"},{l:"C",t:"Nothing changes; count handles removals gracefully"},{l:"D",t:"Terraform errors and refuses to apply"}],correct:"B",exp:"Removing a middle item from a count list <strong>shifts indexes</strong>, causing Terraform to see all subsequent resources as changed. This may destroy and recreate them — a key reason to prefer <code>for_each</code> with stable keys."},
{domain:"Meta-Arguments",text:"How do you reference the key of a for_each resource instance?",options:[{l:"A",t:"each.value.key"},{l:"B",t:"self.key"},{l:"C",t:"each.key"},{l:"D",t:"count.key"}],correct:"C",exp:"Within a resource using <code>for_each</code>, <code>each.key</code> is the <strong>map key or set value</strong> for the current instance, and <code>each.value</code> is the corresponding value (for maps). <code>count.key</code> doesn't exist."},
{domain:"Meta-Arguments",text:"When using for_each with a set of strings, what does each.value contain?",options:[{l:"A",t:"The index number of the element"},{l:"B",t:"The string value itself (same as each.key for sets)"},{l:"C",t:"A map of all set elements"},{l:"D",t:"The count of remaining elements"}],correct:"B",exp:"When <code>for_each</code> iterates over a <strong>set of strings</strong>, both <code>each.key</code> and <code>each.value</code> are the same — the string value itself. For maps, <code>each.key</code> is the key and <code>each.value</code> is the value."},
{domain:"Meta-Arguments",text:"What is the replace_triggered_by lifecycle meta-argument used for?",options:[{l:"A",t:"Replacing the provider when it changes"},{l:"B",t:"Forcing resource replacement when a referenced resource or attribute changes"},{l:"C",t:"Replacing a resource when its count changes"},{l:"D",t:"Triggering a remote-exec provisioner on change"}],correct:"B",exp:"<code>replace_triggered_by</code> forces a resource to be <strong>replaced when another resource or attribute changes</strong>, even if the resource's own attributes haven't changed. Useful for dependencies not captured in the config graph."},

// Modules (5)
{domain:"Modules",text:"What is the recommended way to specify module versions from the Terraform Registry?",options:[{l:"A",t:"Using a version constraint in the module block's version argument"},{l:"B",t:"Adding a version comment in the source URL"},{l:"C",t:"Setting a TF_MODULE_VERSION environment variable"},{l:"D",t:"Pinning via the .terraform.lock.hcl file manually"}],correct:"A",exp:"The <code>version</code> argument in a <code>module</code> block accepts <strong>version constraint strings</strong> (e.g., <code>version = \"~> 3.0\"</code>). This only works for registry modules; local and Git sources use other mechanisms."},
{domain:"Modules",text:"What are the three main components every module should expose to be reusable?",options:[{l:"A",t:"Resources, providers, and backends"},{l:"B",t:"Input variables, output values, and resources"},{l:"C",t:"Variables, locals, and data sources"},{l:"D",t:"Providers, versions, and outputs"}],correct:"B",exp:"A reusable module has: <strong>input variables</strong> (configuration knobs), <strong>resources</strong> (what it creates), and <strong>output values</strong> (what it exposes to callers). This is the standard module interface contract."},
{domain:"Modules",text:"What is the root module in Terraform?",options:[{l:"A",t:"The first module downloaded from the Terraform Registry"},{l:"B",t:"The configuration in the current working directory where terraform commands are run"},{l:"C",t:"A special module provided by HashiCorp for common infrastructure patterns"},{l:"D",t:"The top-level module in the Terraform Registry for a provider"}],correct:"B",exp:"The <strong>root module</strong> is the configuration in the current working directory — where you run <code>terraform init</code>, <code>plan</code>, and <code>apply</code>. All other modules are called child modules."},
{domain:"Modules",text:"Can a child module inherit the parent's provider configuration without explicit passing?",options:[{l:"A",t:"No, all providers must be explicitly passed to every module"},{l:"B",t:"Yes, child modules automatically inherit provider configurations from the parent unless overridden"},{l:"C",t:"Only if the child module declares the same provider block"},{l:"D",t:"Only with the inherit_providers = true argument"}],correct:"B",exp:"By default, child modules <strong>automatically inherit</strong> provider configurations from the parent. You only need to explicitly pass providers when using provider aliases or when you want to override the provider for a specific module."},
{domain:"Modules",text:"What is module composition in Terraform?",options:[{l:"A",t:"The process of writing modules with multiple provider configurations"},{l:"B",t:"Building complex infrastructure by combining simpler, focused modules"},{l:"C",t:"Compressing modules for faster downloads from the registry"},{l:"D",t:"Combining state files from multiple modules"}],correct:"B",exp:"<strong>Module composition</strong> is the practice of building complex infrastructure by calling and combining multiple focused modules. A root module might call a VPC module, a compute module, and a database module, wiring them together via outputs and inputs."},

// CLI (5)
{domain:"CLI",text:"What does terraform output do when run after terraform apply?",options:[{l:"A",t:"Displays the Terraform plan output"},{l:"B",t:"Displays the values of all output variables defined in the configuration"},{l:"C",t:"Shows the output of the last provisioner run"},{l:"D",t:"Prints all resource attribute values"}],correct:"B",exp:"<code>terraform output</code> displays <strong>all output variable values</strong> from the current state. Add a specific output name to get just that value. Use <code>-json</code> for machine-readable output."},
{domain:"CLI",text:"What is the purpose of terraform console?",options:[{l:"A",t:"Opens a web console for Terraform management"},{l:"B",t:"Provides an interactive REPL for evaluating Terraform expressions and functions"},{l:"C",t:"Displays a console log of all Terraform operations"},{l:"D",t:"Opens the HCP Terraform console in a browser"}],correct:"B",exp:"<code>terraform console</code> is an <strong>interactive REPL</strong> where you can test expressions, functions, and inspect variables and resources from the current state. Great for debugging complex expressions."},
{domain:"CLI",text:"Which flag limits the number of resources Terraform processes in parallel during apply?",options:[{l:"A",t:"-concurrency=N"},{l:"B",t:"-threads=N"},{l:"C",t:"-parallelism=N"},{l:"D",t:"-max-parallel=N"}],correct:"C",exp:"The <code>-parallelism=N</code> flag (default: 10) controls <strong>how many resource operations run concurrently</strong> during apply/destroy. Reducing it can help with API rate limits. The other flag names don't exist."},
{domain:"CLI",text:"What does the terraform providers command output?",options:[{l:"A",t:"Lists all available providers in the Terraform Registry"},{l:"B",t:"Shows the providers required by the current configuration and their version constraints"},{l:"C",t:"Downloads the latest provider versions"},{l:"D",t:"Shows providers currently installed in .terraform"}],correct:"B",exp:"<code>terraform providers</code> prints a <strong>tree of providers required</strong> by the configuration, their sources, and version constraints. It does not download (C) or query the full registry (A)."},
{domain:"CLI",text:"What is the difference between terraform destroy and terraform apply -destroy?",options:[{l:"A",t:"terraform destroy is deprecated; apply -destroy is the current method"},{l:"B",t:"terraform destroy deletes all resources; apply -destroy only destroys targeted resources"},{l:"C",t:"They are functionally equivalent; apply -destroy generates a destroy plan that can be saved with -out"},{l:"D",t:"terraform destroy requires manual state cleanup; apply -destroy handles state automatically"}],correct:"C",exp:"<code>terraform destroy</code> and <code>terraform apply -destroy</code> are functionally equivalent. The <code>-destroy</code> flag is useful because it can be combined with <code>-out</code> to <strong>save a destroy plan</strong> for separate review and apply."},

// Data Sources (2)
{domain:"Data Sources",text:"If a data source query returns no results, what happens?",options:[{l:"A",t:"Terraform creates the resource automatically"},{l:"B",t:"Terraform returns an empty object with null attributes"},{l:"C",t:"Terraform raises an error during plan or apply"},{l:"D",t:"Terraform skips the data source silently"}],correct:"C",exp:"When a data source query returns no results (or too many), Terraform typically <strong>raises an error</strong> during plan or apply. You must ensure data source filters are specific enough to return exactly the expected result."},
{domain:"Data Sources",text:"What is the depends_on argument used for in a data source?",options:[{l:"A",t:"To specify which provider the data source uses"},{l:"B",t:"To ensure the data source is read after a resource it depends on is created"},{l:"C",t:"To prevent the data source from being read during plan"},{l:"D",t:"To declare the data source's output type"}],correct:"B",exp:"<code>depends_on</code> in a data source <strong>delays reading until after dependencies are created</strong>. Normally, data sources are read during plan, but if they depend on a resource not yet created, <code>depends_on</code> defers the read to apply time."},

// Functions (4)
{domain:"Functions",text:"What does the toset() function do in Terraform?",options:[{l:"A",t:"Sets a variable's value programmatically"},{l:"B",t:"Converts a list to a set, removing duplicates and losing ordering"},{l:"C",t:"Creates a set of resource instances"},{l:"D",t:"Converts a map to a set of its keys"}],correct:"B",exp:"<code>toset()</code> <strong>converts a list to a set</strong>, which removes duplicate values and does not guarantee ordering. This is often used with <code>for_each</code>: <code>for_each = toset([\"a\",\"b\",\"c\"])</code>."},
{domain:"Functions",text:"Which function merges two maps in Terraform, with later maps taking precedence on key conflicts?",options:[{l:"A",t:"concat()"},{l:"B",t:"combine()"},{l:"C",t:"merge()"},{l:"D",t:"extend()"}],correct:"C",exp:"<code>merge(map1, map2, ...)</code> <strong>merges multiple maps</strong>. If the same key exists in multiple maps, the <strong>last map's value wins</strong>. <code>concat()</code> combines lists, not maps."},
{domain:"Functions",text:"What does the file() function do in Terraform?",options:[{l:"A",t:"Creates a new file on the filesystem"},{l:"B",t:"Reads the contents of a file and returns it as a string"},{l:"C",t:"Lists files in a directory"},{l:"D",t:"Uploads a file to a cloud storage bucket"}],correct:"B",exp:"<code>file(path)</code> <strong>reads a file from the filesystem</strong> and returns its contents as a string. Common use: reading SSH public keys or certificate files to embed in resource configurations."},
{domain:"Functions",text:"What is the result of cidrsubnet(\"10.0.0.0/16\", 8, 1) in Terraform?",options:[{l:"A",t:"10.0.0.0/24"},{l:"B",t:"10.1.0.0/24"},{l:"C",t:"10.0.1.0/24"},{l:"D",t:"10.0.0.1/24"}],correct:"C",exp:"<code>cidrsubnet(prefix, newbits, netnum)</code> calculates subnet addresses. Adding 8 bits to /16 gives /24 subnets. Netnum 1 picks the second subnet: <strong>10.0.1.0/24</strong>. This function is key for programmatic VPC subnet calculation."},

// Workspaces (2)
{domain:"Workspaces",text:"How do you create and switch to a new Terraform workspace?",options:[{l:"A",t:"terraform workspace new <name>"},{l:"B",t:"terraform workspace create <name> && terraform workspace select <name>"},{l:"C",t:"terraform init -workspace=<name>"},{l:"D",t:"terraform switch <name>"}],correct:"A",exp:"<code>terraform workspace new &lt;name&gt;</code> <strong>creates a new workspace AND switches to it</strong> in one command. <code>terraform workspace select &lt;name&gt;</code> switches to an existing workspace. There is no <code>terraform switch</code> command."},
{domain:"Workspaces",text:"What is the name of the default workspace in Terraform?",options:[{l:"A",t:"main"},{l:"B",t:"root"},{l:"C",t:"default"},{l:"D",t:"primary"}],correct:"C",exp:"The initial, default workspace is always named <strong>\"default\"</strong>. It cannot be deleted. When you haven't created any workspaces, you're in the default workspace."},

// Provisioners (2)
{domain:"Provisioners",text:"What is the on_failure setting in a provisioner block used for?",options:[{l:"A",t:"Defines what to do if a provisioner script returns a non-zero exit code"},{l:"B",t:"Runs a cleanup script when the resource is destroyed"},{l:"C",t:"Sets a timeout for provisioner execution"},{l:"D",t:"Retries the provisioner on failure"}],correct:"A",exp:"<code>on_failure = continue</code> or <code>on_failure = fail</code> (default) determines whether Terraform <strong>ignores provisioner failures or treats them as errors</strong>. This is useful for best-effort provisioning steps."},
