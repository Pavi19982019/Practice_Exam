<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terraform Associate (003) Practice Exam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(124,58,237,0.4);
  }

  .header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .header .subtitle {
    font-size: 0.85rem;
    opacity: 0.85;
    margin-top: 4px;
  }

  .timer-box {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
    min-width: 130px;
  }

  .timer-label { font-size: 0.72rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
  .timer-value { font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .timer-value.warning { color: #fbbf24; }
  .timer-value.danger { color: #f87171; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .progress-bar-wrap {
    background: #1e2130;
    padding: 12px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid #2d3148;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: #2d3148;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #06b6d4);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .progress-text { font-size: 0.82rem; color: #94a3b8; white-space: nowrap; }

  .score-summary {
    background: #1e2130;
    padding: 10px 32px;
    display: flex;
    gap: 24px;
    font-size: 0.82rem;
    border-bottom: 1px solid #2d3148;
  }

  .score-summary span { color: #94a3b8; }
  .score-summary .correct { color: #34d399; font-weight: 600; }
  .score-summary .incorrect { color: #f87171; font-weight: 600; }
  .score-summary .skipped { color: #fbbf24; font-weight: 600; }

  .container {
    max-width: 860px;
    margin: 32px auto;
    padding: 0 20px 80px;
  }

  .question-card {
    background: #1a1d2e;
    border: 1px solid #2d3148;
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 24px;
    transition: border-color 0.2s;
  }

  .question-card.answered { border-color: #4f46e5; }
  .question-card.correct-card { border-color: #059669; background: #0d1f18; }
  .question-card.wrong-card { border-color: #dc2626; background: #1f0d0d; }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .q-number {
    background: #7c3aed;
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
    margin-top: 2px;
  }

  .q-domain {
    background: #1e3a5f;
    color: #60a5fa;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
    margin-top: 3px;
  }

  .q-text {
    font-size: 0.97rem;
    line-height: 1.7;
    color: #e2e8f0;
    flex: 1;
  }

  .code-block {
    background: #0d1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 14px 18px;
    margin: 14px 0;
    font-family: 'Courier New', monospace;
    font-size: 0.84rem;
    line-height: 1.6;
    color: #a5f3fc;
    overflow-x: auto;
    white-space: pre;
  }

  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid #2d3148;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s ease;
    background: #1a1d2e;
  }

  .option:hover:not(.disabled) { border-color: #7c3aed; background: #221b3a; }
  .option.selected { border-color: #7c3aed; background: #221b3a; }

  .option.correct-ans {
    border-color: #059669;
    background: #0d2318;
  }

  .option.wrong-ans {
    border-color: #dc2626;
    background: #2a0f0f;
  }

  .option.show-correct {
    border-color: #059669;
    background: #0d2318;
  }

  .option-letter {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    border: 1.5px solid #4b5563;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    transition: all 0.18s;
    color: #94a3b8;
    margin-top: 1px;
  }

  .option.selected .option-letter { border-color: #7c3aed; background: #7c3aed; color: #fff; }
  .option.correct-ans .option-letter { border-color: #059669; background: #059669; color: #fff; }
  .option.wrong-ans .option-letter { border-color: #dc2626; background: #dc2626; color: #fff; }
  .option.show-correct .option-letter { border-color: #059669; background: #059669; color: #fff; }

  .option-text { font-size: 0.91rem; line-height: 1.55; color: #cbd5e1; padding-top: 2px; }
  .option.correct-ans .option-text,
  .option.show-correct .option-text { color: #6ee7b7; }
  .option.wrong-ans .option-text { color: #fca5a5; }

  .explanation {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    background: #0f1624;
    border-left: 4px solid #7c3aed;
    border-radius: 0 8px 8px 0;
    font-size: 0.88rem;
    line-height: 1.65;
    color: #94a3b8;
  }

  .explanation.visible { display: block; }
  .explanation strong { color: #c4b5fd; }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .result-badge.correct-badge { background: #064e3b; color: #34d399; }
  .result-badge.wrong-badge { background: #450a0a; color: #f87171; }

  .multi-note {
    font-size: 0.78rem;
    color: #f59e0b;
    margin-bottom: 10px;
    font-weight: 600;
    background: #1c1500;
    border: 1px solid #78350f;
    padding: 5px 10px;
    border-radius: 6px;
    display: inline-block;
  }

  .submit-btn {
    display: block;
    margin: 32px auto 0;
    padding: 14px 48px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(124,58,237,0.4);
  }

  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124,58,237,0.5); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .final-result {
    display: none;
    background: linear-gradient(135deg, #1a1d2e, #221b3a);
    border: 1px solid #4f46e5;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    margin: 32px 0;
  }

  .final-result.visible { display: block; }
  .final-score { font-size: 3.5rem; font-weight: 900; }
  .final-score.pass { color: #34d399; }
  .final-score.fail { color: #f87171; }
  .final-label { font-size: 1.2rem; margin: 8px 0 4px; font-weight: 700; }
  .final-sub { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; }
  .final-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin: 20px 0; }
  .stat-box { text-align: center; }
  .stat-num { font-size: 1.8rem; font-weight: 800; }
  .stat-lbl { font-size: 0.78rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .pass-mark { font-size: 0.82rem; color: #94a3b8; margin-top: 8px; }

  .retry-btn {
    margin-top: 20px;
    padding: 12px 36px;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }

  .review-btn {
    margin-top: 10px;
    padding: 12px 36px;
    background: transparent;
    color: #a78bfa;
    border: 1.5px solid #7c3aed;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  .disabled { cursor: default; pointer-events: none; }

  .q-flag {
    background: none;
    border: 1.5px solid #4b5563;
    border-radius: 6px;
    color: #4b5563;
    cursor: pointer;
    font-size: 0.8rem;
    padding: 3px 8px;
    margin-left: auto;
    transition: all 0.2s;
  }
  .q-flag.flagged { border-color: #f59e0b; color: #f59e0b; }

  @media (max-width: 600px) {
    .header { flex-direction: column; gap: 12px; text-align: center; }
    .container { padding: 0 12px 60px; }
    .question-card { padding: 20px 16px; }
    .final-stats { gap: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>HashiCorp Terraform Associate (003)</h1>
    <div class="subtitle">Official Practice Exam &nbsp;|&nbsp; 57 Questions &nbsp;|&nbsp; 60 Minutes &nbsp;|&nbsp; Pass: 70%</div>
  </div>
  <div class="timer-box">
    <div class="timer-label">Time Remaining</div>
    <div class="timer-value" id="timer">60:00</div>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-text" id="progressText">0 / 57 answered</div>
</div>

<div class="score-summary">
  <span>Live Score: <span class="correct" id="liveCorrect">0</span> correct</span>
  <span><span class="incorrect" id="liveIncorrect">0</span> incorrect</span>
  <span><span class="skipped" id="liveSkipped">57</span> remaining</span>
</div>

<div class="container" id="examContainer"></div>

<script>
const QUESTIONS = [
  {
    id: 1,
    domain: "IaC Concepts",
    text: "Which of the following best describes Infrastructure as Code (IaC)?",
    options: [
      { letter: "A", text: "Manually provisioning infrastructure through a cloud provider's graphical console" },
      { letter: "B", text: "Managing and provisioning infrastructure through machine-readable configuration files rather than manual processes" },
      { letter: "C", text: "Using scripts written only in Python to manage cloud resources" },
      { letter: "D", text: "Deploying containers using orchestration platforms like Kubernetes" }
    ],
    correct: "B",
    explanation: "<strong>IaC</strong> means managing infrastructure via configuration files that can be versioned, tested, and reused — enabling consistency and reproducibility. GUI-driven provisioning and container orchestration are separate concepts."
  },
  {
    id: 2,
    domain: "IaC Concepts",
    text: "Which of the following are key benefits of IaC? (Select TWO)",
    multi: true,
    options: [
      { letter: "A", text: "Eliminates the need for any cloud accounts or credentials" },
      { letter: "B", text: "Enables version control and peer review of infrastructure changes" },
      { letter: "C", text: "Guarantees zero infrastructure costs" },
      { letter: "D", text: "Reduces configuration drift by enforcing a consistent desired state" }
    ],
    correct: ["B", "D"],
    explanation: "<strong>Version control</strong> (B) allows teams to track, review, and roll back changes. <strong>Reducing config drift</strong> (D) means the real world matches what's defined in code. IaC doesn't eliminate credentials or reduce costs by itself."
  },
  {
    id: 3,
    domain: "Terraform Purpose",
    text: "How does Terraform differ from configuration management tools like Ansible or Chef?",
    options: [
      { letter: "A", text: "Terraform is primarily designed for provisioning infrastructure, while Ansible/Chef focus on configuring software on existing servers" },
      { letter: "B", text: "Terraform can only be used with AWS, whereas Ansible supports multiple providers" },
      { letter: "C", text: "Terraform does not support any cloud providers natively" },
      { letter: "D", text: "Terraform uses a mutable infrastructure model, while Ansible uses an immutable one" }
    ],
    correct: "A",
    explanation: "<strong>Terraform</strong> is an infrastructure <em>provisioning</em> tool (creating VMs, networks, storage). Tools like Ansible are primarily <em>configuration management</em> tools that install/configure software on already-provisioned servers. The two are complementary."
  },
  {
    id: 4,
    domain: "Terraform Purpose",
    text: "Terraform uses a declarative approach to infrastructure management. What does this mean?",
    options: [
      { letter: "A", text: "You must define each individual API call needed to reach the desired infrastructure state" },
      { letter: "B", text: "You describe the desired end state of your infrastructure, and Terraform figures out how to reach it" },
      { letter: "C", text: "Terraform only supports sequential, step-by-step resource creation" },
      { letter: "D", text: "Each Terraform configuration file must be executed in a specific order you define" }
    ],
    correct: "B",
    explanation: "In a <strong>declarative</strong> model, you state <em>what</em> you want (e.g., 3 EC2 instances), and Terraform determines <em>how</em> to create, update, or destroy resources to achieve that state. Imperative tools require you to define the exact steps."
  },
  {
    id: 5,
    domain: "Terraform Basics",
    text: "What is the correct order of the core Terraform workflow?",
    options: [
      { letter: "A", text: "Write → Apply → Plan → Destroy" },
      { letter: "B", text: "Plan → Write → Init → Apply" },
      { letter: "C", text: "Write → Init → Plan → Apply" },
      { letter: "D", text: "Init → Write → Destroy → Apply" }
    ],
    correct: "C",
    explanation: "The core Terraform workflow is: <strong>Write</strong> (author configs) → <strong>Init</strong> (initialize providers/modules) → <strong>Plan</strong> (preview changes) → <strong>Apply</strong> (execute changes). Init must come before plan/apply."
  },
  {
    id: 6,
    domain: "Terraform Basics",
    text: "What does `terraform init` do? (Select TWO)",
    multi: true,
    options: [
      { letter: "A", text: "Creates all resources defined in the configuration" },
      { letter: "B", text: "Downloads and installs the required provider plugins" },
      { letter: "C", text: "Initializes the backend for storing Terraform state" },
      { letter: "D", text: "Validates the syntax of all .tf files in the directory" }
    ],
    correct: ["B", "C"],
    explanation: "<strong>terraform init</strong> downloads providers (B) and initializes the configured backend (C). It does NOT create resources (that's `apply`) or validate syntax (that's `validate`)."
  },
  {
    id: 7,
    domain: "Terraform Basics",
    text: "What does the `terraform plan` command produce?",
    options: [
      { letter: "A", text: "It immediately provisions all resources in the configuration" },
      { letter: "B", text: "It destroys all existing infrastructure to prepare for a fresh deployment" },
      { letter: "C", text: "It generates an execution plan showing what Terraform will do to reach the desired state" },
      { letter: "D", text: "It backs up the current state file before any changes are made" }
    ],
    correct: "C",
    explanation: "<strong>terraform plan</strong> is a dry-run that shows additions, changes, and destructions without making any real changes. It's a preview, not an execution."
  },
  {
    id: 8,
    domain: "Terraform Basics",
    text: "A team member runs `terraform apply` and is presented with the execution plan and a prompt. What input is required to proceed?",
    options: [
      { letter: "A", text: "The word \"proceed\"" },
      { letter: "B", text: "The word \"yes\"" },
      { letter: "C", text: "The word \"apply\"" },
      { letter: "D", text: "Pressing Enter with no text" }
    ],
    correct: "B",
    explanation: "By default, <strong>terraform apply</strong> shows the plan and waits for the user to type <strong>yes</strong> to confirm. Anything other than \"yes\" aborts the operation. Use `-auto-approve` to skip this prompt in automation."
  },
  {
    id: 9,
    domain: "Terraform Basics",
    text: "What is the purpose of `terraform destroy`?",
    options: [
      { letter: "A", text: "Removes all .terraform directories and cached plugins" },
      { letter: "B", text: "Deletes the Terraform state file and configuration" },
      { letter: "C", text: "Terminates all resources managed by the current Terraform configuration" },
      { letter: "D", text: "Rolls back the last terraform apply operation" }
    ],
    correct: "C",
    explanation: "<strong>terraform destroy</strong> plans and applies the destruction of all resources tracked in the current state file. It is the reverse of apply. It does not remove config files, state backups, or plugin caches."
  },
  {
    id: 10,
    domain: "Terraform Providers",
    text: "What is a Terraform provider?",
    options: [
      { letter: "A", text: "A paid service offered by HashiCorp to manage Terraform configurations" },
      { letter: "B", text: "A plugin that allows Terraform to interact with a specific infrastructure platform or service via its API" },
      { letter: "C", text: "A type of Terraform variable used to pass credentials to resources" },
      { letter: "D", text: "A Terraform module that groups related resources together" }
    ],
    correct: "B",
    explanation: "A <strong>provider</strong> is a plugin that translates Terraform resource definitions into API calls for a specific platform (AWS, Azure, GCP, GitHub, etc.). Without a provider, Terraform has no way to communicate with external services."
  },
  {
    id: 11,
    domain: "Terraform Providers",
    text: "Given the following provider block, what will happen during `terraform init`?\n\nprovider \"aws\" {\n  region = \"us-east-1\"\n}\n\nrequired_providers {\n  aws = {\n    source  = \"hashicorp/aws\"\n    version = \"~> 5.0\"\n  }\n}",
    code: true,
    options: [
      { letter: "A", text: "Terraform will download any AWS provider version between 5.0.0 and 5.99.99 (but not 6.0)" },
      { letter: "B", text: "Terraform will download exactly version 5.0.0 of the AWS provider" },
      { letter: "C", text: "Terraform will download the latest available version of the AWS provider regardless of major version" },
      { letter: "D", text: "The configuration is invalid because version constraints must use >= syntax" }
    ],
    correct: "A",
    explanation: "The <strong>~></strong> (pessimistic constraint operator) means: allow only the rightmost version component to increment. <code>~> 5.0</code> allows ≥5.0 and <6.0 — i.e., 5.x.x but not 6.0."
  },
  {
    id: 12,
    domain: "Terraform Providers",
    text: "Where are provider plugins stored after running `terraform init`?",
    options: [
      { letter: "A", text: "In a global directory at /usr/local/bin/terraform-providers" },
      { letter: "B", text: "In the .terraform/providers/ directory within the working directory" },
      { letter: "C", text: "In the ~/.terraform.d/plugins/ directory by default for all projects" },
      { letter: "D", text: "Providers are not stored locally; they are fetched fresh on every terraform command" }
    ],
    correct: "B",
    explanation: "After <code>terraform init</code>, provider plugins are cached in <strong>.terraform/providers/</strong> within the current working directory. A global plugin cache can optionally be configured in the CLI config."
  },
  {
    id: 13,
    domain: "Terraform State",
    text: "What is the purpose of Terraform state?",
    options: [
      { letter: "A", text: "To store the Terraform binary and provider executables" },
      { letter: "B", text: "To map Terraform configuration to real-world infrastructure resources and track metadata" },
      { letter: "C", text: "To hold all variable values in an encrypted file" },
      { letter: "D", text: "To serve as an audit log of every terraform apply run" }
    ],
    correct: "B",
    explanation: "Terraform <strong>state</strong> is a JSON file that maps each resource in your config to its real-world counterpart (e.g., an EC2 instance ID). Terraform uses it to calculate diffs, track dependencies, and avoid unnecessary changes."
  },
  {
    id: 14,
    domain: "Terraform State",
    text: "By default, where does Terraform store its state file?",
    options: [
      { letter: "A", text: "In an S3 bucket named 'terraform-state' in your AWS account" },
      { letter: "B", text: "In HashiCorp's cloud service" },
      { letter: "C", text: "In a file named terraform.tfstate in the current working directory" },
      { letter: "D", text: "In a hidden directory at ~/.terraform/state/" }
    ],
    correct: "C",
    explanation: "By default, Terraform uses a <strong>local backend</strong> and writes state to <code>terraform.tfstate</code> in the current working directory. This is fine for individuals but not for teams — remote backends should be used for collaboration."
  },
  {
    id: 15,
    domain: "Terraform State",
    text: "Why is storing Terraform state in version control (e.g., Git) considered a bad practice?",
    options: [
      { letter: "A", text: "Version control systems cannot store binary files like the state file" },
      { letter: "B", text: "The state file can contain sensitive data (like passwords) in plaintext, and concurrent writes can cause state corruption" },
      { letter: "C", text: "Terraform requires state files to be stored in HCP Terraform (formerly Terraform Cloud)" },
      { letter: "D", text: "Git has a 100MB file size limit that the state file will inevitably exceed" }
    ],
    correct: "B",
    explanation: "State files can contain <strong>plaintext secrets</strong> (DB passwords, API keys written by providers) and are not designed for concurrent writes — two team members running apply simultaneously can corrupt state. Use a remote backend with locking instead."
  },
  {
    id: 16,
    domain: "Terraform State",
    text: "Which command allows you to inspect the resources tracked in the current Terraform state?",
    options: [
      { letter: "A", text: "terraform show" },
      { letter: "B", text: "terraform state list" },
      { letter: "C", text: "terraform plan --state" },
      { letter: "D", text: "terraform inspect" }
    ],
    correct: "B",
    explanation: "<strong>terraform state list</strong> prints all resource addresses tracked in the state file. <code>terraform show</code> shows the full state content. <code>terraform inspect</code> does not exist as a command."
  },
  {
    id: 17,
    domain: "Terraform State",
    text: "You need to remove a resource from Terraform state without destroying the actual infrastructure. Which command should you use?",
    options: [
      { letter: "A", text: "terraform state delete <address>" },
      { letter: "B", text: "terraform destroy -target=<address>" },
      { letter: "C", text: "terraform state rm <address>" },
      { letter: "D", text: "terraform remove <address>" }
    ],
    correct: "C",
    explanation: "<strong>terraform state rm</strong> removes a resource from the state file without affecting the real infrastructure. After removal, Terraform no longer manages that resource. <code>terraform destroy -target</code> would destroy the actual resource."

// Shuffle answer options for each question
function shuffleOptions(questions) {
  return questions.map(q => {
    const opts = [...q.options];
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    // Reassign letters A-D
    const letters = ["A","B","C","D"];
    const newOpts = opts.map((o, i) => ({...o, letter: letters[i]}));

    // Update correct answer(s)
    const oldToNew = {};
    opts.forEach((o, i) => { oldToNew[o.letter] = letters[i]; });

    let newCorrect;
    if (Array.isArray(q.correct)) {
      newCorrect = q.correct.map(c => oldToNew[c]);
    } else {
      newCorrect = oldToNew[q.correct];
    }

    return {...q, options: newOpts, correct: newCorrect};
  });
}

const questions = shuffleOptions(QUESTIONS);

let answered = {};
let submitted = false;
let totalSeconds = 3600;
let timerInterval;

function buildExam() {
  const container = document.getElementById("examContainer");
  container.innerHTML = "";

  questions.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    card.id = `q${q.id}`;

    const isMulti = q.multi === true;

    let optionsHTML = q.options.map(o => `
      <div class="option" data-qid="${q.id}" data-letter="${o.letter}" onclick="selectOption(${q.id}, '${o.letter}', ${isMulti})">
        <div class="option-letter">${o.letter}</div>
        <div class="option-text">${o.text}</div>
      </div>
    `).join("");

    card.innerHTML = `
      <div class="q-header">
        <div class="q-number">Q${idx + 1}</div>
        <div class="q-domain">${q.domain}</div>
        <div class="q-text">${q.text}</div>
        <button class="q-flag" id="flag${q.id}" onclick="toggleFlag(${q.id})">⚑ Flag</button>
      </div>
      ${q.code ? `<div class="code-block">${q.options.length > 0 ? q.text.replace(/^[^`]*`([^`]*)`[^`]*$/s,'').trim() : ""}</div>` : ""}
      ${isMulti ? '<div class="multi-note">Select TWO answers</div>' : ""}
      <div class="options">${optionsHTML}</div>
      <div class="explanation" id="exp${q.id}"></div>
    `;

    container.appendChild(card);
  });

  // Final submit button
  const btn = document.createElement("button");
  btn.className = "submit-btn";
  btn.id = "submitBtn";
  btn.textContent = "Submit Exam";
  btn.onclick = submitExam;
  container.appendChild(btn);

  // Result card
  const result = document.createElement("div");
  result.className = "final-result";
  result.id = "finalResult";
  result.innerHTML = `
    <div class="final-score" id="finalScoreText">--</div>
    <div class="final-label" id="finalLabel">--</div>
    <div class="final-sub" id="finalSub">--</div>
    <div class="final-stats">
      <div class="stat-box"><div class="stat-num" id="statCorrect" style="color:#34d399">-</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-box"><div class="stat-num" id="statIncorrect" style="color:#f87171">-</div><div class="stat-lbl">Incorrect</div></div>
      <div class="stat-box"><div class="stat-num" id="statUnanswered" style="color:#fbbf24">-</div><div class="stat-lbl">Unanswered</div></div>
      <div class="stat-box"><div class="stat-num" id="statTime" style="color:#60a5fa">-</div><div class="stat-lbl">Time Used</div></div>
    </div>
    <div class="pass-mark">Passing score: 70% (40 of 57 correct)</div>
    <button class="retry-btn" onclick="retryExam()">Retake Exam</button>
    <button class="review-btn" onclick="scrollToTop()">Review Answers</button>
  `;
  container.appendChild(result);
}

function selectOption(qid, letter, isMulti) {
  if (submitted) return;
  const q = questions.find(x => x.id === qid);
  const card = document.getElementById(`q${qid}`);

  if (isMulti) {
    if (!answered[qid]) answered[qid] = [];
    const arr = answered[qid];
    const idx = arr.indexOf(letter);
    if (idx > -1) {
      arr.splice(idx, 1);
    } else {
      if (arr.length < 2) arr.push(letter);
    }
    card.querySelectorAll(".option").forEach(opt => {
      opt.classList.remove("selected");
      if (arr.includes(opt.dataset.letter)) opt.classList.add("selected");
    });
  } else {
    answered[qid] = letter;
    card.querySelectorAll(".option").forEach(opt => {
      opt.classList.remove("selected");
      if (opt.dataset.letter === letter) opt.classList.add("selected");
    });
  }

  card.classList.add("answered");
  updateProgress();
}

function toggleFlag(qid) {
  const btn = document.getElementById(`flag${qid}`);
  btn.classList.toggle("flagged");
}

function updateProgress() {
  const total = questions.length;
  const done = Object.keys(answered).length;
  const pct = (done / total) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${done} / ${total} answered`;
  document.getElementById("liveSkipped").textContent = total - done;
}

function submitExam() {
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, incorrect = 0, unanswered = 0;

  questions.forEach(q => {
    const card = document.getElementById(`q${q.id}`);
    const exp = document.getElementById(`exp${q.id}`);
    const userAns = answered[q.id];
    const isMulti = q.multi === true;

    card.querySelectorAll(".option").forEach(opt => opt.classList.add("disabled"));

    let isCorrect = false;
    if (!userAns || (Array.isArray(userAns) && userAns.length === 0)) {
      unanswered++;
    } else if (isMulti) {
      const sorted1 = [...userAns].sort().join(",");
      const sorted2 = [...q.correct].sort().join(",");
      isCorrect = sorted1 === sorted2;
      if (isCorrect) correct++; else incorrect++;
    } else {
      isCorrect = userAns === q.correct;
      if (isCorrect) correct++; else incorrect++;
    }

    // Color the options
    card.querySelectorAll(".option").forEach(opt => {
      const l = opt.dataset.letter;
      const isCorrectOpt = isMulti ? q.correct.includes(l) : l === q.correct;
      const isSelected = isMulti ? (userAns && userAns.includes(l)) : l === userAns;

      if (isSelected && isCorrectOpt) opt.className = "option disabled correct-ans";
      else if (isSelected && !isCorrectOpt) opt.className = "option disabled wrong-ans";
      else if (!isSelected && isCorrectOpt) opt.className = "option disabled show-correct";
      else opt.className = "option disabled";
    });

    if (isMulti) {
      card.querySelectorAll(".option-letter").forEach(el => {
        const l = el.parentElement.dataset.letter;
        const isCorrectOpt = q.correct.includes(l);
        const isSelected = userAns && userAns.includes(l);
        if (isSelected && isCorrectOpt) el.style.cssText = "border-color:#059669;background:#059669;color:#fff";
        else if (isSelected && !isCorrectOpt) el.style.cssText = "border-color:#dc2626;background:#dc2626;color:#fff";
        else if (!isSelected && isCorrectOpt) el.style.cssText = "border-color:#059669;background:#059669;color:#fff";
      });
    }

    if (userAns) {
      const badge = document.createElement("div");
      badge.className = `result-badge ${isCorrect ? "correct-badge" : "wrong-badge"}`;
      badge.innerHTML = isCorrect ? "✓ Correct" : "✗ Incorrect";
      exp.parentElement.querySelector(".options").after(badge);
    }

    exp.innerHTML = q.explanation;
    exp.classList.add("visible");

    if (isCorrect) card.classList.add("correct-card");
    else if (userAns) card.classList.add("wrong-card");
  });

  // Update live score
  document.getElementById("liveCorrect").textContent = correct;
  document.getElementById("liveIncorrect").textContent = incorrect;
  document.getElementById("liveSkipped").textContent = unanswered;

  const pct = Math.round((correct / questions.length) * 100);
  const pass = pct >= 70;
  const usedSecs = 3600 - totalSeconds;
  const m = Math.floor(usedSecs/60), s = usedSecs%60;

  document.getElementById("finalScoreText").textContent = pct + "%";
  document.getElementById("finalScoreText").className = `final-score ${pass ? "pass" : "fail"}`;
  document.getElementById("finalLabel").textContent = pass ? "PASS — Well done!" : "FAIL — Keep studying!";
  document.getElementById("finalSub").textContent = pass
    ? "You have met the Terraform Associate passing threshold."
    : "You need 70% (40/57) to pass. Review the explanations above.";
  document.getElementById("statCorrect").textContent = correct;
  document.getElementById("statIncorrect").textContent = incorrect;
  document.getElementById("statUnanswered").textContent = unanswered;
  document.getElementById("statTime").textContent = `${m}m ${s}s`;
  document.getElementById("finalResult").classList.add("visible");
  document.getElementById("submitBtn").style.display = "none";

  updateProgress();
  document.getElementById("finalResult").scrollIntoView({behavior:"smooth"});
}

function retryExam() {
  location.reload();
}

function scrollToTop() {
  window.scrollTo({top:0,behavior:"smooth"});
}

function startTimer() {
  timerInterval = setInterval(() => {
    totalSeconds--;
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    const display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const el = document.getElementById("timer");
    el.textContent = display;
    if (totalSeconds <= 300) el.className = "timer-value danger";
    else if (totalSeconds <= 600) el.className = "timer-value warning";

    if (totalSeconds <= 0) {
      clearInterval(timerInterval);
      submitExam();
    }
  }, 1000);
}

buildExam();
startTimer();
</script>
