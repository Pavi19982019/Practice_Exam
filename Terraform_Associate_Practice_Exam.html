{domain:"Provisioners",text:"When does a destroy-time provisioner run?",options:[{l:"A",t:"When terraform init is run"},{l:"B",t:"During terraform plan to preview destruction"},{l:"C",t:"When the resource is being destroyed by terraform destroy or a replacement"},{l:"D",t:"When the resource's create provisioner fails"}],correct:"C",exp:"A provisioner with <code>when = destroy</code> runs <strong>when the resource is being destroyed</strong>. This allows cleanup tasks like deregistering from a load balancer or draining connections before the infrastructure is removed."},

// HCP Terraform (3)
{domain:"HCP Terraform",text:"What is a run in HCP Terraform?",options:[{l:"A",t:"A scheduled cron job that runs Terraform periodically"},{l:"B",t:"A single execution of a Terraform plan and/or apply within a workspace"},{l:"C",t:"A CI/CD pipeline stage in GitHub Actions"},{l:"D",t:"A workspace migration operation"}],correct:"B",exp:"In HCP Terraform, a <strong>run</strong> represents a single execution unit: plan, optional policy checks, optional approval, and apply. Runs are queued, logged, and audited within a workspace."},
{domain:"HCP Terraform",text:"What is the purpose of variable sets in HCP Terraform?",options:[{l:"A",t:"To define variable types shared across all Terraform providers"},{l:"B",t:"To share reusable sets of variables (like credentials) across multiple workspaces"},{l:"C",t:"To lock variable values so they cannot be changed"},{l:"D",t:"To define variables that are only available in certain modules"}],correct:"B",exp:"<strong>Variable sets</strong> in HCP Terraform allow you to define variables once (like AWS credentials) and apply them to <strong>multiple workspaces</strong> — avoiding repetitive configuration and centralizing credential management."},
{domain:"HCP Terraform",text:"Which HCP Terraform feature allows automatic Terraform runs when VCS changes are pushed?",options:[{l:"A",t:"Run triggers"},{l:"B",t:"VCS-driven workflows"},{l:"C",t:"Webhook integration"},{l:"D",t:"Policy sets"}],correct:"B",exp:"<strong>VCS-driven workflows</strong> in HCP Terraform connect a workspace to a VCS repository (GitHub, GitLab, etc.) and automatically trigger runs when changes are pushed to configured branches — enabling GitOps practices."},

// Import (1)
{domain:"Import",text:"When using the new import block (Terraform 1.5+), what advantage does it have over terraform import CLI command?",options:[{l:"A",t:"It is faster at importing resources"},{l:"B",t:"It allows importing multiple resources in one plan/apply and can generate configuration"},{l:"C",t:"It imports resources without needing provider credentials"},{l:"D",t:"It is the only way to import resources into modules"}],correct:"B",exp:"The <code>import</code> block (1.5+) supports <strong>multiple imports in one apply</strong> and, combined with <code>-generate-config-out</code>, can auto-generate the HCL configuration. The CLI command imports one resource at a time and requires manual config writing."},

// Concepts (2)
{domain:"Concepts",text:"What is the difference between terraform plan and terraform apply?",options:[{l:"A",t:"Plan creates resources; apply only validates"},{l:"B",t:"Plan previews changes without making them; apply executes the changes"},{l:"C",t:"Plan is for new configurations; apply is for updates only"},{l:"D",t:"They are identical but apply requires confirmation"}],correct:"B",exp:"<code>terraform plan</code> generates an <strong>execution plan showing proposed changes</strong> without making them. <code>terraform apply</code> actually <strong>executes those changes</strong> (after confirmation). Apply performs a refresh-then-plan before executing."},
{domain:"Concepts",text:"What is the purpose of the terraform graph command?",options:[{l:"A",t:"Displays a bar chart of resource costs"},{l:"B",t:"Outputs a DOT-format dependency graph of the configuration or state"},{l:"C",t:"Shows a timeline of all terraform apply operations"},{l:"D",t:"Visualizes provider network latency"}],correct:"B",exp:"<code>terraform graph</code> outputs the <strong>resource dependency graph in DOT format</strong>, which can be visualized with GraphViz. It helps understand the order of resource creation and inter-resource dependencies."}
];
// SET 3 - 67 questions
const set3 = [
// IaC Concepts (3)
{domain:"IaC Concepts",text:"Which of the following tools is primarily configuration management, not IaC provisioning?",options:[{l:"A",t:"Terraform"},{l:"B",t:"Ansible"},{l:"C",t:"AWS CloudFormation"},{l:"D",t:"Pulumi"}],correct:"B",exp:"<strong>Ansible</strong> is primarily a <strong>configuration management</strong> tool (installing software, configuring OS). Terraform, CloudFormation, and Pulumi are provisioning tools that create infrastructure. Many teams use both."},
{domain:"IaC Concepts",text:"What does 'configuration drift' mean in infrastructure management?",options:[{l:"A",t:"Terraform configuration files becoming outdated"},{l:"B",t:"Infrastructure gradually diverging from its defined configuration due to manual changes"},{l:"C",t:"Provider APIs changing and breaking existing configurations"},{l:"D",t:"HCL syntax errors accumulating over time"}],correct:"B",exp:"<strong>Configuration drift</strong> occurs when infrastructure is <strong>manually modified</strong> outside the IaC tool, causing divergence from defined state. IaC tools like Terraform detect and correct drift during plan/apply."},
{domain:"IaC Concepts",text:"Which principle does IaC enable that traditional infrastructure provisioning does not?",options:[{l:"A",t:"Infrastructure can be made available 24/7"},{l:"B",t:"Infrastructure changes can be peer-reviewed, tested, and tracked like application code"},{l:"C",t:"Cloud providers offer better SLAs for IaC-managed resources"},{l:"D",t:"IaC-managed infrastructure costs less than manually provisioned infrastructure"}],correct:"B",exp:"IaC enables treating infrastructure like code: <strong>peer review, testing pipelines, change tracking, and rollback</strong> — practices from software development applied to infrastructure. SLAs (C) and cost (D) are unrelated."},

// Terraform Purpose (2)
{domain:"Terraform Purpose",text:"What makes Terraform 'cloud-agnostic' compared to tools like AWS CloudFormation?",options:[{l:"A",t:"Terraform runs on any operating system"},{l:"B",t:"Terraform uses a single workflow and HCL syntax to manage resources across any provider"},{l:"C",t:"Terraform does not require internet connectivity"},{l:"D",t:"Terraform is open-source while CloudFormation is proprietary"}],correct:"B",exp:"Terraform is <strong>cloud-agnostic</strong> because it uses a <strong>single HCL syntax and workflow</strong> to manage AWS, Azure, GCP, and hundreds of other providers. CloudFormation is AWS-only. Being open-source (D) is a separate characteristic."},
{domain:"Terraform Purpose",text:"What is the Terraform Registry?",options:[{l:"A",t:"A local directory where Terraform stores downloaded providers"},{l:"B",t:"A public repository of providers, modules, and policies maintained by HashiCorp and the community"},{l:"C",t:"A private registry only available to HCP Terraform customers"},{l:"D",t:"A Git repository containing Terraform's source code"}],correct:"B",exp:"The <strong>Terraform Registry</strong> (registry.terraform.io) is a <strong>public catalog</strong> of providers, modules, and Sentinel policies from HashiCorp, cloud providers, and the community. HCP Terraform also offers a private registry for organizations."},

// Terraform Basics (6)
{domain:"Terraform Basics",text:"What information does the terraform version command display?",options:[{l:"A",t:"Only the Terraform CLI version"},{l:"B",t:"Terraform CLI version, platform, and versions of installed providers"},{l:"C",t:"Terraform version and available updates"},{l:"D",t:"Version history of the current configuration"}],correct:"B",exp:"<code>terraform version</code> shows the <strong>CLI version, platform, and all provider versions</strong> installed in the current workspace. It also warns if a newer version is available."},
{domain:"Terraform Basics",text:"What is HCL in the context of Terraform?",options:[{l:"A",t:"HashiCorp Cloud Language — a cloud provider API"},{l:"B",t:"HashiCorp Configuration Language — the human-readable configuration language used by Terraform"},{l:"C",t:"High-Concurrency Logic — Terraform's parallel execution engine"},{l:"D",t:"HashiCorp Compile Language — used to build provider binaries"}],correct:"B",exp:"<strong>HCL (HashiCorp Configuration Language)</strong> is the domain-specific language used in Terraform's <code>.tf</code> files. It is designed to be human-readable and machine-parseable, balancing usability and expressiveness."},
{domain:"Terraform Basics",text:"What is the terraform.tfstate.backup file?",options:[{l:"A",t:"An encrypted copy of the state file"},{l:"B",t:"Automatically created by Terraform containing the previous state before the last operation"},{l:"C",t:"A manual backup created by the terraform backup command"},{l:"D",t:"A state file from a previous workspace"}],correct:"B",exp:"Terraform <strong>automatically creates terraform.tfstate.backup</strong> before each operation that modifies state. It contains the previous state, providing a one-step recovery option if the current state becomes corrupted."},
{domain:"Terraform Basics",text:"Which of the following Terraform files should typically be added to .gitignore?",options:[{l:"A",t:"*.tf files"},{l:"B",t:"*.tfvars files containing sensitive values, .terraform directory, and terraform.tfstate"},{l:"C",t:".terraform.lock.hcl"},{l:"D",t:"All Terraform files should be committed"}],correct:"B",exp:"<code>.terraform/</code> (provider binaries), <code>terraform.tfstate</code> (may contain secrets), and sensitive <code>*.tfvars</code> should be in <code>.gitignore</code>. The <code>.terraform.lock.hcl</code> <strong>should</strong> be committed to ensure consistent installs."},
{domain:"Terraform Basics",text:"What does the error 'No configuration files' mean when running terraform plan?",options:[{l:"A",t:"Provider configuration is missing"},{l:"B",t:"There are no .tf files in the current directory"},{l:"C",t:"The state file is missing"},{l:"D",t:"Required variables have no values"}],correct:"B",exp:"'No configuration files' means Terraform found <strong>no .tf files in the current directory</strong>. You may be in the wrong directory, or the files haven't been created yet. Terraform requires at least one .tf file to operate."},
{domain:"Terraform Basics",text:"What is the purpose of the terraform block in a configuration?",options:[{l:"A",t:"Defines all Terraform resources"},{l:"B",t:"Configures global settings like required providers, required_version, and backend"},{l:"C",t:"Defines provider-level authentication"},{l:"D",t:"Groups related resources into a logical unit"}],correct:"B",exp:"The <code>terraform</code> block sets <strong>global configuration</strong>: Terraform CLI version constraints (<code>required_version</code>), provider requirements (<code>required_providers</code>), and backend configuration. It's the configuration's metadata block."},

// Providers (5)
{domain:"Providers",text:"What is an 'unofficial' or 'community' provider in the Terraform Registry?",options:[{l:"A",t:"A provider published by HashiCorp but not fully supported"},{l:"B",t:"A provider maintained by the community or third-party organizations, not HashiCorp or the cloud vendor"},{l:"C",t:"A provider that only works with open-source infrastructure"},{l:"D",t:"A provider that bypasses the registry and is loaded from disk"}],correct:"B",exp:"<strong>Community providers</strong> are maintained by third parties (individuals or organizations) on the Registry. They are not vetted by HashiCorp. Use with caution; check maintenance status, version history, and issue tracker."},
{domain:"Providers",text:"What does provider versioning with the ~> operator mean for '~> 4.0'?",options:[{l:"A",t:"Any version >= 4.0.0"},{l:"B",t:"Any version >= 4.0.0 and < 5.0.0"},{l:"C",t:"Any version >= 4.0.0 and < 4.1.0"},{l:"D",t:"Exactly version 4.0.0"}],correct:"B",exp:"<code>~> 4.0</code> means <strong>>= 4.0.0 and < 5.0.0</strong> — allows all minor and patch upgrades within major version 4. Compare: <code>~> 4.0.0</code> means >= 4.0.0 and < 4.1.0 (only patch upgrades). The tilde-arrow is context-sensitive based on specificity."},
{domain:"Providers",text:"How can you install providers in an air-gapped environment?",options:[{l:"A",t:"You cannot use Terraform in air-gapped environments"},{l:"B",t:"Use a private registry mirror or filesystem mirror configured in the CLI config"},{l:"C",t:"Download providers manually and place them in the .terraform directory"},{l:"D",t:"Use the -offline flag with terraform init"}],correct:"B",exp:"Air-gapped environments use a <strong>provider mirror</strong> (private registry or filesystem mirror) configured in <code>~/.terraformrc</code> or <code>terraform.rc</code>. Terraform is directed to the mirror instead of registry.terraform.io."},
{domain:"Providers",text:"What is the default provider source hostname if not explicitly specified?",options:[{l:"A",t:"github.com"},{l:"B",t:"releases.hashicorp.com"},{l:"C",t:"registry.terraform.io"},{l:"D",t:"providers.terraform.io"}],correct:"C",exp:"The default source hostname for providers is <strong>registry.terraform.io</strong>. So <code>hashicorp/aws</code> is shorthand for <code>registry.terraform.io/hashicorp/aws</code>. Private registries use a custom hostname."},
{domain:"Providers",text:"What must you do after adding a new provider to required_providers?",options:[{l:"A",t:"Run terraform validate to register the provider"},{l:"B",t:"Run terraform init to download and install the new provider"},{l:"C",t:"Manually download the provider binary"},{l:"D",t:"Add the provider to the state file"}],correct:"B",exp:"After adding a new provider, you must run <code>terraform init</code> to <strong>download and install the provider binary</strong>. Terraform will error if you run plan/apply without first initializing the new provider."},

// State (8)
{domain:"State",text:"What is the terraform state push command used for?",options:[{l:"A",t:"Pushes local configuration to a remote VCS"},{l:"B",t:"Manually uploads a local state file to the remote backend, overwriting it"},{l:"C",t:"Pushes a plan file to HCP Terraform for approval"},{l:"D",t:"Synchronizes state across multiple workspaces"}],correct:"B",exp:"<code>terraform state push</code> <strong>uploads a local state file to the remote backend</strong>, overwriting it. This is a dangerous operation used for disaster recovery. Use with extreme caution as it can cause inconsistencies."},
{domain:"State",text:"Why might you use terraform state rm before deleting a resource from configuration?",options:[{l:"A",t:"To speed up the next terraform apply"},{l:"B",t:"To remove the resource from Terraform management without destroying the actual infrastructure"},{l:"C",t:"To archive the resource's state for compliance"},{l:"D",t:"To prevent the resource from being included in future plans"}],correct:"B",exp:"Using <code>terraform state rm</code> before removing the config removes the resource from state, so Terraform no longer manages it. Without this, removing the config would cause <code>terraform apply</code> to <strong>destroy the resource</strong>."},
{domain:"State",text:"How does Terraform detect that an existing resource needs to be updated?",options:[{l:"A",t:"By comparing the configuration file modification timestamp to the state file"},{l:"B",t:"By comparing the desired state in configuration to the current state recorded in the state file (and refreshed from provider)"},{l:"C",t:"By running a diff between the current and previous configuration files"},{l:"D",t:"By querying the cloud provider's change log"}],correct:"B",exp:"Terraform compares the <strong>desired state (config)</strong> to the <strong>current state (from state file + provider refresh)</strong>. Any difference is surfaced as a planned change. This is the core of Terraform's declarative model."},
{domain:"State",text:"What is the effect of running terraform apply with -refresh=false on a resource that was manually deleted?",options:[{l:"A",t:"Terraform detects the deletion and recreates the resource"},{l:"B",t:"Terraform does not detect the deletion and may not recreate it (shows no changes)"},{l:"C",t:"Terraform errors because the resource is missing"},{l:"D",t:"Terraform removes the resource from state automatically"}],correct:"B",exp:"With <code>-refresh=false</code>, Terraform skips querying the provider and uses only cached state. If a resource was deleted externally, <strong>Terraform won't know and may show no changes</strong> — a reason to use refresh in normal workflows."},
{domain:"State",text:"When multiple team members run terraform apply simultaneously, what can happen without state locking?",options:[{l:"A",t:"Terraform automatically merges the changes"},{l:"B",t:"State corruption or resource duplication due to concurrent conflicting state writes"},{l:"C",t:"The second apply is automatically queued"},{l:"D",t:"Terraform generates an error and both applies are cancelled"}],correct:"B",exp:"Without locking, concurrent applies can result in <strong>state corruption</strong>: both see the same current state, make changes, and one overwrites the other's state. Locking prevents this by serializing operations."},
{domain:"State",text:"What format is the Terraform state file stored in?",options:[{l:"A",t:"YAML"},{l:"B",t:"XML"},{l:"C",t:"JSON"},{l:"D",t:"HCL"}],correct:"C",exp:"Terraform state is stored as <strong>JSON</strong>. This makes it parseable with tools like <code>jq</code> and enables the <code>terraform state pull</code> workflow. Note: while readable, you should use Terraform commands rather than editing it directly."},
{domain:"State",text:"What does the 'serial' field in the Terraform state file represent?",options:[{l:"A",t:"The order resources were created"},{l:"B",t:"A monotonically increasing number that tracks state file versions to detect conflicts"},{l:"C",t:"The resource's serial number from the cloud provider"},{l:"D",t:"The number of terraform apply operations performed"}],correct:"B",exp:"The <strong>serial</strong> number is a <strong>monotonically increasing integer</strong> that increments with each state modification. Backends use it to detect concurrent modification conflicts — if two applies read the same serial, one will fail with a conflict error."},
{domain:"State",text:"Which terraform state subcommand shows all attributes of a specific resource?",options:[{l:"A",t:"terraform state list <resource>"},{l:"B",t:"terraform state get <resource>"},{l:"C",t:"terraform state show <resource>"},{l:"D",t:"terraform state describe <resource>"}],correct:"C",exp:"<code>terraform state show &lt;resource_address&gt;</code> displays <strong>all attributes of a specific resource</strong> in state in a human-readable format. <code>terraform state list</code> shows addresses only, and <code>state get/describe</code> are not valid subcommands."},

// Backends (4)
{domain:"Backends",text:"What is the local backend in Terraform?",options:[{l:"A",t:"A backend that stores state in a local database"},{l:"B",t:"The default backend that stores state as a file on the local filesystem"},{l:"C",t:"A backend used for development that doesn't support locking"},{l:"D",t:"A backend only available in Terraform Enterprise"}],correct:"B",exp:"The <strong>local backend</strong> is the <strong>default</strong>: it stores state in <code>terraform.tfstate</code> on the local filesystem. It supports a form of file-based locking but is not suitable for team use. All other backends are 'remote'."},
{domain:"Backends",text:"Can you use multiple backends in a single Terraform configuration?",options:[{l:"A",t:"Yes, you can define multiple backend blocks"},{l:"B",t:"No, each configuration can have only one backend"},{l:"C",t:"Yes, but only if they are in different modules"},{l:"D",t:"Yes, one for state and one for operations"}],correct:"B",exp:"Each Terraform configuration supports <strong>exactly one backend</strong>. You cannot have multiple backend blocks. If you need different backends for different components, use separate configurations/directories."},
{domain:"Backends",text:"What is the Azure backend storage for Terraform?",options:[{l:"A",t:"Azure SQL Database"},{l:"B",t:"Azure Blob Storage"},{l:"C",t:"Azure File Share"},{l:"D",t:"Azure Key Vault"}],correct:"B",exp:"Terraform's Azure backend uses <strong>Azure Blob Storage</strong> to store state files. It supports state locking using Azure Blob Storage's native lease mechanism. Azure SQL (A) and Key Vault (D) are not Terraform state backends."},
{domain:"Backends",text:"What is the GCS backend in Terraform?",options:[{l:"A",t:"A backend using Google Cloud SQL"},{l:"B",t:"A backend using Google Cloud Storage buckets to store state"},{l:"C",t:"A backend for Google Compute Engine instances"},{l:"D",t:"Google's proprietary IaC backend service"}],correct:"B",exp:"The <strong>GCS backend</strong> stores Terraform state in <strong>Google Cloud Storage buckets</strong>. It supports state locking natively via GCS object locking. GCS is GCP's equivalent of AWS S3."},

// Configuration (8)
{domain:"Configuration",text:"What is the object type constraint in Terraform used for?",options:[{l:"A",t:"Defining a variable that accepts any type of value"},{l:"B",t:"Defining a variable with specific named attributes, each with its own type"},{l:"C",t:"Creating an object resource in a cloud provider"},{l:"D",t:"Defining a map where all values have the same type"}],correct:"B",exp:"The <code>object({})</code> type constraint defines a variable with <strong>specific named attributes</strong>, each with its own type: <code>object({ name = string, count = number })</code>. This is stricter than <code>map</code> which requires uniform value types."},
{domain:"Configuration",text:"How does Terraform handle multiple .tf files in the same directory?",options:[{l:"A",t:"Only the main.tf file is read; others are ignored"},{l:"B",t:"All .tf files in the directory are read and merged into one configuration"},{l:"C",t:"Files are processed in alphabetical order and later files override earlier ones"},{l:"D",t:"Each .tf file represents a separate module"}],correct:"B",exp:"Terraform <strong>reads and merges all .tf files</strong> in the current directory. The order doesn't matter; there are no overrides. Split configuration across multiple files (variables.tf, main.tf, outputs.tf) for organization without any functional difference."},
{domain:"Configuration",text:"What is the purpose of the nullable = false argument in a variable block?",options:[{l:"A",t:"Prevents the variable from having a null default value"},{l:"B",t:"Ensures the variable value is never null, even if explicitly set to null by the caller"},{l:"C",t:"Makes the variable required (same as having no default)"},{l:"D",t:"Prevents null values from appearing in outputs"}],correct:"B",exp:"<code>nullable = false</code> means that if a caller passes <code>null</code> for the variable, Terraform will use the <strong>default value instead</strong> of null. It ensures the variable is never null within the module."},
{domain:"Configuration",text:"Which escape sequence is used in Terraform HCL to include a literal dollar sign in a string?",options:[{l:"A",t:"\\$"},{l:"B",t:"$$"},{l:"C",t:'\"$\"'},{l:"D",t:"${\"$\"}"}],correct:"B",exp:"In Terraform HCL, <code>$$</code> is the escape sequence for a <strong>literal dollar sign</strong>. <code>${}</code> starts template interpolation, so <code>$$</code> prevents Terraform from interpreting it as a template sequence."},
{domain:"Configuration",text:"What is the any type in Terraform variable definitions?",options:[{l:"A",t:"A variable that accepts a value of any Terraform type without type checking"},{l:"B",t:"A variable that is automatically set to all available values"},{l:"C",t:"A variable that accepts values from any source (CLI, env, file)"},{l:"D",t:"A wildcard type that matches all resources"}],correct:"A",exp:"The <code>any</code> type constraint disables <strong>type checking</strong> for the variable — it accepts any value. Terraform infers the type from the assigned value. Useful for flexible modules but reduces type safety."},
{domain:"Configuration",text:"What is the difference between null and not setting a value in Terraform?",options:[{l:"A",t:"There is no difference; null and unset are identical"},{l:"B",t:"null is an explicit absence of value; unset uses the provider's default or omits the argument from the API call"},{l:"C",t:"null causes Terraform to error; unset is valid"},{l:"D",t:"null means the provider will delete the attribute; unset means create with default"}],correct:"B",exp:"<code>null</code> is an <strong>explicit absence</strong>: when an argument is set to null, Terraform omits it from the API call, using the provider's default. Unset arguments in resources that have no default may be required and cause errors."},
{domain:"Configuration",text:"What is the purpose of the precondition block in a resource?",options:[{l:"A",t:"Validates that provider credentials are correct before applying"},{l:"B",t:"Defines conditions that must be true before Terraform attempts to manage the resource"},{l:"C",t:"Sets up pre-apply hooks for notification systems"},{l:"D",t:"Validates the resource exists in the cloud before creating it"}],correct:"B",exp:"<code>precondition</code> blocks (inside <code>lifecycle</code>) define <strong>conditions that must be true</strong> before managing a resource. If the condition fails, Terraform raises an error with a custom message. This enables contract-driven infrastructure."},
{domain:"Configuration",text:"What does the postcondition block in a resource lifecycle verify?",options:[{l:"A",t:"Verifies the resource was created successfully in the cloud"},{l:"B",t:"Asserts conditions about the resource after it's created, to catch unexpected provider behavior"},{l:"C",t:"Runs a post-apply notification"},{l:"D",t:"Verifies output values after apply"}],correct:"B",exp:"<code>postcondition</code> blocks verify <strong>conditions about the resource after creation</strong>. If the assertion fails, Terraform raises an error. This catches cases where a provider creates a resource with unexpected attribute values."},

// Meta-Arguments (5)
{domain:"Meta-Arguments",text:"What is the purpose of the provider meta-argument in a resource block?",options:[{l:"A",t:"Specifies the provider version for that resource only"},{l:"B",t:"Selects a specific provider configuration (by alias) for the resource"},{l:"C",t:"Enables or disables provider authentication for that resource"},{l:"D",t:"Defines custom provider settings within the resource"}],correct:"B",exp:"The <code>provider</code> meta-argument selects a <strong>specific provider configuration by alias</strong>. Example: <code>provider = aws.eu_west</code> uses the AWS provider configured with alias <code>eu_west</code>, typically for a different region."},
{domain:"Meta-Arguments",text:"What is the count.index expression used for?",options:[{l:"A",t:"Gets the total count of resources created"},{l:"B",t:"Accesses the current index (0-based) within a count-created resource instance"},{l:"C",t:"Returns the index of the last successfully applied resource"},{l:"D",t:"Counts the number of failed resource operations"}],correct:"B",exp:"<code>count.index</code> provides the <strong>0-based index of the current instance</strong> within a count loop. Used to create unique names: <code>\"server-${count.index}\"</code> produces server-0, server-1, etc."},
{domain:"Meta-Arguments",text:"How do you convert a for_each resource to reference a specific instance externally?",options:[{l:"A",t:"resource_type.resource_name[\"key\"]"},{l:"B",t:"resource_type.resource_name.key"},{l:"C",t:"resource_type.resource_name[key]"},{l:"D",t:"resource_type.resource_name{key}"}],correct:"A",exp:"For <code>for_each</code> resources, specific instances are referenced with bracket notation and a quoted key: <code>aws_instance.web[\"prod\"]</code>. The key must be a string literal in quotes."},
{domain:"Meta-Arguments",text:"When should you use depends_on instead of relying on Terraform's implicit dependency detection?",options:[{l:"A",t:"Always use depends_on for clarity"},{l:"B",t:"When a resource depends on another resource's side effects not captured in references"},{l:"C",t:"When using modules with multiple providers"},{l:"D",t:"When resources have circular dependencies"}],correct:"B",exp:"Use <code>depends_on</code> when a resource depends on a <strong>side effect</strong> that isn't captured in a resource reference. For example, an EC2 instance that needs an IAM role's policies to be ready even though it doesn't reference the policy resource directly."},
{domain:"Meta-Arguments",text:"What is the effect of setting lifecycle { prevent_destroy = true } on a resource?",options:[{l:"A",t:"Prevents terraform destroy from running for any resource"},{l:"B",t:"Causes terraform plan/apply to error if the plan would destroy that resource"},{l:"C",t:"Prevents the resource from being updated in-place"},{l:"D",t:"Makes the resource read-only in state"}],correct:"B",exp:"<code>prevent_destroy = true</code> causes Terraform to <strong>error during plan/apply</strong> if the resource would be destroyed — protecting critical resources like databases from accidental deletion. It does not stop the entire destroy operation (A)."},

// Modules (5)
{domain:"Modules",text:"What is the difference between a public and private module registry?",options:[{l:"A",t:"Public modules are free; private modules require payment"},{l:"B",t:"Public registry (registry.terraform.io) is accessible to all; private registries are hosted within organizations for internal modules"},{l:"C",t:"Private modules use a different HCL syntax"},{l:"D",t:"Public modules can only be used in read-only mode"}],correct:"B",exp:"The <strong>public Terraform Registry</strong> hosts community modules. <strong>Private registries</strong> (HCP Terraform, Terraform Enterprise, or custom) host internal modules visible only to the organization — enabling module sharing without public exposure."},
{domain:"Modules",text:"What is module versioning in the Terraform Registry?",options:[{l:"A",t:"Tracking which Terraform CLI version created the module"},{l:"B",t:"Semantic versioning of module releases allowing consumers to pin specific versions"},{l:"C",t:"A Git tag applied to module configuration files"},{l:"D",t:"A checksum that verifies module integrity"}],correct:"B",exp:"Terraform Registry modules use <strong>semantic versioning</strong> (1.0.0, ~> 2.0, etc.). Module authors publish new versions; consumers pin versions with the <code>version</code> argument in module blocks. Git-sourced modules use Git refs instead."},
{domain:"Modules",text:"What happens when you run terraform init on a configuration with module calls?",options:[{l:"A",t:"Modules are validated but not downloaded"},{l:"B",t:"Module source code is downloaded into .terraform/modules/"},{l:"C",t:"Module outputs are pre-evaluated"},{l:"D",t:"Modules are compiled into a binary"}],correct:"B",exp:"<code>terraform init</code> downloads module source code into <code>.terraform/modules/</code>. For registry modules, the specific version is downloaded. For local modules, symlinks are created. This is why init must be re-run after adding modules."},
{domain:"Modules",text:"Which statement about module outputs is correct?",options:[{l:"A",t:"Modules automatically export all resource attributes as outputs"},{l:"B",t:"Only explicitly declared output blocks in the module are accessible to the calling module"},{l:"C",t:"Module outputs are only accessible from the root module"},{l:"D",t:"Outputs cannot be sensitive in child modules"}],correct:"B",exp:"Modules only expose values through <strong>explicitly declared output blocks</strong>. The calling module accesses them via <code>module.name.output_name</code>. No attributes are automatically exported."},
{domain:"Modules",text:"How do you use a module from a specific Git branch?",options:[{l:"A",t:'source = "git::https://github.com/org/repo.git?branch=main"'},{l:"B",t:'source = "git::https://github.com/org/repo.git//module?ref=main"'},{l:"C",t:'source = "github.com/org/repo" version = "main"'},{l:"D",t:'source = "git::https://github.com/org/repo.git" ref = "main"'}],correct:"B",exp:"Git module sources support the <code>?ref=</code> query parameter for branches, tags, or commits. The <code>//</code> separator points to a subdirectory. Full form: <code>git::https://github.com/org/repo.git//path?ref=branch</code>."},

// CLI (5)
{domain:"CLI",text:"What does the terraform force-unlock command do?",options:[{l:"A",t:"Forces an apply to run ignoring validation errors"},{l:"B",t:"Manually releases a stuck state lock when an operation was interrupted"},{l:"C",t:"Forces a provider to unlock its cache"},{l:"D",t:"Unlocks a resource protected by prevent_destroy"}],correct:"B",exp:"<code>terraform force-unlock &lt;lock_id&gt;</code> <strong>manually releases a state lock</strong> when a previous operation failed to release it (e.g., network interruption during apply). Use with caution — only when no other operation is running."},
{domain:"CLI",text:"What does the -json flag do for terraform plan output?",options:[{l:"A",t:"Saves the plan as a JSON file"},{l:"B",t:"Outputs the plan in machine-readable JSON format for programmatic processing"},{l:"C",t:"Converts the HCL configuration to JSON format"},{l:"D",t:"Formats log output as JSON"}],correct:"B",exp:"<code>terraform plan -json</code> streams <strong>machine-readable JSON events</strong> to stdout, suitable for CI/CD pipelines, custom UIs, and tooling that parse Terraform output programmatically."},
{domain:"CLI",text:"What does terraform workspace list display?",options:[{l:"A",t:"All remote backends configured"},{l:"B",t:"All workspaces in the current configuration with the active one marked with *"},{l:"C",t:"All Terraform configurations in the current directory"},{l:"D",t:"Available Terraform versions"}],correct:"B",exp:"<code>terraform workspace list</code> shows <strong>all workspaces</strong> with the currently selected workspace marked with an asterisk (*). Always includes the 'default' workspace."},
{domain:"CLI",text:"What is the purpose of the TF_LOG environment variable?",options:[{l:"A",t:"Sets the logging level for cloud provider API calls"},{l:"B",t:"Enables detailed Terraform debug logging (TRACE, DEBUG, INFO, WARN, ERROR)"},{l:"C",t:"Configures log output destination"},{l:"D",t:"Logs variable values for debugging"}],correct:"B",exp:"<code>TF_LOG</code> enables <strong>Terraform's built-in logging</strong> at levels TRACE (most verbose), DEBUG, INFO, WARN, or ERROR. Set <code>TF_LOG_PATH</code> to write logs to a file. Essential for debugging provider issues."},
{domain:"CLI",text:"What does terraform apply -replace=<resource> do?",options:[{l:"A",t:"Replaces the state file with a backup"},{l:"B",t:"Forces the specified resource to be destroyed and recreated on the next apply"},{l:"C",t:"Replaces variable values with new ones"},{l:"D",t:"Swaps the active workspace"}],correct:"B",exp:"<code>terraform apply -replace=resource_address</code> <strong>forces a specific resource to be destroyed and recreated</strong>. This is the modern replacement for <code>terraform taint</code>, available since Terraform 0.15.2."},

// Data Sources (2)
{domain:"Data Sources",text:"What is the difference between a data source and a resource in Terraform?",options:[{l:"A",t:"Data sources are faster to create than resources"},{l:"B",t:"Resources create and manage infrastructure; data sources read existing information without creating anything"},{l:"C",t:"Data sources require provider credentials; resources do not"},{l:"D",t:"Resources are immutable; data sources can be modified"}],correct:"B",exp:"<strong>Resources</strong> (declared with <code>resource</code>) create and manage infrastructure lifecycle. <strong>Data sources</strong> (declared with <code>data</code>) are <em>read-only</em> — they query existing information without any create/update/delete lifecycle."},
{domain:"Data Sources",text:"When is a data source read/evaluated during the Terraform workflow?",options:[{l:"A",t:"Only during terraform init"},{l:"B",t:"During terraform plan (or apply time if it depends on resources not yet created)"},{l:"C",t:"Only during terraform apply, never during plan"},{l:"D",t:"Only when explicitly triggered with terraform refresh"}],correct:"B",exp:"Data sources are read during <strong>terraform plan</strong> by default. If they have a <code>depends_on</code> or their query depends on a value unknown until apply time, they are deferred to <strong>apply time</strong>."},

// Functions (4)
{domain:"Functions",text:"What does the flatten() function do in Terraform?",options:[{l:"A",t:"Removes all null values from a list"},{l:"B",t:"Converts a nested list (list of lists) into a single flat list"},{l:"C",t:"Flattens a map into a list of key-value pairs"},{l:"D",t:"Removes duplicate values from a list"}],correct:"B",exp:"<code>flatten()</code> takes a <strong>nested list and produces a single flat list</strong>. Example: <code>flatten([[\"a\",\"b\"],[\"c\"]])</code> returns <code>[\"a\",\"b\",\"c\"]</code>. Useful when collecting outputs from multiple for expressions that each produce lists."},
{domain:"Functions",text:"What is the format() function used for in Terraform?",options:[{l:"A",t:"Formats the Terraform configuration files"},{l:"B",t:"Produces a formatted string using printf-style format specifiers"},{l:"C",t:"Formats JSON output from data sources"},{l:"D",t:"Converts numbers to formatted currency strings"}],correct:"B",exp:"<code>format(spec, values...)</code> produces a <strong>formatted string</strong> using printf-style specifiers: <code>format(\"%-10s\", \"hello\")</code>. Useful for constructing strings with specific padding, precision, or formatting."},
{domain:"Functions",text:"What does the coalesce() function return in Terraform?",options:[{l:"A",t:"The first non-null, non-empty string from its arguments"},{l:"B",t:"The combination of all arguments into a single value"},{l:"C",t:"The last argument regardless of null"},{l:"D",t:"A null value if any argument is null"}],correct:"A",exp:"<code>coalesce(val1, val2, ...)</code> returns the <strong>first non-null, non-empty string</strong> from its arguments. Useful for fallback values: <code>coalesce(var.custom_name, var.default_name, \"fallback\")</code>."},
{domain:"Functions",text:"What does the jsonencode() function do in Terraform?",options:[{l:"A",t:"Validates that a string is valid JSON"},{l:"B",t:"Converts a Terraform value (map, list, etc.) to a JSON-formatted string"},{l:"C",t:"Decodes a JSON string into a Terraform map"},{l:"D",t:"Encodes a string to Base64 JSON format"}],correct:"B",exp:"<code>jsonencode(val)</code> <strong>converts a Terraform value to a JSON string</strong>. Useful for passing structured data as strings to resources like IAM policies: <code>jsonencode({ Version = \"2012-10-17\", Statement = [...] })</code>."},

// Workspaces (2)
{domain:"Workspaces",text:"What is the behavior when you delete a workspace in Terraform?",options:[{l:"A",t:"All resources in that workspace are automatically destroyed"},{l:"B",t:"You must first destroy all resources; then the workspace can be deleted"},{l:"C",t:"The workspace state is archived but not deleted"},{l:"D",t:"The default workspace absorbs the deleted workspace's resources"}],correct:"B",exp:"You <strong>cannot delete a workspace with resources</strong> in its state. You must first run <code>terraform destroy</code> to remove all managed resources, then switch to another workspace and delete the empty one with <code>terraform workspace delete</code>."},
{domain:"Workspaces",text:"Which backend does NOT support Terraform workspaces?",options:[{l:"A",t:"S3 backend"},{l:"B",t:"HCP Terraform backend"},{l:"C",t:"Local backend"},{l:"D",t:"All backends support workspaces"}],correct:"D",exp:"<strong>All backends support workspaces</strong>. The local backend stores separate state files with workspace-based names. Remote backends like S3 store workspace states in separate paths/keys. HCP Terraform has first-class workspace support."},

// Provisioners (2)
{domain:"Provisioners",text:"What connection block is used with remote-exec provisioners?",options:[{l:"A",t:"A connect block specifying SSH or WinRM credentials"},{l:"B",t:"A connection block specifying type (ssh/winrm), host, user, and credentials"},{l:"C",t:"A remote block inside the provisioner"},{l:"D",t:"Provider-level connection settings"}],correct:"B",exp:"A <code>connection</code> block defines how to connect to the resource: <code>type</code> (ssh or winrm), <code>host</code>, <code>user</code>, and credentials (private_key or password). This block lives inside the resource or provisioner block."},
{domain:"Provisioners",text:"What is the null_resource commonly used with provisioners for?",options:[{l:"A",t:"Creating placeholder resources that consume no cloud quota"},{l:"B",t:"Running provisioners independently of any specific managed resource"},{l:"C",t:"Testing Terraform configurations without incurring costs"},{l:"D",t:"Creating resources that null out other resources"}],correct:"B",exp:"<code>null_resource</code> allows running provisioners that <strong>aren't tied to a specific infrastructure resource</strong>. Combined with <code>triggers</code>, it re-runs when specified values change. The newer <code>terraform_data</code> resource is the preferred replacement."},

// HCP Terraform (3)
{domain:"HCP Terraform",text:"What are HCP Terraform's remote run modes?",options:[{l:"A",t:"Plan-only and apply-only modes"},{l:"B",t:"Remote operations and local operations — remote executes plan/apply on HCP servers; local runs locally but stores state remotely"},{l:"C",t:"Synchronous and asynchronous modes"},{l:"D",t:"Read-write and read-only modes"}],correct:"B",exp:"HCP Terraform supports <strong>remote operations</strong> (plan/apply run on HCP infrastructure) and <strong>local operations</strong> (plan/apply run locally but state stored on HCP). Remote operations enable centralized logs, policies, and notifications."},
{domain:"HCP Terraform",text:"What is an HCP Terraform organization?",options:[{l:"A",t:"A billing entity that groups users and workspaces"},{l:"B",t:"A top-level entity in HCP Terraform that contains teams, workspaces, variable sets, and policies"},{l:"C",t:"An infrastructure organization managed by Terraform"},{l:"D",t:"A provider namespace in the Terraform Registry"}],correct:"B",exp:"An <strong>HCP Terraform organization</strong> is the top-level container for all HCP Terraform resources: teams, workspaces, policies, variable sets, and registry modules. It represents a company or department using HCP Terraform."},
{domain:"HCP Terraform",text:"What is the purpose of the ATLAS_TOKEN environment variable (or TFE_TOKEN)?",options:[{l:"A",t:"Authenticates Terraform with cloud providers"},{l:"B",t:"Authenticates the Terraform CLI with HCP Terraform or Terraform Enterprise"},{l:"C",t:"Sets the API token for the Terraform Registry"},{l:"D",t:"Enables Terraform's Atlas configuration management features"}],correct:"B",exp:"<code>TFE_TOKEN</code> (or <code>ATLAS_TOKEN</code>, legacy) authenticates the <strong>Terraform CLI with HCP Terraform</strong> (or Terraform Enterprise). Used in the cloud backend configuration and for API operations. Set in CLI config or environment."},

// Import (1)
{domain:"Import",text:"What configuration must exist before running terraform import for a resource?",options:[{l:"A",t:"Nothing; terraform import creates the configuration automatically"},{l:"B",t:"A matching resource block in the configuration must be written manually"},{l:"C",t:"Only the provider configuration is needed"},{l:"D",t:"A data source block referencing the resource"}],correct:"B",exp:"Before <code>terraform import</code>, you must <strong>write the matching resource block</strong> in your configuration. The command adds the resource to state and associates it with the config block, but does not generate the HCL. (Terraform 1.5+ can generate config with <code>-generate-config-out</code>.)"},

// Concepts (2)
{domain:"Concepts",text:"What does 'desired state' mean in Terraform?",options:[{l:"A",t:"The state of infrastructure after the last successful apply"},{l:"B",t:"The infrastructure configuration described in .tf files that Terraform works to achieve"},{l:"C",t:"The infrastructure state stored in the state file"},{l:"D",t:"The infrastructure state monitored by HCP Terraform"}],correct:"B",exp:"<strong>Desired state</strong> is what you've described in your <code>.tf</code> configuration files — what you <em>want</em> the infrastructure to look like. Terraform compares desired state to current state and makes changes to reconcile them."},
{domain:"Concepts",text:"What is a Terraform plan file and why is it important in CI/CD?",options:[{l:"A",t:"A YAML file describing the deployment pipeline"},{l:"B",t:"A binary file containing exact planned changes, ensuring what was reviewed in CI is what gets applied"},{l:"C",t:"A log file of previous terraform apply outputs"},{l:"D",t:"A configuration file for HCP Terraform run queues"}],correct:"B",exp:"A <strong>plan file</strong> (from <code>terraform plan -out=file</code>) captures exact changes. In CI/CD, a human reviews the plan, and then <code>terraform apply file</code> executes <strong>exactly those changes</strong> — no re-planning, no drift between review and apply."}
];
// SET 4 - 67 questions
const set4 = [
// IaC Concepts (3)
{domain:"IaC Concepts",text:"What is 'cattle vs pets' mentality in infrastructure management?",options:[{l:"A",t:"Pets are uniquely named and maintained; cattle are identical, replaceable instances"},{l:"B",t:"Cattle infrastructure uses more cloud resources than pet infrastructure"},{l:"C",t:"Pets are cloud-native; cattle are on-premises infrastructure"},{l:"D",t:"Cattle infrastructure requires more manual configuration"}],correct:"A",exp:"<strong>Pets vs Cattle</strong>: 'Pets' are individually named, maintained servers (old approach). 'Cattle' are identical, disposable instances — if one fails, replace it. IaC and immutable infrastructure promote the cattle approach for reliability and scalability."},
{domain:"IaC Concepts",text:"What does 'infrastructure provisioning' mean in the context of IaC tools?",options:[{l:"A",t:"Installing software and configuring operating systems on existing servers"},{l:"B",t:"Creating and managing the underlying infrastructure (VMs, networks, storage) on which applications run"},{l:"C",t:"Monitoring infrastructure health and performance"},{l:"D",t:"Deploying application containers to Kubernetes"}],correct:"B",exp:"<strong>Infrastructure provisioning</strong> is creating and managing foundational resources: virtual machines, networks, storage, DNS, etc. Terraform excels at this. Configuration management (Ansible, Chef) handles software installation on existing servers (A)."},
{domain:"IaC Concepts",text:"What is a key difference between push and pull configuration models?",options:[{l:"A",t:"Push models use Terraform; pull models use CloudFormation"},{l:"B",t:"Push models send configuration to nodes from a central server; pull models have nodes fetch their own configuration"},{l:"C",t:"Push is for cloud infrastructure; pull is for on-premises"},{l:"D",t:"Pull models are more secure than push models"}],correct:"B",exp:"In <strong>push models</strong>, a central server pushes configuration to managed nodes (Ansible). In <strong>pull models</strong>, nodes periodically fetch their desired config from a server (Chef, Puppet). Terraform is neither — it's an orchestration tool."},

// Terraform Purpose (2)
{domain:"Terraform Purpose",text:"Which of the following is NOT a core Terraform use case?",options:[{l:"A",t:"Provisioning cloud infrastructure like VMs and networks"},{l:"B",t:"Real-time monitoring and alerting for infrastructure"},{l:"C",t:"Managing DNS records and CDN configurations"},{l:"D",t:"Creating and managing Kubernetes resources"}],correct:"B",exp:"Terraform is for <strong>provisioning and managing infrastructure</strong> lifecycle, not real-time monitoring. For monitoring, use tools like Datadog, Prometheus, or CloudWatch. Terraform can provision the monitoring infrastructure (C, D are valid use cases)."},
{domain:"Terraform Purpose",text:"What does Terraform Open Source offer compared to HCP Terraform?",options:[{l:"A",t:"More providers and modules"},{l:"B",t:"The core IaC engine with local state management, without SaaS features like remote runs and policy enforcement"},{l:"C",t:"Better security than HCP Terraform"},{l:"D",t:"Unlimited concurrent operations"}],correct:"B",exp:"Terraform Open Source provides the <strong>core IaC engine</strong> with local/remote state via backends, but lacks HCP Terraform's SaaS features: remote runs, Sentinel policies, team management, audit logs, and VCS integration."},

// Terraform Basics (6)
{domain:"Terraform Basics",text:"What does the error 'Error: Unsupported argument' typically indicate?",options:[{l:"A",t:"The argument name is misspelled or not supported by the resource type"},{l:"B",t:"The argument value is the wrong type"},{l:"C",t:"The provider version doesn't support the resource"},{l:"D",t:"The state file is corrupted"}],correct:"A",exp:"'Unsupported argument' means you used an <strong>argument name that the resource doesn't recognize</strong> — either a typo or an attribute that doesn't exist in this resource type or provider version. Check provider documentation."},
{domain:"Terraform Basics",text:"In Terraform, what is a module call?",options:[{l:"A",t:"A CLI command to invoke a module"},{l:"B",t:"A module block in configuration that instantiates a module from a source"},{l:"C",t:"A function call within a module"},{l:"D",t:"An API call made by a provider module"}],correct:"B",exp:"A <strong>module call</strong> is a <code>module</code> block that instantiates a module: specifying the <code>source</code>, optional <code>version</code>, and input variable values. This is how you reuse modules in your configuration."},
{domain:"Terraform Basics",text:"What is a resource address in Terraform?",options:[{l:"A",t:"The cloud provider URL for the resource"},{l:"B",t:"A unique identifier like resource_type.resource_name[index] used to reference a resource in state and CLI operations"},{l:"C",t:"The ARN or resource ID assigned by the cloud provider"},{l:"D",t:"The file path where the resource is defined"}],correct:"B",exp:"A <strong>resource address</strong> uniquely identifies a resource instance in Terraform: <code>aws_instance.web</code>, <code>module.vpc.aws_subnet.public[0]</code>. Used in CLI commands like <code>-target</code>, <code>state mv</code>, and <code>terraform import</code>."},
{domain:"Terraform Basics",text:"What does 'implicit dependency' mean in Terraform?",options:[{l:"A",t:"A dependency that Terraform creates automatically for all resources"},{l:"B",t:"Terraform automatically infers ordering when one resource references an attribute of another"},{l:"C",t:"A hidden dependency in the provider that Terraform cannot detect"},{l:"D",t:"A dependency defined by the depends_on meta-argument"}],correct:"B",exp:"<strong>Implicit dependencies</strong> are automatically detected when one resource references an attribute of another. Example: an EC2 instance referencing a security group's ID — Terraform knows to create the SG first. No explicit <code>depends_on</code> needed."},
{domain:"Terraform Basics",text:"What is the purpose of the .terraform directory?",options:[{l:"A",t:"Stores HCL configuration files"},{l:"B",t:"Stores downloaded providers, modules, and backend configuration after terraform init"},{l:"C",t:"Stores the Terraform state file"},{l:"D",t:"Stores Terraform logs and audit trails"}],correct:"B",exp:"The <strong>.terraform directory</strong> is created by <code>terraform init</code> and contains: provider binaries, downloaded modules, and backend configuration. It should be gitignored — it's regenerated by <code>terraform init</code>."},
{domain:"Terraform Basics",text:"What does Terraform do when it encounters an 'Unknown' value during plan?",options:[{l:"A",t:"It errors and stops the plan"},{l:"B",t:"It shows the attribute as (known after apply) and proceeds with the plan"},{l:"C",t:"It substitutes a default value"},{l:"D",t:"It queries the provider for the value"}],correct:"B",exp:"When a value is unknown until apply time (e.g., a resource ID not yet created), Terraform shows it as <strong>(known after apply)</strong> in the plan. This is normal — apply resolves the value when the dependency is created."},

// Providers (5)
{domain:"Providers",text:"What is a provider schema?",options:[{l:"A",t:"A JSON file defining provider authentication methods"},{l:"B",t:"The definition of all resource types, data sources, and their attributes that a provider exposes"},{l:"C",t:"A template for generating provider configuration"},{l:"D",t:"The provider's YAML configuration file"}],correct:"B",exp:"A <strong>provider schema</strong> defines all the resource types, data sources, functions, and attribute types a provider exposes. Terraform uses this schema to validate configurations and generate documentation. Run <code>terraform providers schema</code> to view it."},
{domain:"Providers",text:"How are provider credentials typically kept out of version control?",options:[{l:"A",t:"By hardcoding them in the provider block with encryption"},{l:"B",t:"By using environment variables or a secrets manager, not hardcoding in configuration files"},{l:"C",t:"By storing them in terraform.tfstate"},{l:"D",t:"By adding them to .terraform.lock.hcl"}],correct:"B",exp:"Credentials should be passed via <strong>environment variables</strong> (AWS_ACCESS_KEY_ID, etc.) or secrets managers (Vault, AWS Secrets Manager), never hardcoded in .tf files that are committed to version control."},
{domain:"Providers",text:"What is the providers mirror command in Terraform?",options:[{l:"A",t:"Creates a mirror copy of the state file"},{l:"B",t:"Saves provider binaries to a local mirror directory for use in air-gapped environments"},{l:"C",t:"Mirrors provider configuration to multiple regions"},{l:"D",t:"Lists all mirrored providers in the cache"}],correct:"B",exp:"<code>terraform providers mirror &lt;dir&gt;</code> downloads all required providers and saves them to a <strong>local directory for use as a filesystem mirror</strong> — enabling provider installation in air-gapped or offline environments."},
{domain:"Providers",text:"What happens when two modules require different versions of the same provider?",options:[{l:"A",t:"Terraform uses the newer version for all modules"},{l:"B",t:"Terraform errors if versions are incompatible; if ranges overlap, it selects a version satisfying both"},{l:"C",t:"Each module downloads its own provider version independently"},{l:"D",t:"Terraform uses the version specified in the root module only"}],correct:"B",exp:"Terraform resolves providers globally. If two modules' version constraints have an <strong>overlapping range</strong>, Terraform picks one satisfying both. If constraints are incompatible (no overlap), Terraform errors — requiring manual resolution."},
{domain:"Providers",text:"What is the terraform providers lock command used for?",options:[{l:"A",t:"Locks the Terraform binary from being upgraded"},{l:"B",t:"Updates the provider lock file with checksums for additional platforms"},{l:"C",t:"Prevents providers from being modified"},{l:"D",t:"Locks provider credentials in a vault"}],correct:"B",exp:"<code>terraform providers lock</code> updates the <strong>lock file with provider checksums for additional platforms</strong>. This is important in cross-platform teams where CI runs on Linux but developers use macOS — ensuring all platforms have verified checksums."},

// State (8)
{domain:"State",text:"What does the terraform state replace-provider command do?",options:[{l:"A",t:"Upgrades all providers in the state to newer versions"},{l:"B",t:"Updates state to use a different provider source for resources (e.g., when migrating from community to official provider)"},{l:"C",t:"Replaces the entire state file with a backup"},{l:"D",t:"Swaps provider credentials in state"}],correct:"B",exp:"<code>terraform state replace-provider</code> <strong>updates state to use a new provider source</strong> for existing resources. Used when migrating from an unofficial provider (<code>terraform-providers/aws</code>) to the official one (<code>hashicorp/aws</code>)."},
{domain:"State",text:"How does Terraform handle resources that exist in the cloud but not in the state file?",options:[{l:"A",t:"Terraform automatically imports them during plan"},{l:"B",t:"Terraform is unaware of them and will not manage or modify them"},{l:"C",t:"Terraform proposes to delete them"},{l:"D",t:"Terraform adds them to the next apply"}],correct:"B",exp:"Terraform is <strong>only aware of resources it manages</strong> (in state). Resources created outside Terraform — even in the same account — are invisible to it and will not be touched. You must use <code>terraform import</code> to bring them under management."},
{domain:"State",text:"What causes a 'state lock' error in Terraform?",options:[{l:"A",t:"The state file is read-only"},{l:"B",t:"Another Terraform operation is running and holds the lock, or a previous operation didn't release it"},{l:"C",t:"The provider credentials are expired"},{l:"D",t:"The state file format is invalid"}],correct:"B",exp:"A <strong>state lock error</strong> occurs when another operation holds the lock (concurrent runs are blocked) or a previous operation crashed without releasing the lock. Use <code>terraform force-unlock</code> only when certain no other operation is running."},
{domain:"State",text:"Which attribute in the S3 backend configuration enables state encryption?",options:[{l:"A",t:"secure = true"},{l:"B",t:"kms_key_id or encrypt = true"},{l:"C",t:"encryption = \"AES256\""},{l:"D",t:"ssl_enabled = true"}],correct:"B",exp:"The S3 backend supports <code>encrypt = true</code> for S3 server-side encryption and optionally <code>kms_key_id</code> for customer-managed KMS key encryption. These enable <strong>server-side encryption of state files at rest</strong>."},
{domain:"State",text:"What is the purpose of the terraform_data resource (Terraform 1.4+)?",options:[{l:"A",t:"A replacement for data sources that caches provider data"},{l:"B",t:"A built-in resource that stores arbitrary data in state and replaces null_resource for triggering provisioners"},{l:"C",t:"A resource that manages Terraform configuration metadata"},{l:"D",t:"An alternative to the local backend for state storage"}],correct:"B",exp:"<code>terraform_data</code> is a built-in resource (no provider needed) that stores arbitrary values in state and can trigger replacement via its <code>triggers_replace</code> argument. It's the modern replacement for <code>null_resource</code> with triggers."},
{domain:"State",text:"What does 'plan -generate-config-out' do in Terraform 1.5+?",options:[{l:"A",t:"Generates a Terraform plan and outputs it to a configuration file"},{l:"B",t:"Generates HCL configuration for resources defined in import blocks"},{l:"C",t:"Creates a configuration template from existing state"},{l:"D",t:"Outputs the plan as a configuration-compatible format"}],correct:"B",exp:"<code>terraform plan -generate-config-out=file.tf</code> generates <strong>HCL configuration for resources in import blocks</strong> that don't yet have config written. This dramatically simplifies importing existing infrastructure by auto-generating the resource blocks."},
{domain:"State",text:"What is lineage in Terraform state?",options:[{l:"A",t:"The order in which resources were created"},{l:"B",t:"A unique UUID assigned to a state file that persists across updates, identifying the state's history"},{l:"C",t:"A chain of module calls from root to leaf"},{l:"D",t:"The dependency chain between resources"}],correct:"B",exp:"<strong>Lineage</strong> is a unique UUID embedded in the state file that identifies a particular state's history. If lineage changes, it indicates the state was replaced entirely. Terraform uses lineage to detect unauthorized state replacements."},
{domain:"State",text:"When Terraform shows a resource as 'tainted' in state, what does that mean?",options:[{l:"A",t:"The resource has been modified outside Terraform"},{l:"B",t:"The resource creation failed after partial initialization; Terraform will destroy and recreate it on next apply"},{l:"C",t:"The resource has a security vulnerability"},{l:"D",t:"The resource is scheduled for deletion on the next apply"}],correct:"B",exp:"A <strong>tainted resource</strong> is one where creation failed mid-way, leaving it in an incomplete state. Terraform marks it tainted so the next apply destroys it and creates a fresh instance. You can also manually taint with <code>terraform taint</code>."},

// Backends (4)
{domain:"Backends",text:"What is the benefit of using HCP Terraform as a backend over a plain S3 backend?",options:[{l:"A",t:"HCP Terraform is cheaper than S3"},{l:"B",t:"HCP Terraform provides native locking, remote runs, audit logs, and team access controls without extra setup"},{l:"C",t:"HCP Terraform stores state in a more secure format"},{l:"D",t:"HCP Terraform supports more resource types"}],correct:"B",exp:"HCP Terraform as a backend provides <strong>built-in locking, remote execution, detailed audit logs, team permissions, policy enforcement, and VCS integration</strong> — all without configuring DynamoDB, IAM policies, etc. separately."},
{domain:"Backends",text:"What is the http backend in Terraform?",options:[{l:"A",t:"A backend that stores state as HTTP cookies"},{l:"B",t:"A generic backend that stores state via any HTTP API that implements the required endpoints"},{l:"C",t:"A backend for managing HTTP server infrastructure"},{l:"D",t:"A REST API backend for reading cloud provider resources"}],correct:"B",exp:"The <strong>http backend</strong> is generic: it stores state on any HTTP server implementing Terraform's state API endpoints (GET, POST, DELETE, LOCK, UNLOCK). GitLab's Terraform state backend uses this protocol."},
{domain:"Backends",text:"What is the consul backend in Terraform?",options:[{l:"A",t:"A backend that uses HashiCorp Consul's key-value store for state storage"},{l:"B",t:"A backend for managing Consul service discovery configurations"},{l:"C",t:"A backend that stores state in Consul's secrets engine"},{l:"D",t:"A monitoring backend that tracks state changes in Consul"}],correct:"A",exp:"The <strong>consul backend</strong> uses <strong>HashiCorp Consul's key-value store</strong> to store Terraform state. Consul also provides state locking. This is useful in HashiCorp-stack environments already running Consul."},
{domain:"Backends",text:"Which command would you run to see the current backend configuration?",options:[{l:"A",t:"terraform backend show"},{l:"B",t:"terraform state backend"},{l:"C",t:"terraform init (shows backend info during initialization)"},{l:"D",t:"cat .terraform/terraform.tfstate"}],correct:"C",exp:"<code>terraform init</code> <strong>displays backend configuration</strong> during initialization. The backend details are also stored in <code>.terraform/terraform.tfstate</code> (a different file from your resource state). There is no <code>terraform backend show</code> command."},

// Configuration (8)
{domain:"Configuration",text:"What is the heredoc syntax in Terraform HCL used for?",options:[{l:"A",t:"Importing multi-line configuration from external files"},{l:"B",t:"Defining multi-line strings without escape characters"},{l:"C",t:"Defining multi-line comments"},{l:"D",t:"Creating multi-line lists"}],correct:"B",exp:"Heredoc syntax (<code>&lt;&lt;-EOT...EOT</code>) creates <strong>multi-line strings</strong> in HCL without needing escape sequences. The <code>-</code> variant strips leading whitespace. Useful for user_data scripts, policy documents, etc."},
{domain:"Configuration",text:"What does the sensitive() function do in Terraform expressions?",options:[{l:"A",t:"Marks a value as encrypted"},{l:"B",t:"Marks a value as sensitive so it's redacted from CLI output even when used in non-sensitive contexts"},{l:"C",t:"Stores a value in HashiCorp Vault"},{l:"D",t:"Prevents a value from being stored in state"}],correct:"B",exp:"The <code>sensitive()</code> function marks a value as <strong>sensitive in CLI output</strong>, redacting it. If a sensitive variable is used in a computation, the result may lose sensitivity marking — <code>sensitive()</code> re-applies it."},
{domain:"Configuration",text:"What is the purpose of variable type constraints in Terraform?",options:[{l:"A",t:"They speed up Terraform plan by pre-validating values"},{l:"B",t:"They ensure callers provide values of the correct type, with meaningful error messages on mismatch"},{l:"C",t:"They are required for all variables; Terraform errors without them"},{l:"D",t:"They prevent sensitive values from being logged"}],correct:"B",exp:"Type constraints <strong>validate input types and provide meaningful errors</strong>. Without them, Terraform accepts any value and may produce confusing errors deep in the configuration. They are optional but strongly recommended for module interfaces."},
{domain:"Configuration",text:"What is the difference between locals and variables in Terraform?",options:[{l:"A",t:"Locals are set by the user; variables are computed"},{l:"B",t:"Variables are inputs from outside the module; locals are internal computed values within the module"},{l:"C",t:"Locals support all types; variables only support strings"},{l:"D",t:"Variables are faster to evaluate than locals"}],correct:"B",exp:"<strong>Variables</strong> (<code>var.</code>) are <em>inputs</em> provided by module callers or CLI. <strong>Locals</strong> (<code>local.</code>) are <em>computed internally</em> within the module — not settable from outside. Use locals to simplify expressions and avoid repetition."},
{domain:"Configuration",text:"What is a tuple type in Terraform?",options:[{l:"A",t:"An ordered sequence where each element can have a different type"},{l:"B",t:"A list where all elements must have the same type"},{l:"C",t:"A map with numeric keys"},{l:"D",t:"A set with exactly two elements"}],correct:"A",exp:"A <strong>tuple</strong> is an ordered sequence where <strong>each position has a specific type</strong>: <code>tuple([string, number, bool])</code>. Unlike lists (same type for all elements), tuples allow heterogeneous types. They are structurally typed."},
{domain:"Configuration",text:"What does the ~ symbol mean in Terraform plan output next to a resource attribute?",options:[{l:"A",t:"The attribute will be deleted"},{l:"B",t:"The attribute will be updated in-place"},{l:"C",t:"The attribute's value is unknown until apply"},{l:"D",t:"The attribute is sensitive"}],correct:"B",exp:"In plan output, <code>~</code> (tilde) before an attribute means it will be <strong>updated in-place</strong>. <code>+</code> means added, <code>-</code> means removed, <code>-/+</code> means resource replacement. The <code>~</code> at resource level means the resource is modified."},
{domain:"Configuration",text:"How do you create a map of objects in Terraform using a variable?",options:[{l:"A",t:'variable "instances" { type = map(object({ size = string, ami = string })) }'},{l:"B",t:'variable "instances" { type = dict({ size = string, ami = string }) }'},{l:"C",t:'variable "instances" { type = map({ size = string }) }'},{l:"D",t:'variable "instances" { type = hash(object) }'}],correct:"A",exp:"A map of objects is declared as <code>map(object({...}))</code> where the object defines the schema for each map value. This is a common pattern for defining multiple similar infrastructure components with different configurations."},
{domain:"Configuration",text:"What is the moved block in Terraform used for?",options:[{l:"A",t:"Moving resources between cloud regions"},{l:"B",t:"Declaring that a resource has been renamed or moved in configuration, updating state without destroying/recreating"},{l:"C",t:"Moving files between directories during apply"},{l:"D",t:"Migrating workspaces between backends"}],correct:"B",exp:"The <code>moved</code> block (Terraform 1.1+) lets you declare <strong>resource renames or moves within configuration</strong>. Terraform updates state references without destroying/recreating resources — cleaner than <code>terraform state mv</code> for version-controlled changes."},

// Meta-Arguments (5)
{domain:"Meta-Arguments",text:"What is the for_each meta-argument's behavior when passed an empty map or set?",options:[{l:"A",t:"Terraform errors because for_each requires at least one element"},{l:"B",t:"No instances of the resource are created"},{l:"C",t:"Terraform creates one instance with null values"},{l:"D",t:"Terraform uses the default count of 1"}],correct:"B",exp:"When <code>for_each</code> receives an <strong>empty map or set</strong>, Terraform creates <strong>zero instances</strong> of the resource. This is valid and useful — infrastructure scales to zero gracefully without conditional logic."},
{domain:"Meta-Arguments",text:"Which meta-argument must be used at the module level (not resource level)?",options:[{l:"A",t:"lifecycle"},{l:"B",t:"depends_on (when used with modules)"},{l:"C",t:"providers"},{l:"D",t:"count"}],correct:"C",exp:"The <code>providers</code> meta-argument is specified at the <strong>module block level</strong> to pass provider configurations to child modules (especially aliased providers). While <code>depends_on</code> and <code>count</code>/<code>for_each</code> work at both levels, <code>providers</code> is module-specific."},
{domain:"Meta-Arguments",text:"What limitation exists when using count with modules?",options:[{l:"A",t:"count cannot be used with modules; use for_each instead"},{l:"B",t:"count creates instances but they all share the same outputs"},{l:"C",t:"count with modules requires all instances to have the same variable values"},{l:"D",t:"count and for_each work identically with modules and resources"}],correct:"D",exp:"<strong>Both count and for_each work with modules</strong>, just as they do with resources. Module instances created with count are accessed via index, and for_each instances via key. Outputs of each instance are accessed per-instance."},
{domain:"Meta-Arguments",text:"How does Terraform handle the lifecycle argument create_before_destroy when there are dependencies?",options:[{l:"A",t:"It only applies to the resource with the lifecycle setting"},{l:"B",t:"It propagates to all resources that depend on the resource with create_before_destroy"},{l:"C",t:"It has no effect on dependent resources"},{l:"D",t:"Dependent resources must also explicitly set create_before_destroy"}],correct:"B",exp:"<code>create_before_destroy</code> <strong>propagates to dependencies</strong>: if resource A has create_before_destroy and resource B depends on A, B also gets create_before_destroy behavior. This ensures the whole dependency chain replaces correctly."},
{domain:"Meta-Arguments",text:"What does the ignore_changes = all setting in a lifecycle block do?",options:[{l:"A",t:"Ignores all errors during resource operations"},{l:"B",t:"Tells Terraform to never update the resource, regardless of any configuration changes"},{l:"C",t:"Ignores all changes made to the resource outside Terraform"},{l:"D",t:"Skips the resource during all plan operations"}],correct:"B",exp:"<code>ignore_changes = all</code> tells Terraform to <strong>never propose updates</strong> to the resource after initial creation, regardless of configuration or infrastructure changes. Useful for resources managed by other processes (e.g., auto-scaling managed instances)."},

// Modules (5)
{domain:"Modules",text:"What is a no-code module in HCP Terraform?",options:[{l:"A",t:"A module with no input variables"},{l:"B",t:"A feature allowing non-technical users to provision infrastructure via a GUI without writing any HCL"},{l:"C",t:"A module that runs without any provider configuration"},{l:"D",t:"A module with only data sources and no resources"}],correct:"B",exp:"<strong>No-code modules</strong> in HCP Terraform allow <strong>non-technical users to provision infrastructure</strong> through a self-service GUI by filling in form fields, without writing any Terraform code. Useful for enabling developer self-service."},
{domain:"Modules",text:"What is module versioning locked by in a Terraform Registry workflow?",options:[{l:"A",t:"The .terraform.lock.hcl file"},{l:"B",t:"The version argument in the module call and optionally the lock file"},{l:"C",t:"The module's own version.tf file"},{l:"D",t:"Git tags in the module's source repository"}],correct:"B",exp:"Registry module versions are pinned by the <code>version</code> argument in the module call. The lock file records the resolved version, ensuring consistent installs. For Git sources, use <code>?ref=</code> in the source URL."},
{domain:"Modules",text:"How do you pass a sensitive value to a child module?",options:[{l:"A",t:"Mark the module block as sensitive = true"},{l:"B",t:"Pass it like any other variable; if the child declares it sensitive, output will be redacted"},{l:"C",t:"Use a secure_variable block instead of variable"},{l:"D",t:"Store it in a separate .tfvars.secret file"}],correct:"B",exp:"Sensitive values are passed as <strong>normal variable arguments</strong>. Mark the child module's variable as <code>sensitive = true</code> (Terraform 0.14+) to ensure the value is redacted from CLI output throughout. There is no <code>secure_variable</code> block."},
{domain:"Modules",text:"What is the purpose of the module registry in HCP Terraform?",options:[{l:"A",t:"A backup storage for module source code"},{l:"B",t:"A private module registry for sharing versioned, organization-internal modules"},{l:"C",t:"A public module catalog exclusive to HCP Terraform subscribers"},{l:"D",t:"A module caching layer that speeds up terraform init"}],correct:"B",exp:"HCP Terraform's <strong>private module registry</strong> lets organizations publish and version their internal modules, making them discoverable and usable by all teams within the organization — enabling standardized, governed infrastructure patterns."},
{domain:"Modules",text:"What pattern do well-structured Terraform modules typically follow for file organization?",options:[{l:"A",t:"One .tf file per resource type"},{l:"B",t:"main.tf for resources, variables.tf for inputs, outputs.tf for outputs, and versions.tf for provider requirements"},{l:"C",t:"A single all-in-one module.tf file"},{l:"D",t:"Separate directories for each resource"}],correct:"B",exp:"The conventional module structure uses: <strong>main.tf</strong> (resources), <strong>variables.tf</strong> (input variables), <strong>outputs.tf</strong> (outputs), and <strong>versions.tf</strong> (required providers/Terraform version). This makes modules predictable and easy to navigate."},

// CLI (5)
{domain:"CLI",text:"What does the TF_VAR_ prefix on an environment variable do?",options:[{l:"A",t:"Marks the variable as a Terraform-internal system variable"},{l:"B",t:"Sets the corresponding Terraform input variable value from the environment"},{l:"C",t:"Encrypts the variable value before passing it to Terraform"},{l:"D",t:"Overrides the provider configuration for that variable"}],correct:"B",exp:"Environment variables prefixed with <code>TF_VAR_</code> set Terraform <strong>input variable values</strong>. <code>TF_VAR_region=us-east-1</code> sets the <code>var.region</code> variable. Case matters: the variable name must match exactly after the prefix."},
{domain:"CLI",text:"What is the terraform init -backend=false flag used for?",options:[{l:"A",t:"Initializes Terraform without configuring any backend, useful for module-only initialization"},{l:"B",t:"Disables the backend permanently"},{l:"C",t:"Initializes without downloading providers"},{l:"D",t:"Forces initialization to use local backend"}],correct:"A",exp:"<code>terraform init -backend=false</code> initializes providers and modules <strong>without configuring the backend</strong>. Useful when working with modules in isolation, or when you want to validate configuration without backend access."},
{domain:"CLI",text:"What does the -detailed-exitcode flag do for terraform plan?",options:[{l:"A",t:"Provides more detailed human-readable output"},{l:"B",t:"Returns exit code 2 if there are planned changes, 0 if no changes, 1 if error — enabling scripted decision making"},{l:"C",t:"Logs detailed provider API calls"},{l:"D",t:"Shows detailed cost estimates"}],correct:"B",exp:"<code>-detailed-exitcode</code> enables <strong>exit code-based decision making in scripts</strong>: 0=success/no changes, 1=error, 2=success/changes pending. CI pipelines use this to conditionally trigger apply or notifications."},
{domain:"CLI",text:"What does terraform workspace show display?",options:[{l:"A",t:"Details about the current workspace configuration"},{l:"B",t:"The name of the currently selected workspace"},{l:"C",t:"All workspace settings and variables"},{l:"D",t:"The workspace creation date and state size"}],correct:"B",exp:"<code>terraform workspace show</code> simply outputs the <strong>name of the currently active workspace</strong>. Equivalent to checking <code>terraform.workspace</code> from within configuration, but available as a CLI command."},
{domain:"CLI",text:"What is the purpose of running terraform fmt -check?",options:[{l:"A",t:"Checks syntax validity of the configuration"},{l:"B",t:"Returns a non-zero exit code if any files are not properly formatted, without modifying them"},{l:"C",t:"Checks for security vulnerabilities in the configuration"},{l:"D",t:"Verifies that all referenced modules are properly formatted"}],correct:"B",exp:"<code>terraform fmt -check</code> <strong>verifies formatting without modifying files</strong>. It returns exit code 1 if files need formatting. Used in CI pipelines to enforce code style — failing the pipeline if unformatted code is pushed."},

// Data Sources (2)
{domain:"Data Sources",text:"Can a data source reference a resource attribute that doesn't exist until apply time?",options:[{l:"A",t:"Yes, data sources always resolve at plan time regardless of dependencies"},{l:"B",t:"No, if a data source's query depends on an unknown value, it must wait until apply time to resolve"},{l:"C",t:"Data sources cannot reference resources at all"},{l:"D",t:"Yes, Terraform automatically substitutes placeholder values during plan"}],correct:"B",exp:"If a data source's filter criteria depend on an attribute that is <strong>unknown until apply time</strong> (e.g., a newly created resource's ID), the data source is deferred to apply time. Terraform will show the result as unknown during plan."},
