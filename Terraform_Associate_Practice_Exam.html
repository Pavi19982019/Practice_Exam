{domain:"Data Sources",text:"What data source allows you to retrieve an AWS account ID without hardcoding it?",options:[{l:"A",t:"aws_account"},{l:"B",t:"aws_caller_identity"},{l:"C",t:"aws_iam_account"},{l:"D",t:"aws_sts_identity"}],correct:"B",exp:"The <code>aws_caller_identity</code> data source returns the <strong>AWS account ID, ARN, and user ID</strong> of the caller. Use <code>data.aws_caller_identity.current.account_id</code> to dynamically reference the account ID without hardcoding."},

// Functions (4)
{domain:"Functions",text:"What does the try() function do in Terraform?",options:[{l:"A",t:"Attempts to create a resource and falls back to a default on error"},{l:"B",t:"Evaluates expressions in order and returns the first one that doesn't produce an error"},{l:"C",t:"Tries to connect to the provider and retries on failure"},{l:"D",t:"Attempts to read a variable and returns null if not set"}],correct:"B",exp:"<code>try(expr1, expr2, ...)</code> evaluates expressions in order and returns the <strong>first one that succeeds without error</strong>. Useful for handling optional attributes: <code>try(var.config.optional_key, \"default\")</code>."},
{domain:"Functions",text:"What does the base64encode() function do in Terraform?",options:[{l:"A",t:"Encodes a file path as Base64"},{l:"B",t:"Encodes a string to Base64 format, commonly used for user_data in EC2 instances"},{l:"C",t:"Encodes provider credentials to Base64"},{l:"D",t:"Converts a binary file to Base64 for storage in state"}],correct:"B",exp:"<code>base64encode(string)</code> encodes a <strong>string to Base64</strong>. Commonly used for EC2 user_data (though the AWS provider handles this automatically for some arguments) or any API requiring Base64-encoded input."},
{domain:"Functions",text:"What does the compact() function do in Terraform?",options:[{l:"A",t:"Compresses a list into a smaller format"},{l:"B",t:"Removes null and empty string elements from a list"},{l:"C",t:"Compresses nested maps into flat maps"},{l:"D",t:"Returns only unique elements from a list"}],correct:"B",exp:"<code>compact(list)</code> removes <strong>null and empty string</strong> values from a list, returning only non-empty elements. Useful for cleaning up lists that may contain optional null values before passing to resources."},
{domain:"Functions",text:"What does the abs() function do in Terraform?",options:[{l:"A",t:"Returns the abstract type of a value"},{l:"B",t:"Returns the absolute value of a number (removes negative sign)"},{l:"C",t:"Returns the abbreviated string representation"},{l:"D",t:"Converts a relative path to an absolute path"}],correct:"B",exp:"<code>abs(number)</code> returns the <strong>absolute (non-negative) value</strong> of a number. Example: <code>abs(-5)</code> returns <code>5</code>. This is a standard mathematical function available in Terraform's function library."},

// Workspaces (2)
{domain:"Workspaces",text:"When using Terraform workspaces with S3 backend, how are different workspace state files stored?",options:[{l:"A",t:"Each workspace gets its own S3 bucket"},{l:"B",t:"States are stored in a workspace_name/terraform.tfstate path structure within the same bucket"},{l:"C",t:"All workspaces share the same state file with workspace-specific prefixes"},{l:"D",t:"Workspace states are stored in separate DynamoDB tables"}],correct:"B",exp:"With S3 backend and workspaces, state files are stored at <code>env:/workspace_name/key</code> paths (non-default workspaces). The default workspace uses the configured <code>key</code> directly. All share the same bucket."},
{domain:"Workspaces",text:"What is a limitation of using Terraform CLI workspaces for environment isolation?",options:[{l:"A",t:"CLI workspaces don't support remote backends"},{l:"B",t:"All workspaces share the same configuration, making significant environment differences complex"},{l:"C",t:"You cannot have more than 10 workspaces"},{l:"D",t:"CLI workspaces cannot use different provider configurations"}],correct:"B",exp:"CLI workspaces use the <strong>same configuration code</strong>, making them suitable for minor variations (like resource counts). For environments with significantly different configurations, separate directories or repos (with different backends/configs) provide better isolation."},

// Provisioners (2)
{domain:"Provisioners",text:"What is a creation-time provisioner in Terraform?",options:[{l:"A",t:"A provisioner that only runs during the first apply"},{l:"B",t:"The default provisioner that runs when a resource is created (when = create)"},{l:"C",t:"A provisioner that creates new files on the resource"},{l:"D",t:"A provisioner that runs on all apply operations"}],correct:"B",exp:"By default, provisioners run at creation time (<code>when = create</code> is the default). This means they execute when the resource is first created. Destroy-time provisioners require explicitly setting <code>when = destroy</code>."},
{domain:"Provisioners",text:"What is the file provisioner in Terraform used for?",options:[{l:"A",t:"Creates files using the local-exec provisioner"},{l:"B",t:"Copies files or directories from the Terraform machine to the created resource via SSH or WinRM"},{l:"C",t:"Downloads files from cloud storage to the Terraform host"},{l:"D",t:"Creates file resources in the cloud provider"}],correct:"B",exp:"The <code>file</code> provisioner <strong>copies files or directories</strong> from the local Terraform machine to the remote resource using SSH or WinRM. It requires a <code>connection</code> block. It's often followed by a remote-exec to use the uploaded files."},

// HCP Terraform (3)
{domain:"HCP Terraform",text:"What are Terraform Enterprise (TFE) and HCP Terraform (TFC) different in?",options:[{l:"A",t:"TFE supports more providers than TFC"},{l:"B",t:"TFE is self-hosted for organizations needing data sovereignty; TFC is the SaaS version"},{l:"C",t:"TFC is free while TFE requires a paid license in all cases"},{l:"D",t:"TFE uses Sentinel; TFC uses OPA for policies"}],correct:"B",exp:"<strong>Terraform Enterprise (TFE)</strong> is a <strong>self-hosted</strong> product for organizations with strict data residency, compliance, or network isolation requirements. <strong>HCP Terraform (TFC)</strong> is the SaaS version managed by HashiCorp."},
{domain:"HCP Terraform",text:"How does HCP Terraform handle secrets and sensitive variables?",options:[{l:"A",t:"Secrets are stored in HashiCorp Vault automatically"},{l:"B",t:"Sensitive variables are marked as sensitive, stored encrypted, and write-only (cannot be read back after setting)"},{l:"C",t:"Variables are encrypted only during transit"},{l:"D",t:"HCP Terraform does not support storing sensitive values"}],correct:"B",exp:"In HCP Terraform, variables marked as sensitive are <strong>stored encrypted and write-only</strong> — once set, the value cannot be read back through the UI or API. This prevents secret exposure while allowing Terraform runs to use them."},
{domain:"HCP Terraform",text:"What is the agent pool feature in HCP Terraform?",options:[{l:"A",t:"A group of HCP Terraform users with shared workspace access"},{l:"B",t:"Private agents deployed in your network that execute Terraform runs for accessing private resources"},{l:"C",t:"A load balancer pool distributing Terraform API requests"},{l:"D",t:"A pool of pre-approved Terraform plan outputs"}],correct:"B",exp:"<strong>HCP Terraform Agents</strong> are lightweight processes deployed in your private network. They poll HCP Terraform for runs and execute them locally, enabling Terraform to <strong>access private resources</strong> (VPCs, on-prem systems) that HCP's servers can't reach."},

// Import (1)
{domain:"Import",text:"What is the ID argument in terraform import used for?",options:[{l:"A",t:"The Terraform resource address"},{l:"B",t:"The cloud provider's resource identifier (e.g., instance ID, ARN) used to look up the resource"},{l:"C",t:"The local name you want to assign to the resource"},{l:"D",t:"The state file path where the import should be stored"}],correct:"B",exp:"The ID in <code>terraform import resource_address cloud_id</code> is the <strong>provider-specific resource identifier</strong> (e.g., <code>i-1234567890abcdef0</code> for AWS EC2). Each resource type documents what format its import ID should be."},

// Concepts (2)
{domain:"Concepts",text:"What is the difference between terraform.tfvars and *.auto.tfvars?",options:[{l:"A",t:"terraform.tfvars is for secrets; auto.tfvars is for non-sensitive values"},{l:"B",t:"Both are automatically loaded; terraform.tfvars is a fixed name, *.auto.tfvars matches any file with that suffix"},{l:"C",t:"*.auto.tfvars takes precedence over terraform.tfvars"},{l:"D",t:"They are identical in all respects"}],correct:"B",exp:"Both <code>terraform.tfvars</code> and any <code>*.auto.tfvars</code> files are <strong>automatically loaded</strong>. The fixed-name file and all <code>.auto.tfvars</code> files are processed in alphabetical order. Neither takes precedence over the other by file type."},
{domain:"Concepts",text:"What is the difference between hard-coded values and variables in Terraform best practices?",options:[{l:"A",t:"Hard-coded values are faster; variables add overhead"},{l:"B",t:"Variables make configurations reusable and flexible; hard-coded values tightly couple config to specific environments"},{l:"C",t:"Hard-coded values are more secure than variables"},{l:"D",t:"They are equivalent in terms of maintainability"}],correct:"B",exp:"Using <strong>variables</strong> makes modules reusable across environments and organizations. Hard-coded values tightly couple configurations to specific contexts (a specific account ID, region, etc.), reducing reusability and requiring modification for each use."}
];
// SET 5 - 67 questions
const set5 = [
// IaC Concepts (3)
{domain:"IaC Concepts",text:"What does 'version control' provide in an IaC workflow that manual processes cannot?",options:[{l:"A",t:"Faster infrastructure provisioning"},{l:"B",t:"Complete audit trail, rollback capability, and collaborative review of every infrastructure change"},{l:"C",t:"Automatic infrastructure testing"},{l:"D",t:"Lower cloud costs"}],correct:"B",exp:"Version control provides an <strong>audit trail of every change</strong> (who changed what, when, why), the ability to <strong>roll back</strong> to previous states, and <strong>pull request workflows</strong> for reviewing infrastructure changes before they're applied."},
{domain:"IaC Concepts",text:"What is the main advantage of using Terraform over shell scripts for infrastructure provisioning?",options:[{l:"A",t:"Terraform scripts run faster than shell scripts"},{l:"B",t:"Terraform is declarative and manages state, enabling idempotent operations and drift detection"},{l:"C",t:"Shell scripts cannot create cloud resources"},{l:"D",t:"Terraform uses a compiled language that's more reliable"}],correct:"B",exp:"Terraform's <strong>declarative, state-driven approach</strong> enables idempotency (re-running is safe), drift detection, and dependency management. Shell scripts are imperative — running them multiple times can create duplicate resources or fail unpredictably."},
{domain:"IaC Concepts",text:"What does 'self-documenting infrastructure' mean in the context of IaC?",options:[{l:"A",t:"IaC tools automatically generate documentation"},{l:"B",t:"Configuration files serve as living documentation of the infrastructure, readable and versioned alongside code"},{l:"C",t:"Infrastructure that monitors its own health"},{l:"D",t:"Cloud providers document IaC-managed resources automatically"}],correct:"B",exp:"With IaC, configuration files <strong>serve as documentation</strong> — they describe exactly what exists, how it's configured, and the relationships between components. Combined with version history, they provide context that manual runbooks cannot."},

// Terraform Purpose (2)
{domain:"Terraform Purpose",text:"What is the terraform.io website's primary resource for Terraform users?",options:[{l:"A",t:"A forum for Terraform community support"},{l:"B",t:"Provider documentation, module registry, and Terraform learning resources"},{l:"C",t:"The source code repository for Terraform"},{l:"D",t:"A marketplace for buying Terraform consulting services"}],correct:"B",exp:"<strong>registry.terraform.io</strong> (linked from terraform.io) hosts the <strong>provider documentation, public module registry</strong>, and policy library. It's the primary reference for understanding provider resources, arguments, and attributes."},
{domain:"Terraform Purpose",text:"What type of infrastructure object can Terraform manage beyond cloud resources?",options:[{l:"A",t:"Only compute, storage, and networking resources"},{l:"B",t:"Any infrastructure with a provider: DNS, monitoring, SaaS applications, databases, Kubernetes resources"},{l:"C",t:"Only resources provided by AWS, Azure, and GCP"},{l:"D",t:"Only resources with REST APIs"}],correct:"B",exp:"Terraform's provider ecosystem covers <strong>thousands of services</strong>: DNS (Cloudflare), monitoring (Datadog, PagerDuty), SaaS (GitHub, Okta), databases, Kubernetes, and more. Any service with a programmable API can have a Terraform provider."},

// Terraform Basics (6)
{domain:"Terraform Basics",text:"What is the result of running terraform plan when configuration and infrastructure are in sync?",options:[{l:"A",t:"Terraform shows an error asking you to run refresh first"},{l:"B",t:"Terraform shows 'No changes. Your infrastructure matches the configuration.'"},{l:"C",t:"Terraform applies a no-op to verify synchronization"},{l:"D",t:"Terraform creates a new state file version"}],correct:"B",exp:"When configuration matches current state, Terraform outputs <strong>'No changes. Your infrastructure matches the configuration.'</strong> This is the desired steady state — your actual infrastructure matches what's defined in code."},
{domain:"Terraform Basics",text:"What is the terraform.required_providers block's source attribute format?",options:[{l:"A",t:"provider_name only (e.g., aws)"},{l:"B",t:"namespace/provider (e.g., hashicorp/aws) or hostname/namespace/provider for custom registries"},{l:"C",t:"URL to the provider binary"},{l:"D",t:"provider_name/version (e.g., aws/4.0)"}],correct:"B",exp:"The source format is <code>namespace/type</code> (shorthand for registry.terraform.io) or <code>hostname/namespace/type</code> for custom registries. Example: <code>hashicorp/aws</code> or <code>app.terraform.io/myorg/aws</code>."},
{domain:"Terraform Basics",text:"How does Terraform handle circular dependencies between resources?",options:[{l:"A",t:"Terraform resolves circular dependencies automatically"},{l:"B",t:"Terraform raises an error: 'Cycle detected' and refuses to plan or apply"},{l:"C",t:"Terraform creates resources simultaneously to resolve the cycle"},{l:"D",t:"Terraform uses depends_on to break circular dependencies"}],correct:"B",exp:"Terraform <strong>does not allow circular dependencies</strong> and raises a <strong>'Cycle detected'</strong> error during plan. You must redesign your configuration to break the cycle, often by introducing an intermediate resource or using data sources differently."},
{domain:"Terraform Basics",text:"What is the purpose of resource meta-arguments vs resource arguments?",options:[{l:"A",t:"Meta-arguments are provider-specific; resource arguments are universal"},{l:"B",t:"Resource arguments are provider-specific configuration; meta-arguments are Terraform-level behaviors applicable to all resources"},{l:"C",t:"Meta-arguments configure the Terraform CLI; resource arguments configure providers"},{l:"D",t:"They are different names for the same concept"}],correct:"B",exp:"<strong>Resource arguments</strong> are provider-specific (like <code>ami</code> for aws_instance). <strong>Meta-arguments</strong> (count, for_each, depends_on, lifecycle, provider) are Terraform-level behaviors available for all resources regardless of provider."},
{domain:"Terraform Basics",text:"What is the significance of the + symbol in terraform plan output?",options:[{l:"A",t:"The resource attribute value will increase"},{l:"B",t:"The resource or attribute will be added (created)"},{l:"C",t:"The resource is being added to a count"},{l:"D",t:"A positive change in cost"}],correct:"B",exp:"In plan output, <code>+</code> (green) means the resource or attribute will be <strong>created/added</strong>. <code>-</code> (red) means deletion, <code>~</code> (yellow) means in-place update, and <code>-/+</code> means destroy-then-create (replacement)."},
{domain:"Terraform Basics",text:"How do you pass multiple variable files to terraform apply?",options:[{l:"A",t:"terraform apply -var-files=[\"file1.tfvars\",\"file2.tfvars\"]"},{l:"B",t:"terraform apply -var-file=file1.tfvars -var-file=file2.tfvars"},{l:"C",t:"terraform apply --vars file1.tfvars,file2.tfvars"},{l:"D",t:"terraform apply -varfiles file1.tfvars file2.tfvars"}],correct:"B",exp:"Multiple var files are passed with <strong>repeated <code>-var-file</code> flags</strong>: <code>-var-file=common.tfvars -var-file=prod.tfvars</code>. Later files override earlier ones on key conflicts. Each flag takes one file path."},

// Providers (5)
{domain:"Providers",text:"What is the significance of the required_providers block in team environments?",options:[{l:"A",t:"It prevents team members from using different cloud accounts"},{l:"B",t:"It ensures all team members and CI systems use providers from the same source and within the same version range"},{l:"C",t:"It requires team member approval before provider installation"},{l:"D",t:"It restricts which team members can modify provider configuration"}],correct:"B",exp:"<code>required_providers</code> ensures <strong>consistent provider sources and version ranges</strong> across all environments. Combined with the lock file, it prevents one team member's environment from using a different provider version than others."},
{domain:"Providers",text:"What happens if you remove a provider from required_providers but still have resources using it?",options:[{l:"A",t:"Terraform automatically finds an alternative provider"},{l:"B",t:"Terraform raises an error because resources reference an undeclared provider"},{l:"C",t:"The provider is uninstalled and resources are removed from state"},{l:"D",t:"Terraform infers the provider from the resource type prefix"}],correct:"D",exp:"For built-in providers and resources with clear type prefixes (like <code>aws_instance</code>), Terraform can <strong>implicitly infer the provider</strong>. However, for custom or ambiguous cases, explicit declaration is required. Best practice: always declare providers explicitly."},
{domain:"Providers",text:"Which of the following correctly describes provider version 'pessimistic constraint operator' (~>)?",options:[{l:"A",t:"Allows any version greater than or equal to the specified version"},{l:"B",t:"Allows only the exact version specified"},{l:"C",t:"Allows versions that are compatible (can increment only the rightmost specified component)"},{l:"D",t:"Excludes the specified version and all below it"}],correct:"C",exp:"The <strong>pessimistic constraint operator</strong> <code>~></code> allows only compatible versions — it can increment only the rightmost component. <code>~> 2.3</code> allows >=2.3, <2.99 and <code>~> 2.3.1</code> allows >=2.3.1, <2.4. This balances stability with bug fix updates."},
{domain:"Providers",text:"What is a provider's 'resource type' in Terraform?",options:[{l:"A",t:"The cloud category (compute, storage, networking)"},{l:"B",t:"The specific type of infrastructure object the provider can create, like aws_instance or google_storage_bucket"},{l:"C",t:"The provider's API version"},{l:"D",t:"The Terraform block type (resource vs data)"}],correct:"B",exp:"A <strong>resource type</strong> is a specific kind of infrastructure object defined by a provider: <code>aws_instance</code>, <code>google_storage_bucket</code>, <code>azurerm_virtual_machine</code>. Resource types define what arguments they accept and what attributes they expose."},
{domain:"Providers",text:"What is the difference between provider arguments in the provider block vs in the terraform block?",options:[{l:"A",t:"They are equivalent; you can use either block"},{l:"B",t:"The terraform block declares provider requirements (source, version); the provider block configures provider behavior (region, credentials)"},{l:"C",t:"The provider block is for open-source providers; terraform block is for enterprise providers"},{l:"D",t:"The terraform block runs first; provider block runs during apply only"}],correct:"B",exp:"The <code>terraform</code> block's <code>required_providers</code> declares <strong>what providers are needed and where to get them</strong>. The <code>provider</code> block <strong>configures how to use them</strong> (region, endpoint, credentials). Both are needed for complete provider setup."},

// State (8)
{domain:"State",text:"What does 'state drift' mean and how does Terraform detect it?",options:[{l:"A",t:"State file becoming too large; detected by file size"},{l:"B",t:"Differences between recorded state and actual infrastructure; detected by refreshing state against live provider data during plan"},{l:"C",t:"State file version mismatches; detected by serial number"},{l:"D",t:"Configuration changes that haven't been applied; detected by comparing .tf files to state"}],correct:"B",exp:"<strong>State drift</strong> is when actual infrastructure differs from recorded state (due to manual changes). Terraform detects it by <strong>refreshing state from the provider</strong> during plan — comparing live infrastructure to the config and proposing corrections."},
{domain:"State",text:"What is the output_sensitive flag in the context of Terraform state?",options:[{l:"A",t:"A flag to encrypt all outputs in state"},{l:"B",t:"Sensitive outputs are stored in state but marked so they're redacted in CLI output"},{l:"C",t:"A configuration to send sensitive outputs to Vault"},{l:"D",t:"A flag that prevents sensitive outputs from being stored in state"}],correct:"B",exp:"Outputs marked as <code>sensitive = true</code> are stored in state (in plaintext) but are <strong>redacted from CLI output</strong>. This is why state file security is critical — sensitive values aren't encrypted in the state file, just hidden from terminal output."},
{domain:"State",text:"What is the correct way to rename a Terraform resource without destroying it?",options:[{l:"A",t:"Rename the resource block and run terraform apply"},{l:"B",t:"Use terraform state mv or a moved block before renaming in configuration"},{l:"C",t:"Use the rename meta-argument in the lifecycle block"},{l:"D",t:"Rename it in the state file manually"}],correct:"B",exp:"Renaming without destruction requires either <code>terraform state mv old_address new_address</code> (imperative) or a <code>moved { from = old; to = new }</code> block (declarative, Terraform 1.1+) <em>before</em> renaming in configuration. Otherwise Terraform destroys old and creates new."},
{domain:"State",text:"What is a workspace-specific state file path in the local backend?",options:[{l:"A",t:"terraform.tfstate for all workspaces"},{l:"B",t:"terraform.tfstate.d/<workspace_name>/terraform.tfstate for non-default workspaces"},{l:"C",t:"workspaces/<name>/terraform.tfstate"},{l:"D",t:".terraform/<workspace_name>.tfstate"}],correct:"B",exp:"The local backend stores non-default workspace states in <code>terraform.tfstate.d/&lt;workspace_name&gt;/terraform.tfstate</code>. The default workspace uses <code>terraform.tfstate</code> in the current directory. This is automatically managed by Terraform."},
{domain:"State",text:"How can you view just the IDs of all EC2 instances managed by Terraform?",options:[{l:"A",t:"terraform state list aws_instance"},{l:"B",t:"terraform state show aws_instance"},{l:"C",t:"terraform output -json | jq '.ec2_ids'"},{l:"D",t:"terraform state list | grep aws_instance followed by terraform state show for each"}],correct:"D",exp:"To see specific attributes like IDs, use <code>terraform state list | grep aws_instance</code> to find addresses, then <code>terraform state show &lt;address&gt;</code> to see attributes including the ID. Or use <code>terraform output</code> if you've defined outputs capturing the IDs."},
{domain:"State",text:"What does the -lock=false flag do in terraform apply?",options:[{l:"A",t:"Applies without acquiring a state lock (use only when certain no concurrent operations are running)"},{l:"B",t:"Removes all state locks permanently"},{l:"C",t:"Unlocks all locked resources before applying"},{l:"D",t:"Prevents resources with prevent_destroy from being locked"}],correct:"A",exp:"<code>-lock=false</code> skips acquiring the state lock during apply. This is <strong>dangerous in shared environments</strong> and should only be used when you're certain no other operations are running — typically only for recovery scenarios."},
{domain:"State",text:"What is the purpose of the terraform state pull | terraform state push workflow?",options:[{l:"A",t:"Backs up and restores state files"},{l:"B",t:"Downloads state, modifies it externally (e.g., with jq), and re-uploads the modified state"},{l:"C",t:"Synchronizes state between workspaces"},{l:"D",t:"Migrates state to a different backend"}],correct:"B",exp:"The <code>pull | modify | push</code> workflow downloads state as JSON, allows <strong>external modification</strong> (using jq or other tools), and re-uploads. This is used for advanced state manipulation. The push increments the serial number to prevent conflicts."},
{domain:"State",text:"What is the effect of deleting the terraform.tfstate file locally when using a remote backend?",options:[{l:"A",t:"All managed resources are destroyed"},{l:"B",t:"Nothing, because state is stored in the remote backend, not locally"},{l:"C",t:"Terraform cannot run until the local state is restored"},{l:"D",t:"The next terraform init will re-create the state file locally"}],correct:"B",exp:"When using a <strong>remote backend</strong>, the actual state lives on the remote backend (S3, HCP Terraform, etc.). Deleting local files doesn't affect it. Running <code>terraform init</code> reconnects to the remote backend, and operations work normally."},

// Backends (4)
{domain:"Backends",text:"What is the kubernetes backend in Terraform?",options:[{l:"A",t:"A backend for managing Kubernetes clusters with Terraform"},{l:"B",t:"A backend that stores Terraform state in a Kubernetes Secret or ConfigMap"},{l:"C",t:"A backend that runs Terraform inside a Kubernetes pod"},{l:"D",t:"A backend specific to Helm chart management"}],correct:"B",exp:"The <strong>kubernetes backend</strong> stores Terraform state in a Kubernetes <strong>Secret</strong> within a specified namespace. This allows Kubernetes-native state storage without external dependencies for teams already running Kubernetes."},
{domain:"Backends",text:"What does the workspace_key_prefix setting in the S3 backend do?",options:[{l:"A",t:"Prefixes all S3 object keys with a namespace"},{l:"B",t:"Sets the S3 key prefix for workspace state files (default: 'env:')"},{l:"C",t:"Restricts which workspaces can use this backend"},{l:"D",t:"Adds a prefix to workspace names in HCP Terraform"}],correct:"B",exp:"<code>workspace_key_prefix</code> sets the <strong>S3 path prefix for workspace state files</strong>. Default is <code>env:</code>, so workspace 'staging' state would be at <code>env:/staging/key</code>. This allows customizing how workspace states are organized in S3."},
{domain:"Backends",text:"What is the remote backend (cloud block) in Terraform?",options:[{l:"A",t:"Any backend that stores state remotely"},{l:"B",t:"The specific backend configuration used for HCP Terraform and Terraform Enterprise"},{l:"C",t:"A deprecated backend replaced by individual cloud backends"},{l:"D",t:"A backend that enables multi-cloud state storage"}],correct:"B",exp:"The <code>cloud</code> block (Terraform 1.1+, replacing the older <code>remote</code> backend) is the configuration for <strong>HCP Terraform and Terraform Enterprise</strong>. It enables remote operations, state storage, and team collaboration features."},
{domain:"Backends",text:"What does terraform init do if the backend configuration has changed since the last init?",options:[{l:"A",t:"Silently continues with the old backend"},{l:"B",t:"Detects the configuration change and asks to migrate or re-initialize"},{l:"C",t:"Automatically migrates state without asking"},{l:"D",t:"Errors and requires manual state migration"}],correct:"B",exp:"If backend configuration changes, <code>terraform init</code> <strong>detects the change and prompts</strong> to migrate state to the new backend or re-initialize. You can use <code>-migrate-state</code> or <code>-reconfigure</code> flags to control behavior."},

// Configuration (8)
{domain:"Configuration",text:"What is the purpose of the depends_on within a module block?",options:[{l:"A",t:"Specifies which resources inside the module depend on external resources"},{l:"B",t:"Creates an explicit dependency so the entire module is initialized after the specified dependencies"},{l:"C",t:"Tells the module which provider to use"},{l:"D",t:"Defines module version dependencies"}],correct:"B",exp:"<code>depends_on</code> in a module block creates an explicit dependency so the <strong>entire module is processed after the listed dependencies</strong>. Use when a module depends on side effects of resources it doesn't directly reference."},
{domain:"Configuration",text:"How do you use a for expression to create a map in Terraform?",options:[{l:"A",t:"for k, v in map => k: v"},{l:"B",t:"{for item in list : item.name => item.value}"},{l:"C",t:"map([for item in list : item])"},{l:"D",t:"for_map(list, item.name, item.value)"}],correct:"B",exp:"Map-producing for expressions use the syntax: <code>{ for item in list : key_expr => value_expr }</code>. The curly braces produce a map; square brackets produce a list. The arrow (<code>=></code>) separates key from value."},
{domain:"Configuration",text:"What is the purpose of the check block in Terraform 1.5+?",options:[{l:"A",t:"Validates provider credentials before applying"},{l:"B",t:"Defines assertions about infrastructure state that are checked after apply without failing the operation"},{l:"C",t:"Checks for drift before running plan"},{l:"D",t:"Validates module inputs before initialization"}],correct:"B",exp:"The <code>check</code> block defines <strong>assertions verified after apply</strong>. Unlike precondition/postcondition (which fail the operation), check blocks report warnings without stopping apply. Useful for smoke-testing deployed infrastructure."},
{domain:"Configuration",text:"What is the difference between resource and module outputs in terms of accessibility?",options:[{l:"A",t:"Resource attributes are accessible anywhere; module outputs require explicit declaration"},{l:"B",t:"Module outputs are accessible globally; resource attributes are module-scoped"},{l:"C",t:"They are both accessible in the same way using dot notation"},{l:"D",t:"Resource attributes can only be used in the same file"}],correct:"A",exp:"<strong>Resource attributes</strong> (e.g., <code>aws_instance.web.id</code>) are directly accessible within the same module. <strong>Module outputs</strong> require explicit <code>output</code> blocks to expose values — child module internals are not automatically visible to the parent."},
{domain:"Configuration",text:"What does the setproduct() function return?",options:[{l:"A",t:"The product (multiplication) of numbers in a set"},{l:"B",t:"The Cartesian product of two or more sets/lists, returning all possible combinations"},{l:"C",t:"A set containing only elements present in all input sets"},{l:"D",t:"Merges multiple sets into one"}],correct:"B",exp:"<code>setproduct()</code> computes the <strong>Cartesian product</strong>: every combination of elements from the input sets. Example: <code>setproduct([\"a\",\"b\"],[1,2])</code> returns <code>[[\"a\",1],[\"a\",2],[\"b\",1],[\"b\",2]]</code>. Useful for creating resources across all combinations of options."},
{domain:"Configuration",text:"What happens when you use an unknown value (known after apply) in a for_each expression?",options:[{l:"A",t:"Terraform uses an empty map for the for_each during plan"},{l:"B",t:"Terraform raises an error: for_each cannot use values known only after apply"},{l:"C",t:"Terraform defers the for_each evaluation to apply time"},{l:"D",t:"Terraform substitutes a single-element map"}],correct:"B",exp:"<code>for_each</code> <strong>cannot use values unknown until apply time</strong> — Terraform raises an error because it needs to know all resource instances during the plan phase to build the dependency graph. Use a known value or separate the configuration into two applies."},
{domain:"Configuration",text:"What is the purpose of the ephemeral block type introduced in Terraform 1.10?",options:[{l:"A",t:"Creates temporary resources that are automatically destroyed after apply"},{l:"B",t:"Declares values that exist only during plan/apply and are never stored in state or outputs"},{l:"C",t:"Creates resources in an ephemeral workspace"},{l:"D",t:"Defines resources with a TTL (time-to-live) in the cloud provider"}],correct:"B",exp:"<strong>Ephemeral resources</strong> (Terraform 1.10+) produce values that exist only during the Terraform operation and are <strong>never persisted to state or outputs</strong>. Ideal for short-lived credentials from Vault or cloud secrets managers."},
{domain:"Configuration",text:"How do you write a multi-line comment in Terraform HCL?",options:[{l:"A",t:"// comment for each line"},{l:"B",t:"/* comment spanning multiple lines */"},{l:"C",t:"# comment for each line"},{l:"D",t:"Both B and C; A is also valid for single-line comments"}],correct:"D",exp:"HCL supports <strong>three comment styles</strong>: <code>#</code> (line comment), <code>//</code> (line comment), and <code>/* */</code> (block comment spanning multiple lines). All three are valid; <code>#</code> is the conventional style in Terraform configs."},

// Meta-Arguments (5)
{domain:"Meta-Arguments",text:"What is the difference between for_each and dynamic blocks?",options:[{l:"A",t:"for_each creates multiple resource instances; dynamic blocks create multiple nested blocks within one resource"},{l:"B",t:"dynamic blocks create resources; for_each creates data sources"},{l:"C",t:"for_each works only with maps; dynamic only with lists"},{l:"D",t:"They are interchangeable for all use cases"}],correct:"A",exp:"<code>for_each</code> creates <strong>multiple resource/module instances</strong>. <code>dynamic</code> blocks create <strong>multiple nested configuration blocks</strong> within a single resource (e.g., multiple ingress rules in one security group). Different tools for different needs."},
{domain:"Meta-Arguments",text:"What is the effect of setting count = 0 on a resource?",options:[{l:"A",t:"Terraform errors because count cannot be 0"},{l:"B",t:"No instances are created; if they existed, they are destroyed"},{l:"C",t:"The resource is created but immediately marked for destruction"},{l:"D",t:"Terraform uses the default value of 1"}],correct:"B",exp:"Setting <code>count = 0</code> creates <strong>zero instances</strong> of the resource. If instances previously existed, they are destroyed on the next apply. This pattern is used for conditional resources: <code>count = var.enable ? 1 : 0</code>."},
{domain:"Meta-Arguments",text:"How do you reference a single resource created by for_each in another resource's argument?",options:[{l:"A",t:"resource_type.name[0].attribute"},{l:"B",t:"resource_type.name[\"key\"].attribute"},{l:"C",t:"resource_type.name.each.attribute"},{l:"D",t:"resource_type.name.all.attribute"}],correct:"B",exp:"<code>for_each</code> resources are referenced with their string key in brackets: <code>aws_subnet.private[\"us-east-1a\"].id</code>. This accesses the specific instance for key <code>us-east-1a</code>. Using <code>[*]</code> would return a list of all instances."},
{domain:"Meta-Arguments",text:"What is the purpose of the triggers argument on terraform_data (null_resource)?",options:[{l:"A",t:"Triggers an alert when the resource is modified"},{l:"B",t:"Forces the resource (and its provisioners) to run again when specified values change"},{l:"C",t:"Triggers the creation of dependent resources"},{l:"D",t:"Activates destroy-time provisioners"}],correct:"B",exp:"The <code>triggers_replace</code> (terraform_data) or <code>triggers</code> (null_resource) argument causes the resource to be <strong>replaced when specified values change</strong>, re-running any associated provisioners. Used to trigger side effects on configuration changes."},
{domain:"Meta-Arguments",text:"Can you use both count and for_each on the same resource?",options:[{l:"A",t:"Yes, they can be combined for complex iteration"},{l:"B",t:"No, count and for_each are mutually exclusive on a resource"},{l:"C",t:"Yes, but only when count > 1"},{l:"D",t:"Only in module blocks, not resource blocks"}],correct:"B",exp:"<code>count</code> and <code>for_each</code> are <strong>mutually exclusive</strong> — you cannot use both on the same resource or module. Choose count for numeric repetition with indexed access, or for_each for named instances with stable key-based access."},

// Modules (5)
{domain:"Modules",text:"What is a published module's required file structure on the Terraform Registry?",options:[{l:"A",t:"Only main.tf is required"},{l:"B",t:"main.tf, variables.tf, and outputs.tf must all be present"},{l:"C",t:"The repository name must follow the terraform-<provider>-<module> pattern and have a README"},{l:"D",t:"A module.json metadata file describing the module"}],correct:"C",exp:"For the Terraform Registry, repositories must follow the <code>terraform-&lt;PROVIDER&gt;-&lt;NAME&gt;</code> naming convention. A README is required for documentation. While main.tf, variables.tf, and outputs.tf are best practice, only the naming convention and README are required."},
{domain:"Modules",text:"What is module nesting and what is its practical limit?",options:[{l:"A",t:"Modules calling other modules; no practical limit but deep nesting reduces readability"},{l:"B",t:"Modules calling other modules; Terraform enforces a maximum of 3 levels"},{l:"C",t:"Using the same module twice in a configuration"},{l:"D",t:"Combining multiple module sources in one module block"}],correct:"A",exp:"<strong>Module nesting</strong> (modules calling other modules) is supported with <strong>no hard limit</strong>, but deep nesting (>3-4 levels) reduces maintainability and clarity. Best practice: keep module hierarchies shallow and use composition at the root level."},
{domain:"Modules",text:"What is the purpose of the providers argument in a module call?",options:[{l:"A",t:"Declares which providers the module uses"},{l:"B",t:"Maps parent provider configurations to the provider names expected by the child module"},{l:"C",t:"Restricts which providers the module can access"},{l:"D",t:"Downloads providers needed by the module"}],correct:"B",exp:"The <code>providers</code> argument in a module call <strong>maps parent provider aliases to the module's provider requirements</strong>. Example: <code>providers = { aws = aws.us_east }</code> passes the <code>us_east</code> alias to the module as its default AWS provider."},
{domain:"Modules",text:"How do you reference a nested module's output (two levels deep)?",options:[{l:"A",t:"module.parent.child.output_name"},{l:"B",t:"module.parent.module.child.output_name"},{l:"C",t:"module.child.output_name (same as one level)"},{l:"D",t:"nested_module.parent.child.output_name"}],correct:"B",exp:"Nested module outputs are accessed by chaining module references: <code>module.parent.module.child.output_name</code>. Each module level must explicitly output the value from its child for the parent to access it."},
{domain:"Modules",text:"What is the effect of running terraform init -upgrade for a module?",options:[{l:"A",t:"Upgrades only the Terraform CLI version"},{l:"B",t:"Updates module sources to the latest version allowed by version constraints"},{l:"C",t:"Removes all cached modules and re-downloads them"},{l:"D",t:"Both B and C — updates versions and clears cache"}],correct:"D",exp:"<code>terraform init -upgrade</code> <strong>both</strong> updates provider/module versions to the latest allowed by constraints AND re-downloads module source code. This is how you intentionally pull in newer module versions."},

// CLI (5)
{domain:"CLI",text:"What does the TF_LOG_PATH environment variable do?",options:[{l:"A",t:"Sets the directory for Terraform plan outputs"},{l:"B",t:"Writes Terraform log output to a file instead of stderr"},{l:"C",t:"Configures the path for state file storage"},{l:"D",t:"Sets the log level for provider API calls only"}],correct:"B",exp:"<code>TF_LOG_PATH=/path/to/file</code> redirects <strong>Terraform debug logs to a file</strong> instead of stderr. Must be used with <code>TF_LOG</code> set to a log level. Useful for capturing verbose debug output without cluttering the terminal."},
{domain:"CLI",text:"What is terraform test (Terraform 1.6+) used for?",options:[{l:"A",t:"Tests provider API connectivity"},{l:"B",t:"Runs automated tests against Terraform modules using .tftest.hcl files"},{l:"C",t:"Validates that configuration syntax is correct"},{l:"D",t:"Tests apply against a staging environment before production"}],correct:"B",exp:"<code>terraform test</code> is a built-in testing framework (1.6+) that runs <strong>automated module tests</strong> defined in <code>.tftest.hcl</code> files. Tests can apply configuration, make assertions, and clean up — enabling true unit/integration testing of Terraform modules."},
{domain:"CLI",text:"What does the terraform apply -destroy flag combined with -target do?",options:[{l:"A",t:"Destroys all resources except the targeted one"},{l:"B",t:"Destroys only the targeted resource(s)"},{l:"C",t:"Creates a destroy plan for the entire configuration but applies only the target"},{l:"D",t:"Targets a specific backend for the destroy operation"}],correct:"B",exp:"<code>terraform apply -destroy -target=resource_address</code> <strong>destroys only the specified resource(s)</strong>. This combines targeted operations with destroy mode — useful for removing specific resources without affecting others."},
{domain:"CLI",text:"What does the terraform show -json command output?",options:[{l:"A",t:"The configuration as JSON"},{l:"B",t:"The current state or a saved plan file in machine-readable JSON format"},{l:"C",t:"Provider schemas in JSON"},{l:"D",t:"All resource attributes formatted as JSON"}],correct:"B",exp:"<code>terraform show -json</code> outputs the <strong>current state or a saved plan file in JSON format</strong>. This enables downstream tooling to parse and process Terraform state/plan data programmatically. The plan JSON format is extensively documented."},
{domain:"CLI",text:"What does the -compact-warnings flag do in terraform plan?",options:[{l:"A",t:"Reduces the plan output to only changed resources"},{l:"B",t:"Shows only warning summary headers without the full message body when multiple warnings occur"},{l:"C",t:"Suppresses all warnings from the output"},{l:"D",t:"Compresses the plan file for storage"}],correct:"B",exp:"<code>-compact-warnings</code> shows <strong>only the summary line for repeated warning types</strong> without the full details for each occurrence. Useful when deprecation warnings flood output — you see that they exist without reading every instance."},

// Data Sources (2)
{domain:"Data Sources",text:"How do you filter an AWS data source to find a specific resource?",options:[{l:"A",t:"Using the where argument"},{l:"B",t:"Using filter blocks with name and values, or specific argument matching"},{l:"C",t:"Using a SQL-like WHERE clause"},{l:"D",t:"Using tags_filter argument"}],correct:"B",exp:"AWS data sources use <strong>filter blocks</strong> with <code>name</code> (AWS filter key) and <code>values</code> (list of matching values), or specific arguments like <code>name</code>, <code>id</code>, <code>tags</code>. Example: <code>filter { name = \"state\" values = [\"available\"] }</code>."},
{domain:"Data Sources",text:"What is the external data source in Terraform?",options:[{l:"A",t:"A data source that fetches data from external cloud providers"},{l:"B",t:"A data source that runs an external program and returns its JSON output as data"},{l:"C",t:"A data source for reading external variable files"},{l:"D",t:"A data source provided by external (non-HashiCorp) providers"}],correct:"B",exp:"The <code>external</code> data source runs an <strong>external program</strong> (script, binary) that outputs JSON. Terraform parses the JSON and makes it available as data source attributes. A workaround for functionality not available via native data sources."},

// Functions (4)
{domain:"Functions",text:"What does the one() function do in Terraform?",options:[{l:"A",t:"Returns the first element of a list"},{l:"B",t:"Returns the single element of a list that must have exactly zero or one elements, or null"},{l:"C",t:"Converts a value to a single-item list"},{l:"D",t:"Returns 1 if a condition is true, 0 if false"}],correct:"B",exp:"<code>one(list)</code> returns the <strong>single element of a list with 0 or 1 elements</strong> (null if 0, the element if 1). Errors if the list has 2+ elements. Useful when a data source may or may not return a result: <code>one(data.aws_instance.web.*.id)</code>."},
{domain:"Functions",text:"What is the result of trimspace(\"  hello world  \") in Terraform?",options:[{l:"A",t:"\"hello world\""},{l:"B",t:"\"helloworld\""},{l:"C",t:"\" hello world \""},{l:"D",t:"\"hello world  \""}],correct:"A",exp:"<code>trimspace()</code> removes <strong>leading and trailing whitespace</strong> (spaces, tabs, newlines). Result: <code>\"hello world\"</code>. The internal space is preserved. Use <code>replace()</code> to remove internal spaces."},
{domain:"Functions",text:"What does the element() function do in Terraform?",options:[{l:"A",t:"Returns the element at a specific index, wrapping around if the index exceeds list length"},{l:"B",t:"Returns all elements matching a condition"},{l:"C",t:"Creates a new element in a list"},{l:"D",t:"Returns the last element of a list"}],correct:"A",exp:"<code>element(list, index)</code> returns the element at the specified index, <strong>wrapping around</strong> if the index exceeds the list length (modular arithmetic). This makes it useful for cycling through a fixed list: <code>element([\"a\",\"b\",\"c\"], 4)</code> returns <code>\"b\"</code>."},
{domain:"Functions",text:"What does the can() function do in Terraform?",options:[{l:"A",t:"Checks if a resource can be created given current provider limits"},{l:"B",t:"Evaluates an expression and returns true if it succeeds, false if it produces an error"},{l:"C",t:"Checks if a variable can be of a given type"},{l:"D",t:"Returns whether a provider action is permitted by IAM"}],correct:"B",exp:"<code>can(expression)</code> evaluates an expression and returns <strong>true if it succeeds or false if it errors</strong>. Useful for safe attribute access: <code>can(var.config.optional_key)</code> checks if the key exists without failing. Companion to <code>try()</code>."},

// Workspaces (2)
{domain:"Workspaces",text:"Can you switch workspaces while in the middle of an apply operation?",options:[{l:"A",t:"Yes, workspace switches are immediate and non-destructive"},{l:"B",t:"No, you must wait for the current operation to complete before switching"},{l:"C",t:"Yes, if you use the -force flag"},{l:"D",t:"No, but you can open a new terminal window"}],correct:"B",exp:"You <strong>cannot switch workspaces mid-operation</strong>. Terraform applies a workspace lock during operations. You must wait for the apply to complete (or cancel it) before switching workspaces. This protects against accidental cross-workspace operations."},
{domain:"Workspaces",text:"What is the terraform workspace delete command's behavior on a non-empty workspace?",options:[{l:"A",t:"Destroys all resources then deletes the workspace"},{l:"B",t:"Refuses to delete and requires -force flag or empty state"},{l:"C",t:"Archives the workspace instead of deleting"},{l:"D",t:"Moves resources to the default workspace"}],correct:"B",exp:"<code>terraform workspace delete</code> <strong>refuses to delete a workspace with resources</strong> in state. You must first destroy all resources (<code>terraform destroy</code> in that workspace) or use <code>-force</code> to force deletion (leaves orphaned resources)."},

// Provisioners (2)
{domain:"Provisioners",text:"What is the self object in a provisioner block?",options:[{l:"A",t:"A reference to the Terraform process running the provisioner"},{l:"B",t:"A reference to the resource the provisioner is attached to, allowing access to its attributes"},{l:"C",t:"A reference to the current module's local values"},{l:"D",t:"A reference to the provider configuration"}],correct:"B",exp:"Within a provisioner block, <code>self</code> refers to the <strong>resource the provisioner is attached to</strong>. Example: <code>self.public_ip</code> in a remote-exec provisioner gets the created instance's public IP for the SSH connection."},
{domain:"Provisioners",text:"Why are provisioners considered a 'last resort' in Terraform best practices?",options:[{l:"A",t:"They are too slow for production use"},{l:"B",t:"They break the declarative model, cannot be tracked in state, are hard to debug, and make configurations fragile"},{l:"C",t:"They require additional licensing from HashiCorp"},{l:"D",t:"They only work on Linux systems"}],correct:"B",exp:"Provisioners <strong>break declarative principles</strong>: their success isn't tracked in state (resource is tainted only on failure), they require network access, they can't be planned, and they make configurations harder to test and maintain. Prefer cloud-init, packer, or provider-native features."},

// HCP Terraform (3)
{domain:"HCP Terraform",text:"What is a policy set in HCP Terraform?",options:[{l:"A",t:"A set of IAM policies for Terraform's cloud provider access"},{l:"B",t:"A collection of Sentinel or OPA policies applied to one or more workspaces"},{l:"C",t:"A set of approved Terraform plan outputs"},{l:"D",t:"A group of HCP Terraform variables shared across workspaces"}],correct:"B",exp:"A <strong>policy set</strong> is a collection of <strong>Sentinel or OPA policies</strong> that are applied to specific workspaces or the entire organization. Policy sets are the mechanism for attaching policies to workspaces in HCP Terraform."},
{domain:"HCP Terraform",text:"What are the enforcement levels for Sentinel policies in HCP Terraform?",options:[{l:"A",t:"allow, warn, deny"},{l:"B",t:"advisory, soft-mandatory, hard-mandatory"},{l:"C",t:"info, warning, error, critical"},{l:"D",t:"optional, required, enforced"}],correct:"B",exp:"Sentinel has three enforcement levels: <strong>advisory</strong> (log but don't block), <strong>soft-mandatory</strong> (block but allow override by privileged users), and <strong>hard-mandatory</strong> (always block, cannot be overridden). These allow graduated policy enforcement."},
{domain:"HCP Terraform",text:"What is the HCP Terraform API token used for?",options:[{l:"A",t:"Authenticating with cloud providers like AWS"},{l:"B",t:"Authenticating API calls to HCP Terraform's REST API and CLI operations"},{l:"C",t:"Accessing the Terraform Registry"},{l:"D",t:"Encrypting state files in HCP Terraform"}],correct:"B",exp:"HCP Terraform API tokens authenticate <strong>REST API calls and CLI operations</strong> against HCP Terraform. Three token types exist: user tokens, team tokens, and organization tokens — each with different permission scopes."},

// Import (1)
{domain:"Import",text:"After running terraform import, what must you verify?",options:[{l:"A",t:"Nothing; the import is complete and the configuration is ready"},{l:"B",t:"That the resource block in configuration matches the imported resource's actual attributes to prevent unintended changes on next apply"},{l:"C",t:"That the state file has been pushed to the remote backend"},{l:"D",t:"That the provider version supports the imported resource"}],correct:"B",exp:"After import, run <code>terraform plan</code> to check for differences. The imported state represents the <strong>actual resource</strong>; your configuration block must match it. Any differences will appear as proposed changes — potentially destroying or modifying the imported resource."},

// Concepts (2)
{domain:"Concepts",text:"What is the 'blast radius' consideration in Terraform configuration design?",options:[{l:"A",t:"The number of cloud regions a Terraform config manages"},{l:"B",t:"Limiting the scope of a single Terraform configuration to reduce the potential impact of mistakes"},{l:"C",t:"The number of resources Terraform can manage in parallel"},{l:"D",t:"The maximum size of a Terraform state file"}],correct:"B",exp:"<strong>Blast radius</strong> refers to how much infrastructure could be affected if a Terraform operation goes wrong. Best practice: split configurations into smaller scopes (separate state for networking vs. compute vs. applications) to limit potential damage from errors."},
{domain:"Concepts",text:"What is the purpose of the terraform_remote_state data source's outputs attribute?",options:[{l:"A",t:"Lists all available remote states"},{l:"B",t:"Exposes the outputs of the referenced remote state, enabling cross-configuration data sharing"},{l:"C",t:"Stores outputs from the current config in the remote state"},{l:"D",t:"Filters which outputs are exposed from the remote state"}],correct:"B",exp:"<code>data.terraform_remote_state.name.outputs.key</code> accesses <strong>outputs from another Terraform configuration's state</strong>. This is the primary mechanism for sharing infrastructure data (VPC IDs, subnet IDs) between separately-managed Terraform configurations."}
];

// ── APP STATE ──────────────────────────────────────────────────────────────
let currentSet = 0;
let questions = [];          // shuffled questions for current set
let userAnswers = {};        // {qIndex: "B" or ["A","C"]}
let flagged = new Set();
let submitted = false;
let timerInterval = null;
let secondsLeft = 5400;

const SETS = [set1, set2, set3, set4, set5];

// ── SHUFFLE ────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareSet(setIndex) {
  const letters = ["A","B","C","D"];
  const raw = SETS[setIndex].slice(0, 57);
  return raw.map(q => {
    // build index: original label → option object
    const byLabel = {};
    q.options.forEach(o => { byLabel[o.l] = o; });

    // shuffle the four original labels
    const origLabels = q.options.map(o => o.l);
    for (let i = origLabels.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [origLabels[i], origLabels[j]] = [origLabels[j], origLabels[i]];
    }

    // assign new letters A-D to the shuffled order
    const newOptions = origLabels.map((oldL, i) => ({
      l: letters[i],
      t: byLabel[oldL].t
    }));

    // build old→new label map
    const oldToNew = {};
    origLabels.forEach((oldL, i) => { oldToNew[oldL] = letters[i]; });

    const newCorrect = Array.isArray(q.correct)
      ? q.correct.map(c => oldToNew[c])
      : oldToNew[q.correct];

    return { ...q, options: newOptions, correct: newCorrect };
  });
}

// ── TIMER ──────────────────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  secondsLeft = 5400;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      submitExam(true);
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60);
  const s = secondsLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer-value' + (secondsLeft <= 300 ? ' danger' : secondsLeft <= 900 ? ' warning' : '');
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderExam() {
  const container = document.getElementById('mainContainer');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    container.innerHTML += buildCard(q, i);
  });
  updateScoreBar();
  document.getElementById('stickyBottom').innerHTML = `
    <button class="btn btn-secondary" onclick="clearAnswers()">Clear All</button>
    <button class="btn btn-primary" onclick="submitExam()">Submit Exam</button>`;
}

function buildCard(q, i) {
  const ans = userAnswers[i];
  const isMulti = !!q.multi;
  const isFlagged = flagged.has(i);
  let cardClass = 'question-card';
  if (ans !== undefined && (Array.isArray(ans) ? ans.length > 0 : ans !== '')) cardClass += ' answered';
  if (isFlagged) cardClass += ' flagged';

  let optsHtml = '';
  q.options.forEach(opt => {
    let optClass = 'option';
    const selected = Array.isArray(ans) ? ans.includes(opt.l) : ans === opt.l;
    if (selected) optClass += ' selected';
    optsHtml += `<div class="${optClass}" onclick="selectOption(${i},'${opt.l}',${isMulti})">
      <span class="opt-label">${opt.l}</span>
      <span class="opt-text">${opt.t}</span>
    </div>`;
  });

  return `<div class="${cardClass}" id="card-${i}">
    <div class="q-header">
      <span class="q-number">Q${i+1}</span>
      <span class="q-domain">${q.domain}</span>
      <span class="q-text">${q.text}</span>
      <button class="flag-btn ${isFlagged?'flagged':''}" onclick="toggleFlag(${i})" title="Flag question">⚑</button>
    </div>
    ${isMulti ? '<div class="multi-note">⚡ Multi-select — choose all that apply</div>' : ''}
    <div class="options" id="opts-${i}">${optsHtml}</div>
  </div>`;
}

function selectOption(qIndex, label, isMulti) {
  if (submitted) return;
  if (isMulti) {
    if (!Array.isArray(userAnswers[qIndex])) userAnswers[qIndex] = [];
    const idx = userAnswers[qIndex].indexOf(label);
    if (idx === -1) userAnswers[qIndex].push(label);
    else userAnswers[qIndex].splice(idx, 1);
  } else {
    userAnswers[qIndex] = label;
  }
  refreshCard(qIndex);
  updateScoreBar();
}

function refreshCard(i) {
  const q = questions[i];
  const ans = userAnswers[i];
  const isMulti = !!q.multi;
  const isFlagged = flagged.has(i);
  const card = document.getElementById('card-' + i);
  if (!card) return;

  const hasAnswer = Array.isArray(ans) ? ans.length > 0 : !!ans;
  card.className = 'question-card' + (hasAnswer ? ' answered' : '') + (isFlagged ? ' flagged' : '');

  const optsEl = document.getElementById('opts-' + i);
  optsEl.innerHTML = '';
  q.options.forEach(opt => {
    let optClass = 'option';
    const selected = Array.isArray(ans) ? ans.includes(opt.l) : ans === opt.l;
    if (selected) optClass += ' selected';
    const div = document.createElement('div');
    div.className = optClass;
    div.innerHTML = `<span class="opt-label">${opt.l}</span><span class="opt-text">${opt.t}</span>`;
    div.onclick = () => selectOption(i, opt.l, isMulti);
    optsEl.appendChild(div);
  });
}

function toggleFlag(i) {
  if (flagged.has(i)) flagged.delete(i);
  else flagged.add(i);
  refreshCard(i);
}

function updateScoreBar() {
  let correct = 0, wrong = 0, answered = 0;
  questions.forEach((q, i) => {
    const ans = userAnswers[i];
    if (ans === undefined || (Array.isArray(ans) && ans.length === 0)) return;
    answered++;
    if (isCorrect(q, ans)) correct++;
    else wrong++;
  });
  const total = questions.length;
  document.getElementById('liveCorrect').textContent = `Correct: ${correct}`;
  document.getElementById('liveWrong').textContent = `Wrong: ${wrong}`;
  document.getElementById('liveSkipped').textContent = `Unanswered: ${total - answered}`;
  document.getElementById('progressFill').style.width = `${(answered/total)*100}%`;
  document.getElementById('progressText').textContent = `${answered} / ${total} answered`;
}

function isCorrect(q, ans) {
  if (Array.isArray(q.correct)) {
    if (!Array.isArray(ans)) return false;
    return q.correct.length === ans.length && q.correct.every(c => ans.includes(c));
  }
  return ans === q.correct;
}

// ── SUBMIT ─────────────────────────────────────────────────────────────────
function submitExam(auto) {
  if (submitted) return;
  if (!auto) {
    const unanswered = questions.filter((_, i) => {
      const a = userAnswers[i];
      return a === undefined || (Array.isArray(a) && a.length === 0);
    }).length;
    if (unanswered > 0) {
      if (!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;
    }
  }
  clearInterval(timerInterval);
  submitted = true;

  let correct = 0;
  questions.forEach((q, i) => {
    const ans = userAnswers[i];
    if (isCorrect(q, ans)) correct++;
  });

  const total = questions.length;
  const pct = Math.round((correct / total) * 100);
  const passed = correct >= Math.ceil(total * 0.70);

  const container = document.getElementById('mainContainer');
  let resultsHtml = `<div class="results-header">
    <h2>Exam Results — Set ${currentSet + 1}</h2>
    <div class="score-circle ${passed?'pass':'fail'}">${pct}%</div>
    <div class="results-stats">
      <div class="stat"><div class="stat-val" style="color:#059669">${correct}</div><div class="stat-lbl">Correct</div></div>
      <div class="stat"><div class="stat-val" style="color:#dc2626">${total - correct}</div><div class="stat-lbl">Wrong/Missed</div></div>
      <div class="stat"><div class="stat-val">${total}</div><div class="stat-lbl">Total</div></div>
      <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-lbl">Score</div></div>
    </div>
    <div class="pass-msg ${passed?'pass':'fail'}">${passed ? '✓ PASS — Well done!' : '✗ FAIL — Need 70% (40/57) to pass'}</div>
  </div>`;

  questions.forEach((q, i) => {
    const ans = userAnswers[i];
    const hasAns = ans !== undefined && !(Array.isArray(ans) && ans.length === 0);
    const correct_ans = isCorrect(q, ans);
    let cardClass = 'question-card ';
    if (!hasAns) cardClass += '';
    else if (correct_ans) cardClass += 'correct-card';
    else cardClass += 'wrong-card';

    const isFlagged = flagged.has(i);
    if (isFlagged) cardClass += ' flagged';

    let badge = '';
    if (!hasAns) badge = '';
    else if (correct_ans) badge = '<span class="result-badge correct">✓ Correct</span>';
    else badge = '<span class="result-badge wrong">✗ Incorrect</span>';

    let optsHtml = '';
    q.options.forEach(opt => {
      const isCorrectOpt = Array.isArray(q.correct) ? q.correct.includes(opt.l) : opt.l === q.correct;
      const selected = Array.isArray(ans) ? ans.includes(opt.l) : ans === opt.l;
      let optClass = 'option';
      if (selected && isCorrectOpt) optClass += ' correct-opt';
      else if (selected && !isCorrectOpt) optClass += ' wrong-opt';
      else if (!selected && isCorrectOpt) optClass += ' show-correct';
      optsHtml += `<div class="${optClass}">
        <span class="opt-label">${opt.l}</span>
        <span class="opt-text">${opt.t}</span>
      </div>`;
    });

    resultsHtml += `<div class="${cardClass}">
      <div class="q-header">
        <span class="q-number">Q${i+1}</span>
        <span class="q-domain">${q.domain}</span>
        <span class="q-text">${q.text}</span>
      </div>
      ${badge}
      ${q.multi ? '<div class="multi-note">⚡ Multi-select</div>' : ''}
      <div class="options">${optsHtml}</div>
      <div class="explanation"><strong>Explanation:</strong> ${q.exp}</div>
    </div>`;
  });

  container.innerHTML = resultsHtml;

  document.getElementById('stickyBottom').innerHTML = `
    <button class="btn btn-secondary" onclick="newAttempt()">New Attempt (Same Set)</button>
    <button class="btn btn-success" onclick="scrollTop()">Back to Top</button>`;

  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = `${total} / ${total} answered`;
  document.getElementById('liveCorrect').textContent = `Correct: ${correct}`;
  document.getElementById('liveWrong').textContent = `Wrong/Missed: ${total - correct}`;
  document.getElementById('liveSkipped').textContent = `Score: ${pct}%`;
}

// ── CONTROLS ───────────────────────────────────────────────────────────────
function newAttempt() {
  userAnswers = {};
  flagged.clear();
  submitted = false;
  questions = prepareSet(currentSet);
  renderExam();
  startTimer();
  window.scrollTo(0, 0);
}

function clearAnswers() {
  if (submitted) return;
  if (!confirm('Clear all answers?')) return;
  userAnswers = {};
  questions.forEach((_, i) => refreshCard(i));
  updateScoreBar();
}

function switchSet(index) {
  if (index === currentSet) return;
  if (!submitted && Object.keys(userAnswers).length > 0) {
    if (!confirm('Switching sets will reset your current progress. Continue?')) return;
  }
  currentSet = index;
  document.querySelectorAll('.set-btn').forEach((b, i) => b.classList.toggle('active', i === index));
  userAnswers = {};
  flagged.clear();
  submitted = false;
  questions = prepareSet(currentSet);
  renderExam();
  startTimer();
  window.scrollTo(0, 0);
}

function scrollTop() { window.scrollTo(0, 0); }

// ── INIT ───────────────────────────────────────────────────────────────────
questions = prepareSet(0);
renderExam();
startTimer();
</script>
</body>
</html>
